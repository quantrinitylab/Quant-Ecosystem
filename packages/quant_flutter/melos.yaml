name: quant_flutter
repository: https://github.com/quantrinitylab/Quant-Ecosystem

packages:
  - quant_ui
  - quant_core

command:
  version:
    linkToCommits: true
    workspaceChangelog: true

scripts:
  analyze:
    run: flutter analyze .
    exec:
      concurrency: 4
    description: Run static analysis across all workspace packages.

  test:
    run: flutter test
    exec:
      concurrency: 4
      dirExists: test
    description: Run all Flutter unit and widget tests.

  get:
    run: flutter pub get
    exec:
      concurrency: 4
    description: Resolve dependencies in all packages.
