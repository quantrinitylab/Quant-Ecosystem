name: quant_ui
description: Sovereign Obsidian Luxury Design System for Flutter in Quant Ecosystem.
version: 1.0.0
homepage: https://quantrinity.in
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/logos/
