  /oauth/authorize:
    get:
      tags:
      - OAuth
      summary: OAuth2 authorization endpoint (protected - needs Bearer token)
      operationId: getOauthAuthorize
      responses:
        '302':
          description: Redirect to redirect_uri with ?code= or ?error=
        '200':
          description: HTML consent screen
        '400':
          description: invalid_request (bad response_type/client_id/redirect_uri)
        '401':
          description: Missing/invalid Bearer token
      security:
      - BearerAuth: []
      description: 'Requires Authorization: Bearer <access_token> (cookie is NOT enough). Auto-approves with 302 to redirect_uri
        when consent exists; otherwise renders an HTML consent screen posting to /oauth/consent. Auth code: ac_-prefixed,
        5-min TTL, single-use.'
      parameters:
      - name: response_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - code
      - name: client_id
        in: query
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
          format: uri
        description: Must exactly match a registered redirect URI
      - name: scope
        in: query
        required: false
        schema:
          type: string
        description: Space-separated; default "openid profile email"
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge
        in: query
        required: false
        schema:
          type: string
      - name: code_challenge_method
        in: query
        required: false
        schema:
          type: string
          enum:
          - plain
          - S256
      - name: nonce
        in: query
        required: false
        schema:
          type: string
  /oauth/consent:
    post:
      tags:
      - OAuth
      summary: OAuth2 consent decision (protected)
      operationId: postOauthConsent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - approve
                  - deny
                client_id:
                  type: string
                redirect_uri:
                  type: string
                user_id:
                  type: string
                  description: Must match the Bearer token user
                scope:
                  type: string
                state:
                  type: string
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                nonce:
                  type: string
              required:
              - action
              - client_id
              - redirect_uri
      responses:
        '302':
          description: Redirect to redirect_uri with ?code= or ?error=access_denied
        '400':
          description: invalid_request
        '401':
          description: Unauthorized
        '403':
          description: user_id mismatch
      security:
      - BearerAuth: []
  /oauth/register:
    post:
      tags:
      - OAuth
      summary: OAuth2 dynamic client registration (public)
      operationId: postOauthRegister
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
                scopes:
                  type: array
                  items:
                    type: string
                is_confidential:
                  type: boolean
                  default: true
                  description: false = public client, no secret
              required:
              - name
              - redirect_uris
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessWrapper'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Client registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id:
                    type: string
                  client_secret:
                    type: string
                    nullable: true
                  name:
                    type: string
      security: []
  /oauth/revoke:
    post:
      tags:
      - OAuth
      summary: Revoke an access or refresh token (public, RFC 7009)
      operationId: postOauthRevoke
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
      responses:
        '200':
          description: Always 200 {success:true}, even for unknown tokens
      security: []
  /oauth/token:
    post:
      tags:
      - OAuth
      summary: OAuth2 token endpoint (JSON body; PKCE supported)
      operationId: postOauthToken
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                description: authorization_code grant
                properties:
                  grant_type:
                    type: string
                    enum:
                    - authorization_code
                  code:
                    type: string
                  redirect_uri:
                    type: string
                  client_id:
                    type: string
                  code_verifier:
                    type: string
                  client_secret:
                    type: string
                    description: Confidential clients only
                required:
                - grant_type
                - code
                - redirect_uri
              - type: object
                description: refresh_token grant
                properties:
                  grant_type:
                    type: string
                    enum:
                    - refresh_token
                  refresh_token:
                    type: string
                required:
                - grant_type
                - refresh_token
      responses:
        '200':
          description: Token pair issued (refresh_token in JSON body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: invalid_grant / invalid_request / PKCE failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
      security: []
      description: 'Public. application/json ONLY (no form-urlencoded parser). Both grants return refresh_token IN THE JSON
        BODY (native-safe). authorization_code: code is single-use, 5-min TTL; PKCE code_verifier mandatory when a challenge
        was bound; redirect_uri must byte-match the authorize call. refresh_token: rotates; reuse of a superseded token revokes
        the whole family.'
