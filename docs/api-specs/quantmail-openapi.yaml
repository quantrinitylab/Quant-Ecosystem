    BrowserLoginResponse:
      type: object
      description: Response of POST /auth/login. The refresh token is NEVER in this JSON body; it is set only as the HttpOnly
        cookie `quantmail_refresh` (Path=/auth, Max-Age=2592000). Verified in backend/lib/auth-session.ts.
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            userId:
              type: string
            accessToken:
              type: string
              description: Short-lived JWT (15 min)
            expiresIn:
              type: integer
              example: 900
            tokenType:
              type: string
              example: Bearer
            user:
              $ref: '#/components/schemas/User'
          required:
          - userId
          - accessToken
          - expiresIn
          - tokenType
    OAuthTokenResponse:
      type: object
      description: Response of POST /oauth/token for BOTH grants (authorization_code and refresh_token). Unlike /auth/login,
        the refresh_token IS returned in the JSON body here - this is the native/Flutter-safe path. Verified in backend/routes/oauth.ts
        toTokenResponse.
      properties:
        access_token:
          type: string
          description: JWT, 900s TTL
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 900
        refresh_token:
          type: string
          description: JWT, 30-day TTL, rotated on each use
        scope:
          type: string
          example: openid profile email
          description: Empty string on refresh_token grant responses
        id_token:
          type: string
          description: RS256 JWT, present only when openid scope granted
      required:
      - access_token
      - token_type
      - expires_in
      - refresh_token
      - scope
