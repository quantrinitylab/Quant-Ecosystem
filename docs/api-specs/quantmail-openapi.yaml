components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session/OAuth access token (15 min TTL). Also accepted via quant_access_token cookie or ?token= query by
        the global hook; Bearer header is the documented path.
    BasicAuth:
      type: http
      scheme: basic
      description: DAV routes (/dav) negotiate RFC 4791 HTTP Basic Auth or Bearer via their own preHandler.
    PatAuth:
      type: http
      scheme: bearer
      description: Repo-scoped personal access token for the Smart HTTP git transport (/api/code/gitd). Verified by the route
        itself, not the global JWT hook.
  schemas:
    messageSchema:
      type: object
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
          minLength: 1
          maxLength: 6000
      required:
      - role
      - content
    chatSchema:
      type: object
      properties:
        messages:
          type: array
          items:
            type: object
            description: 'zod: messageSchema).min(1).max(24'
        intent:
          type: object
          description: 'zod: z.enum(AI_INTENTS)'
        context:
          type: object
          description: "zod: z\n    .object({\n      app: z.string().max(200).optional(),\n      route: z.string"
        tools:
          type: object
          description: "zod: z\n    .object({\n      enabled: z.boolean().default(false),\n      allow: z.array("
      required:
      - messages
    composeSchema:
      type: object
      properties:
        instructions:
          type: string
          minLength: 1
          maxLength: 4000
