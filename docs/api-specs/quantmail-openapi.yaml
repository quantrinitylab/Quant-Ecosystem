openapi: 3.1.0
info:
  title: QuantMail API (repaired)
  version: 1.0.0
  description: 'Repaired OpenAPI spec generated read-only from apps/quantmail/backend route sources (ref ca23e3b9). Base path
    fixed: the server has no /api/v1 base path; routes are mounted at their literal prefixes (/emails, /auth/login, /api/v1/ai/triage,
    ...). Auth: Bearer JWT by default; public endpoints marked security: []. POST /oauth/token returns refresh_token in the
    JSON body; POST /auth/login sets it as an HttpOnly cookie only. See REPAIR_REPORT.md.'
  contact:
    name: Quant Eco
servers:
- url: https://quantmail.com
  description: Production (QUANTMAIL_ISSUER default)
- url: http://localhost:3010
  description: Local backend default (PORT=3010)
tags:
- name: Mail
- name: Auth
- name: OAuth
- name: AI
- name: Calendar
- name: Drive
- name: Documents
- name: Code
- name: CI
- name: Contacts
- name: DAV
- name: Workspaces
- name: Notifications
- name: Attachments
- name: Billing
- name: Admin
- name: Audit
- name: Retention
- name: Deliverability
- name: Domains
- name: E2EE
- name: Federation
- name: Mail Settings
- name: Search
- name: Settings
- name: Webhooks
- name: System
paths:
  /.well-known/caldav:
    get:
      tags:
      - System
      summary: List .well known caldav
      operationId: getWellKnownCaldav
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
