        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessWrapper'
      security: []
      x-webdav-method: PROPFIND
      description: Actual HTTP method is PROPFIND (WebDAV/CalDAV/CardDAV).
  /.well-known/carddav:
