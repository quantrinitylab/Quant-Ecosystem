      responses:
        '200':
          description: OK - session issued OR 2FA challenge
          headers:
            Set-Cookie:
              description: quantmail_refresh HttpOnly refresh cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BrowserLoginResponse'
                - type: object
                  properties:
                    success:
                      type: boolean
                    data:
                      type: object
                      properties:
                        twoFactorRequired:
                          type: boolean
                        challenge:
                          type: string
                        expiresIn:
                          type: integer
        '400':
          description: Missing email/password
        '401':
          description: Invalid credentials
        '409':
          description: 2FA state invalid - account recovery required
        '429':
          description: Rate limited (5/min)
      security: []
      description: JSON {email, password}. Rate-limited 5/min and requires an allowlisted Origin. Returns access token in
        JSON; the refresh token is set ONLY as the HttpOnly cookie `quantmail_refresh` (Path=/auth, Secure, SameSite=Strict,
        Max-Age=2592000) - never in the body. If the account has 2FA enabled, returns {twoFactorRequired:true, challenge,
        expiresIn} with no tokens.
