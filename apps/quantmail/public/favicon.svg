<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    QuantMail favicon — the signature "M" on the ember plate.
    Hand-authored vector reproduction of the canonical Canvas 2D live mark
    (apps/quantmail/src/components/QuantMailLogo.tsx + lib/marks/canvas-mark.ts):
    - plate: squircle, half=45, radius=22 -> rect(5,5,90,90,rx22)
    - ember floor: radial centred (42,40) r=82, stops #FFC189/#FF9450/#FF8C42/#C8520F/#6E2606
    - M: the restored 54x44 bezier (x=23,y=30), foot arcs r=7, white body ramp
    - eyes: warm-dark pupils at (40.5,60)/(59.5,60) r=3.5 — the face that makes it the mark
    No raster, no AI-generated art.
  -->
  <defs>
    <radialGradient id="qm-ember" cx="42" cy="40" r="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC189"/>
      <stop offset="0.3" stop-color="#FF9450"/>
      <stop offset="0.5" stop-color="#FF8C42"/>
      <stop offset="0.74" stop-color="#C8520F"/>
      <stop offset="1" stop-color="#6E2606"/>
    </radialGradient>
    <linearGradient id="qm-bezel" x1="50" y1="5" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF0DC" stop-opacity="0.5"/>
      <stop offset="0.3" stop-color="#FFE2C4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFD6B0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="qm-paper" x1="23" y1="30" x2="77" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.46" stop-color="#F7F8FB"/>
      <stop offset="1" stop-color="#E3E6ED"/>
    </linearGradient>
    <radialGradient id="qm-notch" cx="50" cy="47" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#783A14" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#783A14" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#783A14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qm-bounce" x1="0" y1="59" x2="0" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF9650" stop-opacity="0"/>
      <stop offset="1" stop-color="#FF9650" stop-opacity="0.3"/>
    </linearGradient>
    <clipPath id="qm-mclip">
      <path d="M 30 74 A 7 7 0 0 1 23 67 L 23 42 C 23 34 27 30 32 30 C 38 32 44 47 50 47 C 56 47 62 32 68 30 C 73 30 77 34 77 42 L 77 67 A 7 7 0 0 1 70 74 Z"/>
    </clipPath>
    <filter id="qm-mshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="3.5" flood-color="#2E1002" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- ember plate -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#qm-ember)"/>
  <!-- fresnel bezel -->
  <rect x="6.5" y="6.5" width="87" height="87" rx="20.5" fill="none" stroke="url(#qm-bezel)" stroke-width="2"/>

  <!-- the M -->
  <g filter="url(#qm-mshadow)">
    <path d="M 30 74 A 7 7 0 0 1 23 67 L 23 42 C 23 34 27 30 32 30 C 38 32 44 47 50 47 C 56 47 62 32 68 30 C 73 30 77 34 77 42 L 77 67 A 7 7 0 0 1 70 74 Z" fill="url(#qm-paper)"/>
    <g clip-path="url(#qm-mclip)">
      <rect x="23" y="30" width="54" height="30" fill="url(#qm-notch)"/>
      <rect x="23" y="59" width="54" height="15" fill="url(#qm-bounce)"/>
    </g>
    <!-- pupils -->
    <circle cx="40.5" cy="60" r="3.5" fill="#170F0A"/>
    <circle cx="59.5" cy="60" r="3.5" fill="#170F0A"/>
  </g>
</svg>
