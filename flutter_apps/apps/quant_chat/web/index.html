<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="QuantChat · Sovereign WhatsApp, Signal &amp; Telegram Killer E2EE Communications Platform">

  <!-- Viewport settings -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- PWA & Mobile Web Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="QuantChat">
  <meta name="theme-color" content="#090A0E">
  <meta name="msapplication-navbutton-color" content="#090A0E">

  <!-- Sovereign Obsidian Luxury Branding -->
  <title>QuantChat · Sovereign E2EE Communications</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    :root {
      --bg-void: #090A0E;
      --accent-amber: #FF8C42;
      --card-slate: #12151E;
      --border-hairline: #232938;
      --text-primary: #F8FAFC;
      --text-muted: #64748B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #app-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #sovereign-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: radial-gradient(circle at 50% 30%, #151926 0%, #090A0E 70%);
      transition: opacity 0.4s ease-out;
    }

    .loader-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .loader-glyph {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #FF8C42 0%, #FF6B00 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 24px;
      color: #FFFFFF;
      box-shadow: 0 8px 24px rgba(255, 140, 66, 0.35);
    }

    .loader-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #FFFFFF;
    }

    .loader-title span {
      color: var(--accent-amber);
    }

    .loader-bar-bg {
      width: 220px;
      height: 4px;
      background: var(--card-slate);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border-hairline);
    }

    .loader-bar-fill {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #FF8C42, #38BDF8);
      border-radius: 999px;
      animation: pulse-indeterminate 1.4s ease-in-out infinite alternate;
    }

    .loader-telemetry {
      margin-top: 14px;
      font-size: 11px;
      font-family: monospace;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    @keyframes pulse-indeterminate {
      0% {
        transform: translateX(-60%);
        width: 30%;
      }
      100% {
        transform: translateX(180%);
        width: 60%;
      }
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="sovereign-loader">
      <div class="loader-brand">
        <div class="loader-glyph">Q</div>
        <div class="loader-title">Quant<span>Chat</span></div>
      </div>
      <div class="loader-bar-bg">
        <div class="loader-bar-fill"></div>
      </div>
      <div class="loader-telemetry">INITIALIZING 120HZ SOVEREIGN CHAT · LATENCY &lt;18MS</div>
    </div>
  </div>

  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('load', function(ev) {
      if (!_flutter) return;
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: {{flutter_service_worker_version}},
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            renderer: 'canvaskit',
            useColorEmoji: true,
          }).then(function(appRunner) {
            const loader = document.getElementById('sovereign-loader');
            if (loader) {
              loader.style.opacity = '0';
              setTimeout(() => loader.remove(), 400);
            }
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
