name: quant_chat
description: 'Sovereign E2EE WhatsApp & Signal Killer Flutter Application for Quant Ecosystem.'
version: 1.0.0
homepage: https://quantchat.in
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  quant_theme:
    path: ../../packages/quant_theme
  quant_ui:
    path: ../../packages/quant_ui
  quant_core:
    path: ../../packages/quant_core
  # Phase 2C (Stories): first-party / BSD-3 media plugins only.
  # dio matches quant_core's ^5.8.0+1 to keep version resolution unified.
  dio: ^5.8.0+1
  image_picker: ^1.1.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
