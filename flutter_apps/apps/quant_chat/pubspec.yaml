name: quant_chat
description: 'QuantChat messaging application for the Quant Ecosystem.'
version: 1.0.0
homepage: https://quantchat.in
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  quant_theme:
    path: ../../packages/quant_theme
  quant_ui:
    path: ../../packages/quant_ui
  quant_core:
    path: ../../packages/quant_core
  # BSD-3 (flutter.dev). Used by QuickCaptureScreen for addressed quick snaps.
  # Same version as the Phase 1A camera tab to keep future merges clean.
  camera: ^0.10.5+9

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
