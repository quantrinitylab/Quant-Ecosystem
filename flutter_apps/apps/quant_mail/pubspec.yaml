name: quant_mail
description: Sovereign Superhuman & Gmail Killer Flutter Application for Quant Ecosystem.
version: 1.0.0
homepage: https://quantmail.in
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  quant_theme:
    path: ../../packages/quant_theme
  quant_ui:
    path: ../../packages/quant_ui
  quant_api:
    path: ../../packages/quant_api
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/mascots/
    - assets/quantrinity_blackhole.png
    - assets/quantrinity_wordmark.png
    - assets/quantworkplace_wordmark.png
    - assets/quantworkplace_cursive_badge.png
    - assets/quantrinity_cursive_badge.png
    - assets/gargantua_master.png
    - assets/quant-ai-logo.jpg
    - assets/quantrinity_blackhole.jpg
    - assets/quantrinity_lockup.jpg
