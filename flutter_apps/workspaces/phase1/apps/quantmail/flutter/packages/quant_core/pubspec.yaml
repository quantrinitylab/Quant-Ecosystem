name: quant_core
description: >-
  QuantMail shared core — domain models, repositories, and Riverpod providers
  for the Phase 1 vertical slice (Login → Inbox → Thread).
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client — imported directly by auth_repository.dart (and wire-path
  # tests); declared explicitly so `depend_on_referenced_packages` stays clean.
  dio: ^5.11.1

  # State management (plain providers; no codegen / build_runner in Phase 1).
  flutter_riverpod: ^2.5.3

  # M4 drift persistence layer: SQLite offline cache.
  drift: ^2.28.0
  sqlite3: ^2.7.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Phase 0 foundation: Dio API client, TokenManager, OAuth2 PKCE helpers,
  # @quant/brand Material 3 theme. Lives outside this workspace (read-only).
  quant_foundation:
    path: ../../../../../../phase0/foundation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # M4: drift codegen for mail_database.dart.
  drift_dev: ^2.28.0
  build_runner: ^2.4.0
