name: quantmax_app
description: >-
  QuantMax omnipresent Flutter app — short-video/discovery client competing
  with TikTok. Shift 1: melos scaffold (W1) + QuantMail SSO login slice (W4).
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management + navigation.
  flutter_riverpod: ^2.5.3
  go_router: ^14.2.0

  # HTTP + secure token storage (wired in quantmax_core's provider graph).
  dio: ^5.7.0
  flutter_secure_storage: ^10.0.0

  # System browser for the OAuth2 consent step (W4's browser_launcher).
  url_launcher: ^6.3.0

  # Local workspace packages.
  quantmax_core:
    path: ../quantmax_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
