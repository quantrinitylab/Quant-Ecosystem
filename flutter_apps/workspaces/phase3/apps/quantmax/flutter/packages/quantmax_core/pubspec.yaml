name: quantmax_core
description: >-
  QuantMax shared core — config, Riverpod providers, theme, auth, and API
  client for the short-video/discovery Flutter clients. Shift 1: W1 scaffold
  (config, bootstrap, core providers); W2 (theme) and W3 (auth/api) fill in
  their files against the barrel contract in lib/quantmax_core.dart.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (plain providers; no codegen / build_runner in Shift 1).
  flutter_riverpod: ^2.5.3

  # HTTP client + secure token storage for the W1 provider skeleton.
  dio: ^5.7.0
  flutter_secure_storage: ^10.0.0

  # Phase 0 foundation: Dio API client, TokenManager, OAuth2 PKCE helpers,
  # @quant/brand tokens. Lives outside this workspace (read-only from here).
  # Same nesting depth as phase1's quant_core, so the same relative path.
  quant_foundation:
    path: ../../../../../../phase0/foundation
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
