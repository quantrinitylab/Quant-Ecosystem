name: quant_wave_core
description: >-
  QuantWave shared core — @quant/brand theme, auth (OAuth2+PKCE via
  QuantMail SSO), and the Dio API core for the discussion/threads client.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client + token persistence + reactive auth state + crypto primitives
  # for the OAuth2+PKCE flow.
  dio: ^5.9.0
  flutter_secure_storage: ^10.0.0
  rxdart: ^0.28.0
  crypto: ^3.0.6

  # State management (plain providers; no codegen / build_runner).
  flutter_riverpod: ^2.5.3

  # Phase 0 foundation: Dio API client (interceptors), TokenManager,
  # OAuth2 PKCE helpers, @quant/brand Material 3 theme.
  # Lives outside this workspace (read-only).
  quant_foundation:
    path: ../../../../../../phase0/foundation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # TODO(UNVERIFIED): mocktail ^1.0.4 pinned once version availability is
  # confirmed on the SDK-equipped machine; keep out until pub get succeeds.
