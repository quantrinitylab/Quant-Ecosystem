name: quant_wave_app
description: >-
  QuantWave omnipresent Flutter app — the discussion/threads face of the
  Quant ecosystem, competing with X/Reddit.
  Phase 3 shift 1 scaffold: Login (OAuth2+PKCE via QuantMail SSO).
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management + navigation.
  flutter_riverpod: ^2.5.3
  go_router: ^14.2.0

  # System browser for the OAuth2 consent step.
  url_launcher: ^6.3.0

  # Local workspace package.
  quant_wave_core:
    path: ../quant_wave_core

  # Phase 0 foundation: Dio API client, TokenManager, OAuth2 PKCE helpers,
  # @quant/brand Material 3 theme. Lives outside this workspace (read-only).
  quant_foundation:
    path: ../../../../../../phase0/foundation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
