name: quantai_app
description: >-
  QuantAI dedicated Flutter app — the AI face of the Quant ecosystem.
  Shift 1: melos-style package scaffold, QuantAI theme (brand tokens +
  violet QuantAI identity), and the QuantMail SSO login (OAuth2 + PKCE).
  Conversation UI lands after the QuantAI API spec is wired.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management + navigation.
  flutter_riverpod: ^2.5.3
  go_router: ^14.2.0

  # System browser for the OAuth2 consent step (QuantMail SSO).
  url_launcher: ^6.3.0

  # Local workspace packages.
  # W1 owns quantai_core: auth-session contract (authSessionProvider,
  # pendingOAuthRedirectProvider, isSessionAuthenticatedProvider,
  # AuthSessionState sealed states, AuthSessionNotifier).
  quantai_core:
    path: ../quantai_core

  # Phase 0 foundation: @quant/brand design tokens (QuantColors,
  # QuantAppColors, QuantTextStyles). Lives outside this workspace
  # (read-only): imported, never copied.
  quant_foundation:
    path: ../../../../../../phase0/foundation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
