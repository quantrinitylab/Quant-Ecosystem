# Workspace-wide analyzer configuration for the QuantCooks Flutter packages.
#
# Every package under packages/ inherits this via the analyzer's upward
# directory lookup. `flutter_lints` must be a dev_dependency of each package.
# (Mirrors the QuantMail Phase 1 workspace config.)
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
