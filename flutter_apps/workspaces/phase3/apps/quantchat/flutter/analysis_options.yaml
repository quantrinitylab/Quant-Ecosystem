# Workspace-wide analyzer configuration for the QuantChat Flutter packages.
#
# Adapted from the QuantMail Phase 1 workspace
# (phase1/apps/quantmail/flutter/analysis_options.yaml).
#
# Every package under packages/ inherits this via the analyzer's upward
# directory lookup. `flutter_lints` must be a dev_dependency of each package.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
