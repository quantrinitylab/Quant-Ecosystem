name: quant_foundation
description: >-
  Foundation package for QuantMail omnipresent Flutter clients: Dio-based API
  client with auth/refresh/retry interceptors, secure TokenManager, OAuth2 PKCE
  helpers, and the openapi-generator config for the typed API client.
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client + interceptor stack (port of packages/api-client HttpClient).
  dio: ^5.9.0

  # Secure token persistence backend for TokenManager.
  flutter_secure_storage: ^10.0.0

  # BehaviorSubject for the auth-state stream (replays latest AuthState to
  # late subscribers). Single-flight refresh is plain-Dart (no rxdart needed).
  rxdart: ^0.28.0

  # SHA-256 for the PKCE S256 code_challenge.
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.6.0
  mocktail: ^1.0.4
  test: ^1.25.0

flutter:
  uses-material-design: false
