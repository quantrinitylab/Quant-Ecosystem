[package]
name = "quant-sheets-engine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Quant Docs — on-device XLSX/XLS/ODS/CSV preview with computed, formatted values, built on the GridCraft engine (MIT OR Apache-2.0)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gridcraft-engine = { git = "https://github.com/storytold/gridcraft", rev = "84acf6293b1dc1fc09837524e035d674eb4d6741" }
gridcraft-core = { git = "https://github.com/storytold/gridcraft", rev = "84acf6293b1dc1fc09837524e035d674eb4d6741" }
gridcraft-model = { git = "https://github.com/storytold/gridcraft", rev = "84acf6293b1dc1fc09837524e035d674eb4d6741" }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
