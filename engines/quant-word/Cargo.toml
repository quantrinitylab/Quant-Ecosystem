[package]
name = "quant-word-engine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Quant Docs — on-device DOCX/DOC/ODT/RTF page rendering, built on the WordCraft engine (MIT OR Apache-2.0)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wordcraft-engine = { git = "https://github.com/storytold/wordcraft", rev = "04f6f53b8a4d8140c7bb62f949b0a6099a473da1" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
