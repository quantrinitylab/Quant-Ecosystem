# cargo-deny policy for the Quant Docs engines (run per crate: `cargo deny --manifest-path
# quant-pdf/Cargo.toml check --config deny.toml`). Permissive licences only — no copyleft,
# no share-alike (e.g. PdfCraft's CC-BY-SA OCR models are not part of these builds), no
# unknown registries, and git sources limited to the pinned ArtCraft engine repositories.
[graph]
targets = ["wasm32-unknown-unknown"]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/storytold/pdfcraft",
    "https://github.com/storytold/wordcraft",
    "https://github.com/storytold/deckcraft",
    "https://github.com/storytold/gridcraft",
]

[advisories]
yanked = "warn"
