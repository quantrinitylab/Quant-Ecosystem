name: smoke-live

# Turns "we think it is live" into a test.
#
# Status codes alone cannot tell a working app from a dead shell: every app
# proxies `/api/*` behind an auth check that runs before route matching, so
# any unknown API path answers 401 whether or not a backend is behind it, and a
# logged-out Next.js shell answers 200 with a body that renders nothing. So each
# live host is asserted on what a user actually gets:
#
#   1. `/` returns 200 and, rendered in a headless browser, produces real text.
#      This is the check that catches the blank-shell failure several hosts
#      shipped for weeks while returning 200 to every monitor.
#   2. `/login` exists, where the app is login-gated.
#   3. An authenticated API route answers 401 rather than 404 or 5xx.
#
# Hosts in `mode: down` are recorded, never asserted: they are the ledger of
# what is still not live. Flip one to `mode: live` in the PR that ships it.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.host }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: quantmail.in
            mode: live
            authed_path: /api/emails
            login_required: 'true'
          - host: quantchat.quantrinity.in
            mode: live
            authed_path: /api/conversations
            login_required: 'true'
          - host: quantai.quantrinity.in
            mode: live
            authed_path: /api/sessions
            login_required: 'false'
          - host: quanttrinity.quantrinity.in
            mode: down
          - host: quantads.quantrinity.in
            mode: down
          - host: quantube.quantrinity.in
            mode: down
          - host: quantmax.quantrinity.in
            mode: down
          - host: quantsync.quantrinity.in
            mode: down
          - host: quantneon.quantrinity.in
            mode: down
          - host: quantedits.quantrinity.in
            mode: down
    steps:
      - name: Probe ${{ matrix.host }}
        shell: bash
        env:
          HOST: ${{ matrix.host }}
          MODE: ${{ matrix.mode }}
          AUTHED_PATH: ${{ matrix.authed_path }}
          LOGIN_REQUIRED: ${{ matrix.login_required }}
          MIN_RENDERED_CHARS: '150'
        run: |
          set -uo pipefail
          fail=0

          probe() { curl -s -o /tmp/body -w '%{http_code}' --connect-timeout 15 --max-time 40 "https://$HOST$1" || echo 000; }
          strip_markup() { python3 -c "import re,sys;h=sys.stdin.read();h=re.sub(r'<script.*?</script>','',h,flags=re.S);h=re.sub(r'<style.*?</style>','',h,flags=re.S);print(len(re.sub(r'\\s+',' ',re.sub(r'<[^>]*>',' ',h)).strip()))"; }

          browser=''
          for candidate in google-chrome chromium-browser chromium; do
            if command -v "$candidate" >/dev/null 2>&1; then browser="$candidate"; break; fi
          done

          home_code="$(probe /)"
          static_chars="$(strip_markup < /tmp/body)"
          login_code="$(probe /login)"
          health_code="$(probe /api/health)"

          rendered_chars='no-browser'
          if [ -n "$browser" ]; then
            "$browser" --headless --disable-gpu --no-sandbox --virtual-time-budget=9000 \
              --dump-dom "https://$HOST/" > /tmp/dom 2>/dev/null || true
            rendered_chars="$(strip_markup < /tmp/dom)"
          fi

          authed_code='skipped'
          if [ -n "${AUTHED_PATH:-}" ]; then authed_code="$(probe "$AUTHED_PATH")"; fi

          {
            echo "### $HOST (mode: $MODE)"
            echo ''
            echo '| Probe | Result |'
            echo '| --- | --- |'
            echo "| \`GET /\` | $home_code |"
            echo "| characters in raw HTML | $static_chars |"
            echo "| characters after render | $rendered_chars |"
            echo "| \`GET /login\` | $login_code |"
            echo "| \`GET /api/health\` | $health_code (informational) |"
            echo "| \`GET ${AUTHED_PATH:-n/a}\` | $authed_code |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MODE" != 'live' ]; then
            echo "$HOST is tracked as not-live; recorded without assertions."
            exit 0
          fi

          [ "$home_code" = '200' ] || { echo "FAIL: GET / returned $home_code"; fail=1; }

          if [ "$rendered_chars" = 'no-browser' ]; then
            echo "WARNING: no headless browser on this runner; the render check was skipped."
          elif [ "$rendered_chars" -lt "$MIN_RENDERED_CHARS" ] 2>/dev/null; then
            echo "FAIL: / rendered $rendered_chars characters (expected >= $MIN_RENDERED_CHARS) — blank shell"
            fail=1
          fi

          if [ "$LOGIN_REQUIRED" = 'true' ] && [ "$login_code" != '200' ]; then
            echo "FAIL: GET /login returned $login_code"
            fail=1
          fi

          if [ -n "${AUTHED_PATH:-}" ] && [ "$authed_code" != '401' ]; then
            echo "FAIL: $AUTHED_PATH returned $authed_code (expected 401 from a live, auth-enforcing backend)"
            fail=1
          fi

          exit "$fail"
