apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: quant-platform-environments
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - environment: staging
            namespace: quant-staging
            targetRevision: main
            valuesFile: values-staging.yaml
            syncWave: '1'
          - environment: production
            namespace: quant-production
            targetRevision: main
            valuesFile: values-production.yaml
            syncWave: '2'
  template:
    metadata:
      name: 'quant-platform-{{environment}}'
      namespace: argocd
      labels:
        app.kubernetes.io/part-of: quant-platform
        environment: '{{environment}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{syncWave}}'
        notifications.argoproj.io/subscribe.on-sync-succeeded.slack: quant-deployments
        notifications.argoproj.io/subscribe.on-sync-failed.slack: quant-deployments
        notifications.argoproj.io/subscribe.on-health-degraded.slack: quant-alerts
    spec:
      project: quant-platform
      source:
        repoURL: https://github.com/quantrinitylabsgo/Quant-Ecosystem.git
        targetRevision: '{{targetRevision}}'
        path: infra/helm/quant-platform
        helm:
          valueFiles:
            - values.yaml
            - '{{valuesFile}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        managedNamespaceMetadata:
          labels:
            environment: '{{environment}}'
            managed-by: argocd
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: environment
              operator: In
              values:
                - staging
          maxUpdate: 1
        - matchExpressions:
            - key: environment
              operator: In
              values:
                - production
          maxUpdate: 1
  syncPolicy:
    preserveResourcesOnDeletion: true
