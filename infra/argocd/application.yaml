apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quant-platform-production
  namespace: argocd
spec:
  project: quant-platform
  source:
    repoURL: https://github.com/quantrinitylabsgo/Quant-Ecosystem.git
    targetRevision: main
    path: infra/helm/quant-platform
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: quant-production
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
