#cloud-config
# First-boot setup for the Stalwart lab VM (Oracle Linux 9, x86_64 or aarch64).
# create-lab.ps1 replaces __REPO_URL__, __REPO_BRANCH__ and __FQDN__ and writes the result to lab/.state/.
# It installs Docker CE + the compose plugin, opens the mail ports in the OS firewall, adds swap on small
# shapes and fetches infra/mail from the public repo (sparse checkout). It does not start Stalwart.
# Port 22 stays closed to the internet (the OCI Bastion reaches sshd from inside the subnet).

fqdn: __FQDN__
preserve_hostname: false

write_files:
  - path: /usr/local/sbin/quantmail-lab-init.sh
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euxo pipefail
      exec > >(tee -a /var/log/quantmail-lab-init.log) 2>&1

      # ---- swap on small shapes (the Always Free AMD shape has 1 GB RAM) ----
      mem_kb="$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
      if [ "$mem_kb" -lt 3000000 ] && [ ! -f /swapfile ]; then
        fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
        echo 'vm.swappiness=20' > /etc/sysctl.d/90-quantmail-lab.conf
        sysctl --system || true
      fi

      # ---- packages: docker CE, compose plugin, tools used by provision.sh ----
      dnf install -y dnf-plugins-core git gettext openssl curl jq
      dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
      dnf install -y --allowerasing docker-ce docker-ce-cli containerd.io docker-compose-plugin
      systemctl enable --now docker
      usermod -aG docker opc || true

      # ---- OS firewall: only the mail/web ports ----
      PORTS="25 80 443 465 587 993"
      if systemctl is-active --quiet firewalld; then
        for p in $PORTS; do firewall-cmd --permanent --add-port="${p}/tcp"; done
        firewall-cmd --reload
      else
        for p in $PORTS; do
          iptables -C INPUT -p tcp --dport "$p" -j ACCEPT 2>/dev/null || iptables -I INPUT -p tcp --dport "$p" -m state --state NEW -j ACCEPT
        done
        if command -v iptables-save >/dev/null 2>&1 && [ -d /etc/sysconfig ]; then iptables-save > /etc/sysconfig/iptables || true; fi
      fi

      # ---- lab config from the public repo (config as code) ----
      install -d -o opc -g opc /opt/quantmail-lab
      if [ ! -d /opt/quantmail-lab/repo/.git ]; then
        sudo -u opc git clone --depth 1 --filter=blob:none --sparse --branch "__REPO_BRANCH__" "__REPO_URL__" /opt/quantmail-lab/repo
        sudo -u opc git -C /opt/quantmail-lab/repo sparse-checkout set infra/mail
      fi
      touch /opt/quantmail-lab/cloud-init.done
      chown opc:opc /opt/quantmail-lab/cloud-init.done

runcmd:
  - [bash, /usr/local/sbin/quantmail-lab-init.sh]
