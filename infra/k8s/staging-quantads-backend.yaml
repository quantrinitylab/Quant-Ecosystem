# QuantAds Fastify backend (staging): Deployment + Service + /api ingress.
# The frontend (quantads.quantrinity.in) calls same-origin /api/*; this ingress
# strips /api and routes to the backend, whose routes live at root. Mirrors
# staging-quantube-backend.yaml, scoped to the quantads port (3010).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-quantads-backend
  namespace: quant-staging
  labels:
    app: quant-quantads-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quant-quantads-backend
  template:
    metadata:
      labels:
        app: quant-quantads-backend
    spec:
      containers:
        - name: quantads-backend
          image: 178313340246.dkr.ecr.us-east-1.amazonaws.com/quant-quantads-backend:bootstrap
          ports:
            - containerPort: 3010
              name: http
          envFrom:
            - configMapRef:
                name: quant-staging-config
            - secretRef:
                name: quant-staging-secrets
          env:
            - name: PORT
              value: '3010'
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3010
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: 3010
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: quant-quantads-backend
  namespace: quant-staging
  labels:
    app: quant-quantads-backend
spec:
  selector:
    app: quant-quantads-backend
  ports:
    - port: 3010
      targetPort: 3010
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quant-quantads-api-staging
  namespace: quant-staging
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: '50m'
spec:
  ingressClassName: nginx
  rules:
    - host: quantads.quantrinity.in
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: quant-quantads-backend
                port:
                  number: 3010
