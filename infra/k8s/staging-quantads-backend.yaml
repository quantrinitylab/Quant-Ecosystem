# QuantAds Fastify backend (staging): Deployment + Service + /api ingress.
# The frontend (quantads.quantrinity.in) calls same-origin /api/*; this ingress
# strips /api and routes to the backend, whose routes live at root. Mirrors
# staging-quantube-backend.yaml, scoped to the quantads port (3010).
#
# IMPORTANT (P0 login fix): the backend registers NO /auth routes, so the
# Next.js auth proxy routes (/api/auth/login, /api/auth/userinfo,
# /api/auth/logout, /api/health) are exempted from this rule and routed to the
# frontend (quant-quantads:3108) by the second Ingress below. Without the
# exemption the blanket /api rule swallows those routes and login can never
# work in production, no matter how fresh the deployed build is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-quantads-backend
  namespace: quant-staging
  labels:
    app: quant-quantads-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quant-quantads-backend
  template:
    metadata:
      labels:
        app: quant-quantads-backend
    spec:
      containers:
        - name: quantads-backend
          image: 178313340246.dkr.ecr.us-east-1.amazonaws.com/quant-quantads-backend:53096784f0d462574a88330238c09c5e84536492
          ports:
            - containerPort: 3010
              name: http
          envFrom:
            - configMapRef:
                name: quant-staging-config
            - secretRef:
                name: quant-staging-secrets
          env:
            - name: PORT
              value: '3010'
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3010
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: 3010
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: quant-quantads-backend
  namespace: quant-staging
  labels:
    app: quant-quantads-backend
spec:
  selector:
    app: quant-quantads-backend
  ports:
    - port: 3010
      targetPort: 3010
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quant-quantads-api-staging
  namespace: quant-staging
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: '50m'
spec:
  ingressClassName: nginx
  rules:
    - host: quantads.quantrinity.in
      http:
        paths:
          # The negative lookahead excludes the frontend-owned auth/health
          # paths (routed by the Ingress below), so this rule deterministically
          # never matches them regardless of regex evaluation order. Capture
          # groups stay aligned with rewrite-target: /$2 ($1 = '/' or '',
          # $2 = the remainder, e.g. 'campaigns').
          - path: /api(?!/(auth|health)(/|$))(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: quant-quantads-backend
                port:
                  number: 3010
---
# Frontend-owned API routes (staging): /api/auth/* and /api/health live in the
# Next.js app (apps/quantads/src/app/api/auth/*), NOT in the Fastify backend.
# This Ingress carries no rewrite-target, so the original URI reaches Next.js
# unchanged. The backend Ingress above explicitly excludes these paths, so
# each request matches exactly one rule — no reliance on location ordering.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quant-quantads-frontend-api-staging
  namespace: quant-staging
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '50m'
spec:
  ingressClassName: nginx
  rules:
    - host: quantads.quantrinity.in
      http:
        paths:
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: quant-quantads
                port:
                  number: 3108
          - path: /api/health(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: quant-quantads
                port:
                  number: 3108
