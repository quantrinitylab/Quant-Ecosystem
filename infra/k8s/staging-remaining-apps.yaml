# Staging Deployments, Services and Ingress for the seven apps that had a
# Dockerfile and an /api/health route but had never been deployed: QuantWave,
# QuantMax, QuantGram, Quantube, QuantCooks, QuantAds and QuantTrinity.
#
# Shape follows staging-quantchat-quantai.yaml exactly, INCLUDING the backend
# sidecar. Six of these apps ship a Fastify backend under `apps/<app>/backend/`
# and a Next frontend whose `app/api/**` handlers are thin proxies to it
# (`<APP>_BACKEND_URL`). Deploying only the frontend container is what made
# every data route answer 500/502 in staging on 2026-09-20 while `/api/health`
# — served by Next itself, not the backend — stayed green:
#   quantube  /api/creator/*      502      quantneon /api/explore      500
#   quantmax  /api/economy/wallet 502      quantsync /api/communities  502
#   quantads  /api/audiences      502      quantedits /api/assets      500
# The sidecar runs the SAME image as the frontend (the app Dockerfile copies the
# whole `apps/<app>/` tree plus root node_modules, so `backend/server.ts` and
# tsx are both present), so no new ECR repository or image build is needed.
#
# QuantTrinity has no `backend/` directory — its 17 route handlers run in-process
# against @quant/* packages — so it stays a single container by design.
#
# Hostnames use the Wave E product names rather than the directory names, so the
# mapping is deliberate and recorded here. The pnpm package name differs from the
# directory for three apps, and the sidecar's `--filter` needs the PACKAGE name:
#   apps/quantsync      -> quantwave.quantrinity.in    (@quant/quantwave)
#   apps/quantneon      -> quantgram.quantrinity.in    (@quant/quantgram)
#   apps/quantedits     -> quantcooks.quantrinity.in   (@quant/quantcooks)
#   apps/quantmax       -> quantmax.quantrinity.in     (@quant/quantmax)
#   apps/quantube       -> quantube.quantrinity.in     (@quant/quantube)
#   apps/quantads       -> quantads.quantrinity.in     (@quant/quantads)
#   apps/quanttrinity   -> quanttrinity.quantrinity.in (@quant/quanttrinity)
#
# Backend ports are each backend's own `getConfig()` default (`PORT ?? <port>`),
# so the sidecar, the frontend's `<APP>_BACKEND_URL` and local `pnpm dev:backend`
# all agree on one number per app.
#
# Every Deployment pins `maxSurge: 0` / `maxUnavailable: 1`. These are
# single-replica staging workloads, and a default 25% surge means a rollout must
# schedule a SECOND pod before the old one is allowed to terminate. On
# 2026-09-20 two unrelated rollouts (quanttrinity, quantmail-backend) each sat
# for the full 10-minute deadline on "1 old replicas are pending termination" —
# the signature of a surge pod that cannot be scheduled — and then rolled back.
# Surge-free updates trade a few seconds of staging downtime for rollouts that
# do not depend on spare cluster capacity.
#
# NOTE ON CAPACITY: the six sidecars add ~600m CPU / 1.5Gi of memory REQUESTS to
# the namespace. If pods land in Pending with "Insufficient cpu/memory", the node
# group needs scaling — the deploy workflow now prints pod events on rollout
# failure, so that shows up as a named cause instead of a bare timeout.
#
# The image tag below is the main commit these were first cut from. deploy-staging
# rewrites it to an immutable digest on every rollout, so this value only matters
# for the very first apply — the pods stay pending until that workflow pushes the
# tag, which is expected.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-quantsync
  namespace: quant-staging
  labels:
    app: quant-quantsync
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: quant-quantsync
  template:
    metadata:
      labels:
        app: quant-quantsync
    spec:
      containers:
        - name: quant-quantsync
          image: 178313340246.dkr.ecr.us-east-1.amazonaws.com/quant-quantsync:652ac6160095d2bd2a94ff2725d2f9f9ffa23191
          ports:
            - containerPort: 3102
              name: http
          envFrom:
            - configMapRef:
                name: quant-staging-config
            - secretRef:
                name: quant-staging-secrets
          env:
            - name: PORT
              value: '3102'
            - name: QUANTSYNC_BACKEND_URL
              value: 'http://localhost:3004'
            - name: NEXT_PUBLIC_APP_URL
              value: 'https://quantwave.quantrinity.in'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3102
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3102
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
        - name: quant-quantsync-backend
          image: 178313340246.dkr.ecr.us-east-1.amazonaws.com/quant-quantsync:652ac6160095d2bd2a94ff2725d2f9f9ffa23191
          command:
            - sh
            - -c
            - 'PORT=3004 pnpm --filter @quant/quantwave exec tsx backend/server.ts'
          ports:
            - containerPort: 3004
              name: backend
          envFrom:
            - configMapRef:
                name: quant-staging-config
            - secretRef:
                name: quant-staging-secrets
          env:
            - name: PORT
              value: '3004'
            - name: HOST
              value: '0.0.0.0'
          # @quant/server-core's health plugin registers /healthz, /livez and
          # /readyz — NOT /health, which only appears in the auth-exempt path list
          # and answers 404. Verified by booting apps/quantube/backend/server.ts:
          #   /healthz 200  /livez 200  /health 404
          # Probing /health would have left every sidecar permanently unready and
          # failed all six rollouts.
          #
          # readiness = /healthz, NOT /readyz, and that differs from
          # quant-quantmail-backend on purpose. /readyz runs SELECT 1 and returns
          # 503 when the database is unreachable (verified: {"status":
          # "unavailable","checks":{"database":"fail"}}). For quantmail that is
          # correct — it has multiple replicas behind its own Service, so draining
          # a bad one sends traffic to a good one. Here the backend is a SIDECAR
          # in a single-replica pod: a pod that goes unready takes the FRONTEND
          # out of the Service with it, so a database blip would black out the
          # whole app's UI and route traffic nowhere. The data path is instead
          # gated where it can be proven end-to-end — the post-rollout smoke step
          # in deploy-staging.yml calls real routes through the public host and
          # rolls back on 5xx.
          #
          # liveness = /livez: deliberately dumber than readiness, it reports only
          # that the process is alive, so a dependency outage never restarts a
          # healthy process. failureThreshold 6 rides out transient CPU starvation
          # rather than restarting a backend that is merely slow.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: 3004
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: quant-quantsync
  namespace: quant-staging
  labels:
    app: quant-quantsync
spec:
  selector:
    app: quant-quantsync
  ports:
    - port: 3102
      targetPort: 3102
      name: http
    - port: 3004
      targetPort: 3004
      name: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-quantmax
  namespace: quant-staging
  labels:
    app: quant-quantmax
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: quant-quantmax
  template:
    metadata:
      labels:
        app: quant-quantmax
    spec:
      containers:
        - name: quant-quantmax
          image: 178313340246.dkr.ecr.us-east-1.amazonaws.com/quant-quantmax:652ac6160095d2bd2a94ff2725d2f9f9ffa23191
          ports:
            - containerPort: 3103
              name: http
          envFrom:
            - configMapRef:
                name: quant-staging-config
            - secretRef:
                name: quant-staging-secrets
          env:
            - name: PORT
              value: '3103'
            # quantmax reads BOTH spellings: `_lib/proxy.ts` uses
            # QUANTMAX_BACKEND_URL, `_lib/engine-proxy.ts` + `_lib/feed-proxy.ts`
            # use NEXT_PUBLIC_QUANTMAX_BACKEND_URL. Set both or half the routes
            # keep dialling localhost.
            - name: QUANTMAX_BACKEND_URL
              value: 'http://localhost:3008'
            - name: NEXT_PUBLIC_QUANTMAX_BACKEND_URL
              value: 'http://localhost:3008'
            - name: NEXT_PUBLIC_APP_URL
              value: 'https://quantmax.quantrinity.in'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3103
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3103
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
        - name: quant-quantmax-backend
          image: 178313340246.dkr.ecr.us-east-1.amazonaws.com/quant-quantmax:652ac6160095d2bd2a94ff2725d2f9f9ffa23191
          command:
            - sh
            - -c
            - 'PORT=3008 pnpm --filter @quant/quantmax exec tsx backend/server.ts'
          ports:
            - containerPort: 3008
              name: backend
          envFrom:
            - configMapRef:
                name: quant-staging-config
            - secretRef:
                name: quant-staging-secrets
          env:
            - name: PORT
              value: '3008'
            - name: HOST
              value: '0.0.0.0'
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3008
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: 3008
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
