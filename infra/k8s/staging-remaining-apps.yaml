          env:
            - name: PORT
              value: '3113'
            - name: NEXT_PUBLIC_APP_URL
              value: 'https://quanttrinity.quantrinity.in'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3113
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3113
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: quant-quanttrinity
  namespace: quant-staging
  labels:
    app: quant-quanttrinity
spec:
  selector:
    app: quant-quanttrinity
  ports:
    - port: 3113
      targetPort: 3113
      name: http
