---
# Separate from quant-apps-staging-ingress so a mistake here cannot take
# quantchat or quantai down with it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quant-remaining-apps-staging-ingress
  namespace: quant-staging
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '50m'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  ingressClassName: nginx
  rules:
    - host: quantwave.quantrinity.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quant-quantsync
                port:
                  number: 3102
    - host: quantmax.quantrinity.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quant-quantmax
                port:
                  number: 3103
    - host: quantgram.quantrinity.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quant-quantneon
                port:
                  number: 3104
    - host: quantube.quantrinity.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quant-quantube
                port:
                  number: 3105
    - host: quantcooks.quantrinity.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quant-quantedits
                port:
                  number: 3106
    - host: quantads.quantrinity.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quant-quantads
                port:
                  number: 3108
    - host: quanttrinity.quantrinity.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quant-quanttrinity
                port:
                  number: 3113
