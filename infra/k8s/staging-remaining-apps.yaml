# Staging Deployments, Services and Ingress for the seven apps that had a
# Dockerfile and an /api/health route but had never been deployed: QuantWave,
# QuantMax, QuantGram, Quantube, QuantCooks, QuantAds and QuantTrinity.
#
# Shape follows staging-quantchat-quantai.yaml exactly, minus the backend
# sidecar: each of these apps is a single Next.js process (`next start -p <port>`
# per its Dockerfile), so there is one container and one port.
#
# Hostnames use the Wave E product names rather than the directory names, so the
# mapping is deliberate and recorded here:
#   apps/quantsync      -> quantwave.quantrinity.in    (QuantWave)
#   apps/quantneon      -> quantgram.quantrinity.in    (QuantGram)
#   apps/quantedits     -> quantcooks.quantrinity.in   (QuantCooks)
#   apps/quantmax       -> quantmax.quantrinity.in
#   apps/quantube       -> quantube.quantrinity.in
#   apps/quantads       -> quantads.quantrinity.in
#   apps/quanttrinity   -> quanttrinity.quantrinity.in
#
# IMAGES: each `image:` below pins the digest that is currently live, and that is
# load-bearing — do not "simplify" it back to a commit tag.
#
# deploy-staging.yml owns the image at rollout time (`kubectl set image` to an
# immutable digest). This file used to carry the tag
# `:652ac6160095d2bd2a94ff2725d2f9f9ffa23191` with a comment claiming the value
# "only matters for the very first apply". That was wrong, and it cost a debugging
# session: that tag was never pushed for most of these apps, so every later
# `kubectl apply -f` of this file — including an apply whose only real intent was
# to add an env var — rewrote the pod template back to a nonexistent image. Each
# one spawned a fresh ReplicaSet stuck in ImagePullBackOff. The Deployments still
# reported Available because the previous good ReplicaSet kept serving under
# `maxUnavailable: 25%`, so the breakage was invisible in `kubectl get deploy` and
# only showed up as orphaned failing pods.
#
# So: to change env or probes here, apply this file and then confirm the image
# still matches the live digest (or prefer `kubectl set env` for env-only edits).
# After any deploy-staging rollout, update the digests here to match.
#
# quanttrinity is the one exception below: it still carries the old commit tag
# because no image was ever successfully built and pushed for it, so there is no
# digest to pin yet. Its pods stay pending/failing until deploy-staging builds one.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-quantsync
  namespace: quant-staging
  labels:
    app: quant-quantsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quant-quantsync
  template:
    metadata:
      labels:
        app: quant-quantsync
    spec:
      containers:
        - name: quant-quantsync
          image: 178313340246.dkr.ecr.us-east-1.amazonaws.com/quant-quantsync@sha256:f17b2ede55a30dfdcd3d1683cebee52aa51f7055ec217d976433c8705b14f6bd
          ports:
            - containerPort: 3102
              name: http
          envFrom:
            - configMapRef:
                name: quant-staging-config
            - secretRef:
                name: quant-staging-secrets
          env:
            - name: PORT
              value: '3102'
            - name: NEXT_PUBLIC_APP_URL
              value: 'https://quantwave.quantrinity.in'
            # The route handlers proxy to the QuantSync Fastify backend Service
            # in-cluster. Their code default is localhost:3003 — both wrong host
            # AND wrong port (the backend listens on 3004), so without this every
            # /api call returned empty/HTML ("Unexpected end of JSON input").
            - name: QUANTSYNC_BACKEND_URL
              value: 'http://quant-quantsync-backend.quant-staging.svc.cluster.local:3004'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3102
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3102
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: quant-quantsync
  namespace: quant-staging
  labels:
    app: quant-quantsync
spec:
  selector:
    app: quant-quantsync
  ports:
    - port: 3102
      targetPort: 3102
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-quantmax
  namespace: quant-staging
  labels:
    app: quant-quantmax
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quant-quantmax
  template:
    metadata:
      labels:
        app: quant-quantmax
    spec:
      containers:
        - name: quant-quantmax
          image: 178313340246.dkr.ecr.us-east-1.amazonaws.com/quant-quantmax@sha256:96f27c93da339767e1df9f1af921308b7d17c8ef6c5690998828c7913f5d26fd
          ports:
            - containerPort: 3103
              name: http
          envFrom:
            - configMapRef:
                name: quant-staging-config
            - secretRef:
                name: quant-staging-secrets
          env:
            - name: PORT
              value: '3103'
            - name: NEXT_PUBLIC_APP_URL
              value: 'https://quantmax.quantrinity.in'
            # Both proxies must reach the QuantMax Fastify backend Service:
            # _lib/proxy.ts reads QUANTMAX_BACKEND_URL (code default localhost:3007
            # — wrong port, the backend listens on 3008) and the engine routes read
            # NEXT_PUBLIC_QUANTMAX_BACKEND_URL. Set both or half the API 404s/hangs.
            - name: QUANTMAX_BACKEND_URL
              value: 'http://quant-quantmax-backend.quant-staging.svc.cluster.local:3008'
            - name: NEXT_PUBLIC_QUANTMAX_BACKEND_URL
              value: 'http://quant-quantmax-backend.quant-staging.svc.cluster.local:3008'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3103
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3103
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
