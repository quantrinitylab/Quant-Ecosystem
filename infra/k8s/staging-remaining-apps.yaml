apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-quantube
  namespace: quant-staging
  labels:
    app: quant-quantube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quant-quantube
  template:
    metadata:
      labels:
        app: quant-quantube
    spec:
      containers:
        - name: quant-quantube
          image: 178313340246.dkr.ecr.us-east-1.amazonaws.com/quant-quantube@sha256:6522c4653b10fb7c0a5af5fa3a4f1d6f628b32da12e5063b573f8e311bda9e2c
          ports:
            - containerPort: 3105
              name: http
          envFrom:
            - configMapRef:
                name: quant-staging-config
            - secretRef:
                name: quant-staging-secrets
          env:
            - name: PORT
              value: '3105'
            - name: NEXT_PUBLIC_APP_URL
              value: 'https://quantube.quantrinity.in'
            # Server-side proxy (src/app/api/_lib/proxy.ts) reads this at runtime
            # to reach the QuantTube Fastify backend Service in-cluster. Without
            # it the proxy defaults to localhost:3006 and every /api call returns
            # empty/HTML, which is the "Unexpected end of JSON input" the app showed.
            - name: QUANTUBE_BACKEND_URL
              value: 'http://quant-quantube-backend.quant-staging.svc.cluster.local:3006'
            # The engine routes (feed, recommendations, cross-publish, payouts,
            # creator, ...) proxy via src/app/api/_lib/engine-proxy.ts, which
            # reads NEXT_PUBLIC_QUANTUBE_BACKEND_URL (server-side, at runtime).
            # Both proxies must point at the same in-cluster backend Service, so
            # set both — otherwise the engine-backed pages (the feed itself) keep
            # returning empty/HTML while only the plain-proxy routes work.
            - name: NEXT_PUBLIC_QUANTUBE_BACKEND_URL
              value: 'http://quant-quantube-backend.quant-staging.svc.cluster.local:3006'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3105
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3105
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
