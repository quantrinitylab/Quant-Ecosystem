# Staging Deployments, Services and Ingress for the seven apps that had a
# Dockerfile and an /api/health route but had never been deployed: QuantWave,
# QuantMax, QuantGram, Quantube, QuantCooks, QuantAds and QuantTrinity.
#
# Shape follows staging-quantchat-quantai.yaml exactly, minus the backend
# sidecar: each of these apps is a single Next.js process (`next start -p <port>`
# per its Dockerfile), so there is one container and one port.
#
# Hostnames use the Wave E product names rather than the directory names, so the
# mapping is deliberate and recorded here:
#   apps/quantsync      -> quantwave.quantrinity.in    (QuantWave)
#   apps/quantneon      -> quantgram.quantrinity.in    (QuantGram)
#   apps/quantedits     -> quantcooks.quantrinity.in   (QuantCooks)
#   apps/quantmax       -> quantmax.quantrinity.in
#   apps/quantube       -> quantube.quantrinity.in
#   apps/quantads       -> quantads.quantrinity.in
#   apps/quanttrinity   -> quanttrinity.quantrinity.in
#
# The image tag below is the main commit these were first cut from. deploy-staging
# rewrites it to an immutable digest on every rollout, so this value only matters
# for the very first apply — the pods stay pending until that workflow pushes the
# tag, which is expected.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-quantsync
  namespace: quant-staging
  labels:
    app: quant-quantsync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quant-quantsync
  template:
    metadata:
      labels:
        app: quant-quantsync
    spec:
      containers:
        - name: quant-quantsync
          image: 178313340246.dkr.ecr.us-east-1.amazonaws.com/quant-quantsync:652ac6160095d2bd2a94ff2725d2f9f9ffa23191
          ports:
            - containerPort: 3102
              name: http
          envFrom:
            - configMapRef:
                name: quant-staging-config
            - secretRef:
                name: quant-staging-secrets
          env:
            - name: PORT
              value: '3102'
            - name: NEXT_PUBLIC_APP_URL
              value: 'https://quantwave.quantrinity.in'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3102
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3102
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: quant-quantsync
  namespace: quant-staging
  labels:
    app: quant-quantsync
spec:
  selector:
    app: quant-quantsync
  ports:
    - port: 3102
      targetPort: 3102
      name: http
