# ServiceAccount for the QuantMail backend with IRSA to the
# `quant-quantmail-ses-sender` IAM role (ses:SendEmail scoped to *@quantmail.in,
# s3:GetObject on the inbound-mail bucket).
#
# The deployment manifest in .github/workflows/bootstrap-aws.yml sets
# `serviceAccountName: quantmail-backend`, and deploy-staging.yml patches it
# onto the live deployment. Without this binding the pod falls back to the
# node instance role and SES sends fail.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quantmail-backend
  namespace: quant-staging
  labels:
    app.kubernetes.io/part-of: quant-platform
    app.kubernetes.io/managed-by: deploy-staging
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::178313340246:role/quant-quantmail-ses-sender"
