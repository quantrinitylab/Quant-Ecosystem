apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-quantchat
  namespace: quant-staging
  labels:
    app: quant-quantchat
spec:
  replicas: 1
  # Surge-free: a 1-replica Deployment with the default 25% maxSurge must
  # schedule a SECOND pod before the old one may terminate, so a rollout stalls
  # for its full deadline whenever the namespace has no spare capacity (seen on
  # quanttrinity and quantmail-backend, 2026-09-20). deploy-staging.yml
  # re-applies this patch on every rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: quant-quantchat
  template:
    metadata:
      labels:
        app: quant-quantchat
    spec:
      containers:
        - name: quant-quantchat
          image: 178313340246.dkr.ecr.us-east-1.amazonaws.com/quant-quantchat:3c12703717dac7d7123eaee915a57c2111ce8648
          ports:
            - containerPort: 3015
              name: http
          envFrom:
            - configMapRef:
                name: quant-staging-config
            - secretRef:
                name: quant-staging-secrets
          env:
            - name: PORT
              value: '3015'
            - name: QUANTCHAT_BACKEND_URL
              value: 'http://localhost:3002'
            - name: NEXT_PUBLIC_APP_URL
              value: 'https://quantchat.quantrinity.in'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3015
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3015
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
        - name: quant-quantchat-backend
          image: 178313340246.dkr.ecr.us-east-1.amazonaws.com/quant-quantchat:3c12703717dac7d7123eaee915a57c2111ce8648
          command:
            - sh
            - -c
            - 'PORT=3002 VOICE_BOT_SECRET=quant-staging-voice-bot-secret-2026 pnpm --filter @quant/quantchat exec tsx backend/server.ts'
          ports:
            - containerPort: 3002
              name: backend
          envFrom:
            - configMapRef:
                name: quant-staging-config
            - secretRef:
                name: quant-staging-secrets
          env:
            - name: PORT
              value: '3002'
            - name: HOST
              value: '0.0.0.0'
            - name: VOICE_BOT_SECRET
              value: 'quant-staging-voice-bot-secret-2026'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: quant-quantchat
  namespace: quant-staging
  labels:
    app: quant-quantchat
spec:
  selector:
    app: quant-quantchat
  ports:
    - port: 3015
      targetPort: 3015
      name: http
    - port: 3002
      targetPort: 3002
      name: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-quantai
  namespace: quant-staging
  labels:
    app: quant-quantai
spec:
  replicas: 1
  # See the note on quant-quantchat above.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: quant-quantai
  template:
    metadata:
      labels:
        app: quant-quantai
    spec:
      containers:
        - name: quant-quantai
          image: 178313340246.dkr.ecr.us-east-1.amazonaws.com/quant-quantai:3c12703717dac7d7123eaee915a57c2111ce8648
          ports:
            - containerPort: 3020
              name: http
          envFrom:
            - configMapRef:
                name: quant-staging-config
            - secretRef:
                name: quant-staging-secrets
          env:
            - name: PORT
              value: '3020'
            - name: QUANTAI_BACKEND_URL
              value: 'http://localhost:3004'
            - name: NEXT_PUBLIC_APP_URL
              value: 'https://quanty.quantrinity.in'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3020
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3020
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
        - name: quant-quantai-backend
          image: 178313340246.dkr.ecr.us-east-1.amazonaws.com/quant-quantai:3c12703717dac7d7123eaee915a57c2111ce8648
          command:
            - sh
            - -c
            - 'PORT=3004 pnpm --filter @quant/quantai exec tsx backend/server.ts'
          ports:
            - containerPort: 3004
              name: backend
          envFrom:
            - configMapRef:
                name: quant-staging-config
            - secretRef:
                name: quant-staging-secrets
          env:
            - name: PORT
              value: '3004'
            - name: HOST
              value: '0.0.0.0'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: quant-quantai
  namespace: quant-staging
  labels:
    app: quant-quantai
spec:
  selector:
    app: quant-quantai
  ports:
    - port: 3020
      targetPort: 3020
      name: http
    - port: 3004
      targetPort: 3004
      name: backend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: quant-apps-staging-ingress
  namespace: quant-staging
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '50m'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  ingressClassName: nginx
  rules:
    - host: quantchat.quantrinity.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quant-quantchat
                port:
                  number: 3015
    - host: quanty.quantrinity.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quant-quantai
                port:
                  number: 3020
    - host: quantai.quantrinity.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: quant-quantai
                port:
                  number: 3020
