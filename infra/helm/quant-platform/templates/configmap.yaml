apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "quant-platform.fullname" . }}-config
  labels:
    {{- include "quant-platform.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.configmap.NODE_ENV | quote }}
  LOG_LEVEL: {{ .Values.configmap.LOG_LEVEL | quote }}
  CORS_ORIGINS: {{ .Values.configmap.CORS_ORIGINS | quote }}
  JWT_ISSUER: {{ .Values.configmap.JWT_ISSUER | quote }}
  JWT_AUDIENCE: {{ .Values.configmap.JWT_AUDIENCE | quote }}
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  DOMAIN: {{ .Values.global.domain | quote }}
  {{- if .Values.configmap.AI_PROVIDER }}
  AI_PROVIDER: {{ .Values.configmap.AI_PROVIDER | quote }}
  {{- end }}
  {{- if .Values.configmap.AI_DEFAULT_MODEL }}
  AI_DEFAULT_MODEL: {{ .Values.configmap.AI_DEFAULT_MODEL | quote }}
  {{- end }}
  {{- if .Values.configmap.CLOUDFLARE_AI_MODEL }}
  CLOUDFLARE_AI_MODEL: {{ .Values.configmap.CLOUDFLARE_AI_MODEL | quote }}
  {{- end }}
  {{- if .Values.configmap.CLOUDFLARE_AI_BASE_URL }}
  CLOUDFLARE_AI_BASE_URL: {{ .Values.configmap.CLOUDFLARE_AI_BASE_URL | quote }}
  {{- end }}
  {{- if .Values.configmap.QUANT_AI_FAIL_CLOSED }}
  QUANT_AI_FAIL_CLOSED: {{ .Values.configmap.QUANT_AI_FAIL_CLOSED | quote }}
  {{- end }}
  {{- if .Values.configmap.QUANTCHAT_BACKEND_URL }}
  QUANTCHAT_BACKEND_URL: {{ .Values.configmap.QUANTCHAT_BACKEND_URL | quote }}
  {{- end }}
  {{- if .Values.configmap.QUANTAI_BACKEND_URL }}
  QUANTAI_BACKEND_URL: {{ .Values.configmap.QUANTAI_BACKEND_URL | quote }}
  {{- end }}
