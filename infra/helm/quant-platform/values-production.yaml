global:
  environment: production
  domain: quantrinity.in
  databaseCIDRs:
    - 10.0.20.0/24
    - 10.0.21.0/24
    - 10.0.22.0/24
  redisCIDRs:
    - 10.0.10.0/24
    - 10.0.11.0/24
    - 10.0.12.0/24
  multiRegion:
    enabled: false
    primary: us-east-1
    secondary: eu-west-1

configmap:
  NODE_ENV: production
  LOG_LEVEL: warn
  CORS_ORIGINS: 'https://quantrinity.in,https://www.quantrinity.in,https://quantmail.quantrinity.in,https://quantchat.quantrinity.in,https://quantai.quantrinity.in'
  JWT_ISSUER: 'https://quantmail.quantrinity.in'
  JWT_AUDIENCE: 'quant-platform'
  AI_PROVIDER: cloudflare
  AI_DEFAULT_MODEL: '@cf/meta/llama-3.2-1b-instruct'
  CLOUDFLARE_AI_MODEL: '@cf/meta/llama-3.2-1b-instruct'
  CLOUDFLARE_AI_BASE_URL: 'https://api.cloudflare.com/client/v4/accounts'
  QUANTCHAT_BACKEND_URL: 'http://quant-platform-production-quantchat-backend:3002'
  QUANTAI_BACKEND_URL: 'http://quant-platform-production-quantai-backend:3004'

secrets:
  keys:
    - JWT_SECRET
    - DATABASE_URL
    - REDIS_URL
    - AI_API_KEY
    - SMTP_PASSWORD
    - S3_ACCESS_KEY
    - S3_SECRET_KEY
    - MEILI_MASTER_KEY
    - CLOUDFLARE_ACCOUNT_ID
    - CLOUDFLARE_API_TOKEN

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/hsts: 'true'
    nginx.ingress.kubernetes.io/hsts-max-age: '31536000'
    external-dns.alpha.kubernetes.io/hostname: quantrinity.in
  tls:
    enabled: true
    secretName: quant-platform-production-tls

canary:
  enabled: false
  prometheus:
    address: http://prometheus-server.monitoring:9090
  rollback:
    maxErrorRate: 0.01
    maxP99Latency: 2000

meilisearch:
  enabled: true
  storage:
    size: 50Gi

services:
  ws-gateway:
    replicaCount: 2
    image:
      repository: 266176113726.dkr.ecr.us-east-1.amazonaws.com/quant-ws-gateway
    env:
      - name: WS_PORT
        value: '8080'
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
    pdb:
      minAvailable: 1

  quantmail:
    replicaCount: 2
    image:
      repository: 266176113726.dkr.ecr.us-east-1.amazonaws.com/quant-quantmail
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
    pdb:
      minAvailable: 1

  quantchat:
    replicaCount: 2
    image:
      repository: 266176113726.dkr.ecr.us-east-1.amazonaws.com/quant-quantchat
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
    pdb:
      minAvailable: 1

  quantai:
    replicaCount: 2
    image:
      repository: 266176113726.dkr.ecr.us-east-1.amazonaws.com/quant-quantai
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
    pdb:
      minAvailable: 1

  admin:
    replicaCount: 2
    image:
      repository: 266176113726.dkr.ecr.us-east-1.amazonaws.com/quant-admin
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      minReplicas: 2
      maxReplicas: 4
    pdb:
      minAvailable: 1

  triton-inference-server:
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    replicaCount: 0
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 4Gi
    autoscaling:
      minReplicas: 0
      maxReplicas: 0
    pdb:
      minAvailable: 0
