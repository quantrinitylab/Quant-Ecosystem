global:
  imageRegistry: ''
  imagePullSecrets: []
  environment: development
  domain: quant.local
  databaseCIDRs: []
  redisCIDRs: []

nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: true
  name: ''
  annotations: {}

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
  tls:
    enabled: true
    secretName: quant-platform-tls

configmap:
  NODE_ENV: production
  LOG_LEVEL: info
  CORS_ORIGINS: 'https://quant.local'
  JWT_ISSUER: 'https://quant.local'
  JWT_AUDIENCE: 'quant-platform'

secrets:
  externalSecret:
    enabled: true
    secretStoreRef:
      name: aws-secrets-manager
      kind: ClusterSecretStore
    refreshInterval: 1h
  keys:
    - JWT_SECRET
    - DATABASE_URL
    - REDIS_URL
    - AI_API_KEY
    - SMTP_PASSWORD
    - S3_ACCESS_KEY
    - S3_SECRET_KEY
    - MEILI_MASTER_KEY

meilisearch:
  enabled: true
  image:
    repository: getmeili/meilisearch
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 7700
  storage:
    size: 10Gi
    storageClass: ''
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  env:
    - name: MEILI_ENV
      value: production
    - name: MEILI_NO_ANALYTICS
      value: 'true'

postgresql:
  enabled: false
  auth:
    postgresPassword: ''
    database: quantdb

redis:
  enabled: false
  architecture: standalone
  auth:
    enabled: false

services:
  ws-gateway:
    enabled: true
    replicaCount: 3
    image:
      repository: quant/ws-gateway
      tag: latest
      pullPolicy: IfNotPresent
    port: 8080
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 20
      targetCPUUtilization: 60
      targetMemoryUtilization: 70
    pdb:
      enabled: true
      minAvailable: 2
    networkPolicy:
      enabled: true
      allowedNamespaces:
        - quant-system
    env: []
    secrets: []
    # `/health` IS CORRECT HERE, AND ONLY HERE. Do not "fix" it to /healthz.
    #
    # ws-gateway is not a server-core app. Its WebSocket server attaches a plain
    # `createServer` handler that answers `/health` and `/api/health` with a 200
    # on the same port it upgrades connections on, which is the port these probes
    # target. `@quant/health-server` also gives it `/healthz` and `/readyz`, but
    # those listen on a separate HEALTH_PORT (3040) that this chart does not
    # expose as a container port — so pointing a probe at `/healthz` here would
    # break a service that is currently probed correctly.
    probes:
      liveness:
        path: /health
        initialDelaySeconds: 15
        periodSeconds: 10
      readiness:
        path: /health
        initialDelaySeconds: 5
        periodSeconds: 5
    websocket: true

  triton-inference-server:
    enabled: true
    runAsNonRoot: false
    readOnlyRootFilesystem: false
    runAsUser: 1000
    fsGroup: 1000
    replicaCount: 2
    image:
      repository: nvcr.io/nvidia/tritonserver
      tag: 24.01-py3-min
      pullPolicy: IfNotPresent
    port: 8000
    # NOTE: Current configuration is CPU-only. The model configs use KIND_CPU instance groups.
    # For GPU-backed inference, uncomment the nvidia.com/gpu resource below and update
    # model configs to use KIND_GPU. Consider using tritonserver:24.01-py3-min image for
    # CPU-only deployments to reduce image pull time.
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
        # nvidia.com/gpu: 1
      limits:
        cpu: 4000m
        memory: 8Gi
        # nvidia.com/gpu: 1
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilization: 70
      targetMemoryUtilization: 80
    pdb:
      enabled: true
      minAvailable: 1
    networkPolicy:
      enabled: true
      allowedNamespaces:
        - quant-system
    env:
      - name: MODEL_REPOSITORY
        value: /models
    secrets: []
    probes:
      liveness:
        path: /v2/health/live
        initialDelaySeconds: 30
        periodSeconds: 10
      readiness:
        path: /v2/health/ready
        initialDelaySeconds: 15
        periodSeconds: 5

  quantmail:
    enabled: true
    replicaCount: 2
    image:
      repository: quant/quantmail
      tag: latest
      pullPolicy: IfNotPresent
    port: 3010
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilization: 70
      targetMemoryUtilization: 75
    pdb:
      enabled: true
      minAvailable: 1
    networkPolicy:
      enabled: true
      allowedNamespaces:
        - quant-system
    env: []
    secrets: []
    # `/api/health`, not `/health`. THIS PROBE COULD NEVER HAVE PASSED.
    #
    # quantmail is the Next.js app — `apps/quantmail/Dockerfile` runs
    # `next start -p 3010`, the port above — and Next mounts app-router handlers
    # under `/api`, so nothing was ever served at the bare path. `/health`
    # returned Next's 404 page, readiness never went green, and any rollout of
    # this chart's quantmail deployment would have hung at 0 available while
    # liveness restarted the container every 30 seconds.
    #
    # `apps/quantmail/src/app/api/health/route.ts` now serves it — the same path
    # this app's own Dockerfile HEALTHCHECK has always polled. Next resolves that
    # static segment ahead of the `api/[...path]` proxy, so the probe does not go
    # through the backend allowlist. Both probes use the same path on purpose: a
    # frontend container has no database, so there is nothing to be ready for
    # beyond having booted.
    probes:
      liveness:
        path: /api/health
        initialDelaySeconds: 15
        periodSeconds: 10
      readiness:
        path: /api/health
        initialDelaySeconds: 5
        periodSeconds: 5

  quantchat:
    enabled: true
    replicaCount: 2
    image:
      repository: quant/quantchat
      tag: latest
      pullPolicy: IfNotPresent
    port: 3015
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilization: 70
      targetMemoryUtilization: 75
    pdb:
      enabled: true
      minAvailable: 1
    networkPolicy:
      enabled: true
      allowedNamespaces:
        - quant-system
    env: []
    secrets: []
    # `/api/health`, not `/health`. THIS PROBE COULD NEVER HAVE PASSED.
    #
    # This chart entry deploys the *frontend* image: `apps/quantchat/Dockerfile`
    # runs `next start -p 3015`, which is the port above. Next serves app-router
    # handlers under `/api`, so nothing was ever mounted at the bare path and
    # `/health` returned Next's 404 page — readiness never went green and
    # liveness restarted the container every 30 seconds.
    #
    # NOT `/livez` / `/readyz`. Those are `@quant/server-core` routes and belong
    # to the Fastify backend on 3002, deployed separately by
    # `infra/k8s/quantchat-backend.yaml`. Pointing this probe at them would
    # target a route the container on 3015 does not have.
    #
    # `apps/quantchat/src/app/api/health/route.ts` now serves it, matching the
    # path this app's own Dockerfile HEALTHCHECK has always polled.
    probes:
      liveness:
        path: /api/health
        initialDelaySeconds: 15
        periodSeconds: 10
      readiness:
        path: /api/health
        initialDelaySeconds: 5
        periodSeconds: 5

  quantai:
    enabled: true
    replicaCount: 2
    image:
      repository: quant/quantai
      tag: latest
      pullPolicy: IfNotPresent
    port: 3020
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 15
      targetCPUUtilization: 65
      targetMemoryUtilization: 70
    pdb:
      enabled: true
      minAvailable: 1
    networkPolicy:
      enabled: true
      allowedNamespaces:
        - quant-system
    env: []
    secrets: []
    # Same as quantchat above: this entry deploys the frontend image, since
    # `apps/quantai/Dockerfile` runs `next start -p 3020` — the port above — and
    # its own HEALTHCHECK polls `/api/health`. `apps/quantai/src/app/api/health/
    # route.ts` now serves that path.
    #
    # The Fastify backend is a separate deployment on 3004
    # (`infra/k8s/quantai-backend.yaml`). Worth recording why `/health` is wrong
    # there too: `apps/quantai/backend/app.ts` registers its health routes under
    # `prefix: '/health'` while `routes/health.ts` declares `/health` and
    # `/ready` inside that prefix, so the reachable paths are `/health/health`
    # and `/health/ready`. Bare `/health` was nobody's route on either image.
    probes:
      liveness:
        path: /api/health
        initialDelaySeconds: 20
        periodSeconds: 10
      readiness:
        path: /api/health
        initialDelaySeconds: 10
        periodSeconds: 5

  admin:
    enabled: true
    replicaCount: 2
    image:
      repository: quant/admin
      tag: latest
      pullPolicy: IfNotPresent
    port: 3100
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 8
      targetCPUUtilization: 70
      targetMemoryUtilization: 75
    pdb:
      enabled: true
      minAvailable: 1
    networkPolicy:
      enabled: true
      allowedNamespaces:
        - quant-system
    env: []
    secrets: []
    # `/api/healthz`, not `/health` and deliberately not `/api/health`.
    #
    # admin is a Next.js app, so the bare path was never served — Next mounts
    # app-router handlers under `/api`. But `apps/admin/src/app/api/health/
    # route.ts` is not a container probe either: it is the dashboard's fan-out,
    # issuing 22 `fetch('http://localhost:<port>/health')` calls with a 2s
    # timeout each and returning 200 regardless. Probing it every 5s would be a
    # request storm that reports only that Next is routing.
    #
    # `apps/admin/src/app/api/healthz/route.ts` answers exactly that question and
    # nothing else, and this app's Dockerfile HEALTHCHECK now polls the same path.
    probes:
      liveness:
        path: /api/healthz
        initialDelaySeconds: 15
        periodSeconds: 10
      readiness:
        path: /api/healthz
        initialDelaySeconds: 5
        periodSeconds: 5

istio:
  enabled: false

monitoring:
  enabled: false
