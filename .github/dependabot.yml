# Keep routine dependency maintenance bounded for this large monorepo.
# Security updates remain eligible while breaking majors require deliberate review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: deps
      include: scope
    groups:
      safe-non-major-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
