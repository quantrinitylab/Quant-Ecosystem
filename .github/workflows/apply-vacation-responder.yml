name: Apply focused vacation responder patch

on:
  push:
    branches:
      - design/quantmail-settings-live-vacation-responder
    paths:
      - .agent/apply-vacation.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: design/quantmail-settings-live-vacation-responder
      - name: Apply patch and remove staging files
        shell: bash
        run: |
          python .agent/apply-vacation.py
          rm .agent/apply-vacation.py .github/workflows/apply-vacation-responder.yml
          rmdir .agent
          git config user.name "quantrinitylab"
          git config user.email "roshanisingh70049234@gmail.com"
          git add -A
          git commit -m "feat(quantmail): wire live vacation responder settings"
          git push
