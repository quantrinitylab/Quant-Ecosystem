name: Dependency remediation diagnostics

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/dependency-remediation-diagnostics.yml'
      - 'packages/data-plane/**'
      - 'packages/social-graph/**'
      - 'services/cdc-relay/**'

permissions:
  contents: read
  checks: write

concurrency:
  group: dependency-remediation-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-diagnostic:
    name: capture-${{ matrix.target }}-diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - target: data-plane
            dir: packages/data-plane
          - target: social-graph
            dir: packages/social-graph
          - target: cdc-relay
            dir: services/cdc-relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @quant/database exec prisma generate --schema=prisma/schema.prisma

      - name: Publish sanitized compiler coordinates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET: ${{ matrix.target }}
          TARGET_DIR: ${{ matrix.dir }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set +e
          pnpm --dir "$TARGET_DIR" exec tsc --noEmit --pretty false > diagnostic.log 2>&1
          status=$?
          set -e

          publish_check() {
            local name="$1"
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name="$name" \
              -f head_sha="$HEAD_SHA" \
              -f status='completed' \
              -f conclusion='neutral' >/dev/null
          }

          if [ "$status" -eq 0 ]; then
            publish_check "diagnostic-$TARGET-unexpected-pass"
            exit 0
          fi

          mapfile -t coordinates < <(
            sed -nE 's#^(.+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+):.*#\1|\2|\4#p' diagnostic.log \
              | sort -u \
              | head -n 20
          )

          if [ "${#coordinates[@]}" -gt 0 ]; then
            for coordinate in "${coordinates[@]}"; do
              IFS='|' read -r file line code <<< "$coordinate"
              base="$(basename "$file")"
              stem="${base%.*}"
              slug="$(printf '%s' "$stem" | tr -cs '[:alnum:]' '-')"
              publish_check "diagnostic-$TARGET-${slug}-L${line}-${code}"
            done
            exit 0
          fi

          mapfile -t codes < <(grep -oE 'TS[0-9]+' diagnostic.log | sort -u | head -n 20)
          if [ "${#codes[@]}" -gt 0 ]; then
            for code in "${codes[@]}"; do
              publish_check "diagnostic-$TARGET-$code"
            done
            exit 0
          fi

          publish_check "diagnostic-$TARGET-non-ts-error"
