name: Dependency remediation direct validation

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - packages/data-plane/**
      - packages/social-graph/**
      - services/cdc-relay/**
      - services/moderation-worker/**
      - .github/workflows/dependency-remediation-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: dependency-remediation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-validation:
    name: direct-${{ matrix.target }}-${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: data-plane
            dir: packages/data-plane
            task: typecheck
          - target: data-plane
            dir: packages/data-plane
            task: build
          - target: data-plane
            dir: packages/data-plane
            task: test
          - target: social-graph
            dir: packages/social-graph
            task: typecheck
          - target: social-graph
            dir: packages/social-graph
            task: build
          - target: social-graph
            dir: packages/social-graph
            task: test
          - target: cdc-relay
            dir: services/cdc-relay
            task: typecheck
          - target: cdc-relay
            dir: services/cdc-relay
            task: build
          - target: cdc-relay
            dir: services/cdc-relay
            task: test
          - target: moderation-worker
            dir: services/moderation-worker
            task: typecheck
          - target: moderation-worker
            dir: services/moderation-worker
            task: build
          - target: moderation-worker
            dir: services/moderation-worker
            task: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @quant/database exec prisma generate --schema=prisma/schema.prisma

      - name: Run direct validation
        env:
          TARGET_DIR: ${{ matrix.dir }}
          TASK: ${{ matrix.task }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --dir "$TARGET_DIR" run "$TASK"
