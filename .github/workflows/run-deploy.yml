name: Run Deploy

# v2: status reporter. Bump to publish recent workflow run statuses.
# (Does NOT re-dispatch; re-dispatch would cancel an in-progress deploy.)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-deploy.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: run-deploy
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "=== runs-status $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            gh run list -R "$GITHUB_REPOSITORY" --limit 16 --json workflowName,status,conclusion,createdAt,displayTitle | jq -r '.[] | "\(.createdAt) | \(.workflowName) | \(.status) | \(.conclusion) | \(.displayTitle)"'
          } > /tmp/runs.txt 2>&1
          cat /tmp/runs.txt
          mkdir -p infra/status
          cp /tmp/runs.txt infra/status/runs-status.txt
          git config user.name "gha-bot"
          git config user.email "gha-bot@users.noreply.github.com"
          git add -f infra/status/runs-status.txt
          git commit -m "runs status"
          git push -f origin HEAD:runs-status
