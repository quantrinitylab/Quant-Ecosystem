name: Run Deploy

# v3: fetch failed deploy logs.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-deploy.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: run-deploy
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report deploy failure log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "=== deploy-log $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow=deploy-feature-staging.yml --limit 1 --json databaseId | jq -r '.[0].databaseId')
            echo "run_id=$id"
            gh run view "$id" -R "$GITHUB_REPOSITORY" --json status,conclusion,createdAt,updatedAt | jq -r '.'
            echo "--- failed step logs (tail) ---"
            gh run view "$id" -R "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -c 6000
            echo ""
            echo "--- recent runs ---"
            gh run list -R "$GITHUB_REPOSITORY" --limit 6 --json workflowName,status,conclusion,createdAt | jq -r '.[] | "\(.createdAt) | \(.workflowName) | \(.status) | \(.conclusion)"'
            echo "=== done ==="
          } > /tmp/runs.txt 2>&1
          cat /tmp/runs.txt
          mkdir -p infra/status
          cp /tmp/runs.txt infra/status/runs-status.txt
          git config user.name "gha-bot"
          git config user.email "gha-bot@users.noreply.github.com"
          git add -f infra/status/runs-status.txt
          git commit -m "runs status"
          git push -f origin HEAD:runs-status
