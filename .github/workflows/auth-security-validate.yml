name: Auth security validation

on:
  pull_request:
    paths:
      - 'packages/auth/**'
      - 'packages/common/**'
      - 'packages/database/prisma/schema.prisma'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/auth-security-validate.yml'
  push:
    branches: [main]
    paths:
      - 'packages/auth/**'
      - 'packages/common/**'
      - 'packages/database/prisma/schema.prisma'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/auth-security-validate.yml'

permissions:
  contents: read

jobs:
  validate-refresh-token-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @quant/database exec prisma generate --schema=prisma/schema.prisma

      - name: Build auth workspace dependencies
        run: pnpm --filter @quant/common build

      - name: Typecheck auth package
        run: pnpm --filter @quant/auth typecheck

      - name: Validate refresh-token security invariants
        run: >-
          pnpm --filter @quant/auth exec vitest run
          src/__tests__/refresh-token-hardening.test.ts
