name: Fix staging (migrations + rollout + ELB)

# One-time fix: runs Prisma migrations THROUGH the cluster (RDS is private),
# restarts the backend, and reports the ELB hostname for Cloudflare DNS.
on:
  workflow_dispatch:
    inputs:
      db_password:
        description: 'RDS master password (quant user)'
        required: true
        type: string

concurrency:
  group: k8s-setup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fix:
    name: Diagnose + migrate + restart
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      RDS_ENDPOINT: quant-staging-postgres.cqzas6wik73y.us-east-1.rds.amazonaws.com
      RDS_DB: quant_staging
      RDS_USER: quant
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-fix-staging-${{ github.run_id }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Diagnose current state
        run: |
          echo "=== Pods ==="
          kubectl get pods -n "$K8S_NAMESPACE" -o wide || true
          echo "=== Deployments ==="
          kubectl get deploy -n "$K8S_NAMESPACE" || true
          POD=$(kubectl get pods -n "$K8S_NAMESPACE" -l app.kubernetes.io/name=quantmail-backend --sort-by=.metadata.creationTimestamp -o name | tail -1)
          echo "Backend pod: $POD"
          if [ -n "$POD" ]; then
            echo "=== Backend pod describe (tail) ==="
            kubectl describe "$POD" -n "$K8S_NAMESPACE" | tail -40 || true
            echo "=== Backend logs (current) ==="
            kubectl logs "$POD" -n "$K8S_NAMESPACE" --tail=100 || true
            echo "=== Backend logs (previous crash) ==="
            kubectl logs "$POD" -n "$K8S_NAMESPACE" --previous --tail=100 || true
          fi
          echo "=== Recent events ==="
          kubectl get events -n "$K8S_NAMESPACE" --sort-by=.lastTimestamp | tail -30 || true
          echo "=== Ingress controller service ==="
          kubectl get svc -n ingress-nginx || true

      - name: Start DB proxy (socat via cluster)
        run: |
          kubectl delete pod pg-proxy -n "$K8S_NAMESPACE" --ignore-not-found
          kubectl run pg-proxy -n "$K8S_NAMESPACE" --image=alpine/socat --restart=Never -- \
            TCP-LISTEN:5432,fork,reuseaddr TCP:quant-staging-postgres.cqzas6wik73y.us-east-1.rds.amazonaws.com:5432
          kubectl wait --for=condition=Ready pod/pg-proxy -n "$K8S_NAMESPACE" --timeout=120s
          kubectl port-forward pod/pg-proxy -n "$K8S_NAMESPACE" 15432:5432 &
          echo $! > /tmp/pf.pid
          sleep 5
          PGPASSWORD='${{ inputs.db_password }}' psql -h 127.0.0.1 -p 15432 -U "$RDS_USER" -d "$RDS_DB" -c 'SELECT version();'

      - name: Run Prisma migrations (through cluster proxy)
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile --filter "@quant/database..." || pnpm install --frozen-lockfile
          DATABASE_URL="postgresql://${RDS_USER}:${{ inputs.db_password }}@127.0.0.1:15432/${RDS_DB}" \
            pnpm --filter @quant/database exec prisma migrate deploy --schema=prisma/schema.prisma
          echo "Migrations done"

      - name: Stop DB proxy
        if: always()
        run: |
          kill "$(cat /tmp/pf.pid)" 2>/dev/null || true
          kubectl delete pod pg-proxy -n "$K8S_NAMESPACE" --ignore-not-found || true

      - name: Restart backend + wait
        run: |
          kubectl rollout restart deployment/quant-quantmail-backend -n "$K8S_NAMESPACE"
          if ! kubectl rollout status deployment/quant-quantmail-backend -n "$K8S_NAMESPACE" --timeout=420s; then
            echo "=== Rollout failed - dumping state ==="
            kubectl get pods -n "$K8S_NAMESPACE" -l app.kubernetes.io/name=quantmail-backend -o wide || true
            POD=$(kubectl get pods -n "$K8S_NAMESPACE" -l app.kubernetes.io/name=quantmail-backend --sort-by=.metadata.creationTimestamp -o name | tail -1)
            if [ -n "$POD" ]; then
              kubectl describe "$POD" -n "$K8S_NAMESPACE" | tail -40 || true
              kubectl logs "$POD" -n "$K8S_NAMESPACE" --tail=120 || true
              kubectl logs "$POD" -n "$K8S_NAMESPACE" --previous --tail=120 || true
            fi
            exit 1
          fi

      - name: Get ELB hostname
        run: |
          ELB=""
          for i in $(seq 1 30); do
            ELB=$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$ELB" ]; then break; fi
            echo "Attempt $i/30 - ELB not ready, waiting 10s..."
            sleep 10
          done
          if [ -z "$ELB" ]; then
            echo "ELB still not assigned - diagnosing:"
            kubectl describe svc ingress-nginx-controller -n ingress-nginx | tail -30 || true
            kubectl get events -n ingress-nginx --sort-by=.lastTimestamp | tail -20 || true
          fi
          echo "ELB_HOSTNAME=$ELB" >> "$GITHUB_ENV"
          echo "ELB: $ELB"

      - name: Summary
        run: |
          {
            echo "## Staging fix result"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Backend rollout | OK |"
            echo "| ELB hostname | ${ELB_HOSTNAME:-NOT ASSIGNED} |"
            echo ""
            echo "Point Cloudflare CNAMEs (quantmail + staging) to the ELB hostname."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Done."
