name: Repair PR 132 inherited test contracts

on:
  push:
    branches:
      - security/quantmail-browser-refresh-cookie

permissions:
  contents: write

jobs:
  repair-test-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/quantmail-browser-refresh-cookie

      - name: Align inherited tests with the hardened browser boundary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const lines = (...values) => values.join('\n');
          function replaceOnce(path, from, to) {
            const source = fs.readFileSync(path, 'utf8');
            const matches = source.split(from).length - 1;
            if (matches !== 1) {
              throw new Error(path + ': expected one exact match, found ' + matches);
            }
            fs.writeFileSync(path, source.replace(from, to));
          }

          const vacation = 'apps/quantmail/src/__tests__/vacation-responder-api-client.test.ts';
          replaceOnce(
            vacation,
            lines(
              '    expect(fetchMock).toHaveBeenNthCalledWith(',
              '      2,',
              "      'https://mail.test/vacation-responder',",
              '      expect.objectContaining({',
              "        method: 'PUT',",
              '        body: JSON.stringify(payload),',
              "        headers: expect.objectContaining({ 'Content-Type': 'application/json' }),",
              '      }),',
              '    );',
            ),
            lines(
              '    expect(fetchMock).toHaveBeenNthCalledWith(',
              '      2,',
              "      'https://mail.test/vacation-responder',",
              '      expect.objectContaining({',
              "        method: 'PUT',",
              '        body: JSON.stringify(payload),',
              "        credentials: 'include',",
              '      }),',
              '    );',
              '    const secondRequest = fetchMock.mock.calls[1]?.[1] as RequestInit | undefined;',
              "    expect(new Headers(secondRequest?.headers).get('Content-Type')).toBe('application/json');",
            ),
          );

          const preservation =
            'apps/quantmail/backend/__tests__/quantmail-oauth-e2ee-federation.preservation.bug2.seam.test.ts';
          replaceOnce(
            preservation,
            'const authedHeaders = () => ({ authorization: `Bearer ${signToken([])}` });',
            lines(
              'const authedHeaders = () => ({',
              '  authorization: `Bearer ${signToken([])}`,',
              "  origin: 'http://localhost:3000',",
              '});',
            ),
          );
          replaceOnce(
            preservation,
            lines(
              '  const app = Fastify({ logger: false });',
              '',
              '  // REAL envelope mapper (ZodError -> 400 VALIDATION_ERROR; AppError -> code).',
            ),
            lines(
              '  const app = Fastify({ logger: false });',
              '',
              "  // This isolated harness does not boot createApp(), so reproduce the cookie",
              '  // decorators that production registers before authRoutes.',
              "  app.decorateRequest('cookies', null);",
              "  app.decorateReply('setCookie', function (name: string, value: string) {",
              "    this.header('set-cookie', `${name}=${value}`);",
              '    return this;',
              '  });',
              "  app.decorateReply('clearCookie', function (name: string) {",
              "    this.header('set-cookie', `${name}=; Max-Age=0`);",
              '    return this;',
              '  });',
              '',
              '  // REAL envelope mapper (ZodError -> 400 VALIDATION_ERROR; AppError -> code).',
            ),
          );
          replaceOnce(
            preservation,
            "        refreshToken: 'mock-refresh-token',\n",
            '',
          );
          replaceOnce(
            preservation,
            lines(
              "  it('auth.ts depends on prisma (default), secure-random, token-service, and secrets', () => {",
              "    const src = read('../routes/auth.ts');",
              '    for (const spec of [',
              "      '@quant/auth/lib/prisma',",
              "      '@quant/auth/crypto/secure-random',",
              "      '@quant/auth/services/token-service',",
              "      '@quant/auth/lib/secrets',",
              '    ]) {',
              '      expect(src, `auth.ts must import ${spec}`).toContain(spec);',
              '    }',
              '  });',
            ),
            lines(
              "  it('auth.ts depends on prisma (default), token-service, and secrets', () => {",
              "    const src = read('../routes/auth.ts');",
              '    for (const spec of [',
              "      '@quant/auth/lib/prisma',",
              "      '@quant/auth/services/token-service',",
              "      '@quant/auth/lib/secrets',",
              '    ]) {',
              '      expect(src, `auth.ts must import ${spec}`).toContain(spec);',
              '    }',
              "    expect(src).not.toContain('@quant/auth/crypto/secure-random');",
              '  });',
            ),
          );
          NODE

          git diff --check

      - name: Commit deterministic test repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/quantmail/src/__tests__/vacation-responder-api-client.test.ts \
            apps/quantmail/backend/__tests__/quantmail-oauth-e2ee-federation.preservation.bug2.seam.test.ts
          git diff --cached --quiet && { echo 'Expected a deterministic test repair diff' >&2; exit 1; }
          git commit -m 'test(quantmail): align inherited contracts with cookie auth'
          git push origin HEAD:security/quantmail-browser-refresh-cookie
