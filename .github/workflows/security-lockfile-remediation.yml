name: Security lockfile remediation

on:
  push:
    branches: [security/remediate-moderate-audit]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: security/remediate-moderate-audit

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Pin patched transitive dependencies
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(readFileSync(path, 'utf8'));
          const overrides = pkg.pnpm.overrides;
          delete overrides['tar@<=7.5.18'];
          overrides['tar@<=7.5.20'] = '7.5.22';
          overrides['protobufjs@<=7.6.4'] = '7.6.5';
          overrides['@opentelemetry/core@<2.8.0'] = '2.9.0';
          overrides['request@<=2.88.2'] = 'npm:@cypress/request@4.0.1';
          overrides['qs@<6.14.2'] = '6.15.2';
          overrides['tough-cookie@<4.1.3'] = '4.1.3';
          writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only

      - name: Commit patched dependency graph
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Dependency graph already patched'
          else
            git commit -m 'security: patch moderate dependency advisories'
            git push origin HEAD:security/remediate-moderate-audit
          fi

      - name: Verify moderate dependency audit
        run: node scripts/dependency-audit.mjs --level moderate
