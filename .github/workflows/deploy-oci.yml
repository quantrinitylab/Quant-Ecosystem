name: Deploy OCI (SSH + compose)

# ── Oracle Cloud deploy path ─────────────────────────────────────────────
# Created 2026-10-17 for the Oracle Cloud migration (old AWS account dead).
# Deploys the staging stack to OCI A1 VMs via SSH + docker compose — no OKE,
# no EKS. Architecture: vm-app (4 OCPU/24 GB, public IP) runs the app compose
# stack; vm-db (2 OCPU/12 GB, private) runs Postgres; images from GHCR.
#
# HOW IT WORKS
#   1. validate-release: release_sha must be the exact current main HEAD and
#      must carry a successful `gate` check — fail closed otherwise.
#   2. build-and-push: builds the target's Docker image(s), pushes SHA-tagged
#      images to GHCR (ghcr.io/<owner>/quant-oci-<name>:<sha>).
#   3. deploy-oci: SSHes to vm-app, copies compose/quant-stack.yml over, runs
#      the Prisma migrations (backend targets) inside the VM, then
#      `docker compose pull && up -d`, health-checks, and rolls back to the
#      last-good tag on failure.
#
# COMPOSE CONTRACT (compose/quant-stack.yml — authored in migration Phase C):
#   * services reference images ghcr.io/<owner>/quant-oci-<name>:${IMAGE_TAG}
#     (IMAGE_TAG defaults to `latest`; this workflow always sets the SHA)
#   * service names: quantmail-frontend, quantmail-backend, quantchat, quantai
#   * every service exposes /api/health returning HTTP 200
#
# VM PROVISIONING CONTRACT (migration Phase B/C cloud-init):
#   * SSH user (default `opc`) has the `quant-deploy` public key authorized
#   * SSH user can run docker (docker group) and has the compose plugin
#   * /opt/quant/oci is writable by the SSH user (compose files land here)
#   * /etc/quant/secrets.env (0600, readable by the SSH user) holds
#     DATABASE_URL and other secrets — the workflow NEVER sees secret values
#
# REQUIRED CONFIGURATION (before first use):
#   * GitHub environment `oci-staging` with secret OCI_DEPLOY_SSH_KEY
#     (private half of the ed25519 `quant-deploy` keypair; user adds it —
#     agents never handle the private key value)
#   * Variable VM_APP_IP = public IP of vm-app
#       TODO(Phase B): vm-app does not exist yet (A1 capacity blocked
#       2026-10-17) — set vars.VM_APP_IP once the retry creates it.
#   * Variable OCI_SSH_USER (default: opc)
#   * GHCR: publish the quant-oci-* packages as PUBLIC (recommended — they
#     contain only built app code, no secrets), or set secret GHCR_READ_TOKEN
#     (fine-grained PAT with packages:read) + var GHCR_READ_USER.
# ─────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      target:
        description: App to build and deploy on the Oracle Cloud VMs
        required: true
        type: choice
        options:
          - quantmail
          - quantmail-backend
          - quantchat
          - quantai
      release_sha:
        description: Exact 40-character SHA of the current protected main commit
        required: true
        type: string
      vm_app_ip:
        description: 'Override for the vm-app public IP (default: vars.VM_APP_IP)'
        required: false
        type: string

concurrency:
  group: oci-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate immutable main release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Validate exact current main commit
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'release_sha must be one lowercase 40-character commit SHA' >&2
            exit 1
          }
          test "$EVENT_REF" = 'refs/heads/main' || {
            echo 'Dispatch must select the main branch' >&2
            exit 1
          }
          test "$RELEASE_SHA" = "$EVENT_SHA" || {
            echo 'release_sha must equal the selected workflow commit' >&2
            exit 1
          }
          main_sha="$(gh api "/repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$RELEASE_SHA" = "$main_sha" || {
            echo 'release_sha is not the current main commit' >&2
            exit 1
          }
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require successful CI gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          # NOTE: the gate check can race its attachment to the merge commit —
          # if this fails seconds after a merge, wait for gate to finish and
          # re-dispatch instead of forcing it.
          gate_count="$(gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs" \
            -f filter=latest -f per_page=100 \
            --jq '[.check_runs[] | select(.name == "gate" and .status == "completed" and .conclusion == "success")] | length')"
          test "$gate_count" -ge 1 || {
            echo 'The exact release SHA does not have a successful gate check' >&2
            exit 1
          }

  build-and-push:
    name: Build and push ${{ inputs.target }}
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
    outputs:
      image_refs: ${{ steps.push.outputs.image_refs }}
      backend_image: ${{ steps.push.outputs.backend_image }}
      runs_migrations: ${{ steps.target.outputs.runs_migrations }}
      compose_services: ${{ steps.target.outputs.compose_services }}
    steps:
      - name: Checkout immutable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.release_sha }}
          clean: true
          persist-credentials: false

      - name: Resolve approved target
        id: target
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          runs_migrations=false
          # Each entry: "<ghcr-image-name>:<dockerfile> [...]".
          # Extend this case block to add future app targets.
          case "$TARGET" in
            quantmail)
              images="quant-oci-quantmail-frontend:apps/quantmail/Dockerfile quant-oci-quantmail-backend:apps/quantmail/Dockerfile.backend"
              compose_services="quantmail-frontend quantmail-backend" ;;
            quantmail-backend)
              images="quant-oci-quantmail-backend:apps/quantmail/Dockerfile.backend"
              compose_services="quantmail-backend"
              runs_migrations=true ;;
            quantchat)
              images="quant-oci-quantchat:apps/quantchat/Dockerfile"
              compose_services="quantchat" ;;
            quantai)
              images="quant-oci-quantai:apps/quantai/Dockerfile"
              compose_services="quantai" ;;
            *) echo "Unsupported target: $TARGET" >&2; exit 1 ;;
          esac
          for pair in $images; do
            test -f "${pair#*:}" || { echo "Missing Dockerfile: ${pair#*:}" >&2; exit 1; }
          done
          {
            echo "images=$images"
            echo "compose_services=$compose_services"
            echo "runs_migrations=$runs_migrations"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Build and push SHA-tagged images
        id: push
        shell: bash
        env:
          IMAGES: ${{ steps.target.outputs.images }}
        run: |
          set -euo pipefail
          owner_lc="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          refs=""
          for pair in $IMAGES; do
            name="${pair%%:*}"
            dockerfile="${pair#*:}"
            image="ghcr.io/$owner_lc/$name:$RELEASE_SHA"
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "Immutable image already exists; reusing $image"
            else
              docker build --pull -f "$dockerfile" -t "$image" .
              docker push "$image"
            fi
            refs="$refs $image"
            if [[ "$name" == *-backend ]]; then
              echo "backend_image=$image" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "image_refs=$(echo "$refs" | xargs)" >> "$GITHUB_OUTPUT"

      - name: Logout from GHCR
        if: always()
        shell: bash
        run: docker logout ghcr.io >/dev/null 2>&1 || true

  deploy-oci:
    name: Deploy ${{ inputs.target }} to OCI VMs
    needs: [validate-release, build-and-push]
    environment: oci-staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
      TARGET: ${{ inputs.target }}
      RUNS_MIGRATIONS: ${{ needs.build-and-push.outputs.runs_migrations }}
      COMPOSE_SERVICES: ${{ needs.build-and-push.outputs.compose_services }}
      BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
      IMAGE_REFS: ${{ needs.build-and-push.outputs.image_refs }}
      VM_APP_IP: ${{ inputs.vm_app_ip || vars.VM_APP_IP }}
      OCI_SSH_USER: ${{ vars.OCI_SSH_USER || 'opc' }}
      GHCR_READ_USER: ${{ vars.GHCR_READ_USER || github.repository_owner }}
    steps:
      - name: Validate OCI environment contract
        shell: bash
        env:
          OCI_DEPLOY_SSH_KEY: ${{ secrets.OCI_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          # TODO(Phase B): vm-app does not exist yet (A1 capacity blocked
          # 2026-10-17). Set vars.VM_APP_IP once the retry creates it —
          # until then this fails closed here with a clear message.
          test -n "$VM_APP_IP" || {
            echo 'VM_APP_IP is empty: vm-app has no public IP yet (Phase B pending).' >&2
            exit 1
          }
          [[ "$VM_APP_IP" =~ ^[A-Za-z0-9.-]+$ ]] || {
            echo "VM_APP_IP looks invalid: $VM_APP_IP" >&2
            exit 1
          }
          test -n "$OCI_SSH_USER" || { echo 'OCI_SSH_USER is empty' >&2; exit 1; }
          test -n "${OCI_DEPLOY_SSH_KEY:-}" || {
            echo 'Missing secret OCI_DEPLOY_SSH_KEY in environment oci-staging.' >&2
            exit 1
          }

      - name: Checkout immutable release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-release.outputs.release_sha }}
          clean: true
          persist-credentials: false

      - name: Set up SSH to vm-app
        shell: bash
        env:
          OCI_DEPLOY_SSH_KEY: ${{ secrets.OCI_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # printf is a builtin: the key never appears in a process arg list.
          printf '%s' "$OCI_DEPLOY_SSH_KEY" > ~/.ssh/oci-deploy
          chmod 600 ~/.ssh/oci-deploy
          ssh-keyscan -H "$VM_APP_IP" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/oci-deploy -o BatchMode=yes -o ConnectTimeout=15 \
            "$OCI_SSH_USER@$VM_APP_IP" 'echo SSH_OK && docker --version && docker compose version'

      - name: Login to GHCR on vm-app (private packages only)
        shell: bash
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${GHCR_READ_TOKEN:-}" ]; then
            # Token travels over the encrypted SSH channel via stdin; it never
            # appears in a process argument list on either side.
            printf '%s' "$GHCR_READ_TOKEN" | ssh -i ~/.ssh/oci-deploy -o BatchMode=yes \
              "$OCI_SSH_USER@$VM_APP_IP" "docker login ghcr.io -u '$GHCR_READ_USER' --password-stdin"
          else
            echo 'GHCR_READ_TOKEN unset — assuming quant-oci-* packages are public.'
          fi

      - name: Copy compose stack to vm-app
        shell: bash
        run: |
          set -euo pipefail
          # The stack file is authored in migration Phase C; fail closed with
          # a clear pointer until it exists in the release.
          test -f compose/quant-stack.yml || {
            echo 'compose/quant-stack.yml not found in the release — migration Phase C has not authored it yet.' >&2
            exit 1
          }
          ssh -i ~/.ssh/oci-deploy -o BatchMode=yes \
            "$OCI_SSH_USER@$VM_APP_IP" 'mkdir -p /opt/quant/oci'
          scp -i ~/.ssh/oci-deploy -o BatchMode=yes \
            compose/quant-stack.yml "$OCI_SSH_USER@$VM_APP_IP:/opt/quant/oci/quant-stack.yml"

      - name: Run Prisma migrations on vm-app
        if: env.RUNS_MIGRATIONS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKEND_IMAGE" || { echo 'No backend image ref' >&2; exit 1; }
          # Migrations run INSIDE the VM — the runner has no network path to
          # vm-db's private IP. DATABASE_URL comes from /etc/quant/secrets.env
          # on the VM, so the plaintext URL never touches the runner.
          # The prisma CLI path mirrors deploy-staging.yml: pnpm's isolated
          # layout keeps it at packages/database/node_modules/prisma/build/index.js
          # inside the backend image.
          ssh -i ~/.ssh/oci-deploy -o BatchMode=yes "$OCI_SSH_USER@$VM_APP_IP" \
            "BACKEND_IMAGE='$BACKEND_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          docker pull "$BACKEND_IMAGE"
          docker run --rm --env-file /etc/quant/secrets.env "$BACKEND_IMAGE" \
            node packages/database/node_modules/prisma/build/index.js migrate deploy \
            --schema=packages/database/prisma/schema.prisma
          REMOTE

      - name: Pull and start the stack
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oci-deploy -o BatchMode=yes "$OCI_SSH_USER@$VM_APP_IP" \
            "RELEASE_SHA='$RELEASE_SHA' SERVICES='$COMPOSE_SERVICES' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/quant/oci
          # Snapshot the current tag for rollback before switching.
          if [ -f .last-good-tag ]; then cp .last-good-tag .prev-tag; fi
          # Scope pull/up to this target's services (+ the Caddy proxy, which the
          # health check needs). An unscoped pull fails on the first deploy of
          # any target because the other targets' images don't exist on GHCR yet.
          IMAGE_TAG="$RELEASE_SHA" docker compose -f quant-stack.yml pull $SERVICES quant-proxy
          IMAGE_TAG="$RELEASE_SHA" docker compose -f quant-stack.yml up -d --remove-orphans $SERVICES quant-proxy
          # Per-service state check: every service for this target must be running.
          running="$(IMAGE_TAG="$RELEASE_SHA" docker compose -f quant-stack.yml ps --status running --services)"
          for svc in $SERVICES; do
            echo "$running" | grep -qx "$svc" || {
              echo "Service $svc is not running after up." >&2
              IMAGE_TAG="$RELEASE_SHA" docker compose -f quant-stack.yml ps
              exit 1
            }
          done
          echo "Services running: $(echo "$running" | tr '\n' ' ')"
          REMOTE

      - name: Health-check the stack
        id: health
        shell: bash
        run: |
          set -euo pipefail
          # -k: vm-app serves the Cloudflare Origin cert, which does not match
          # the raw IP. Per-service/per-domain checks land in Phase C/D.
          code=""
          for _ in $(seq 1 30); do
            code="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 \
              "https://$VM_APP_IP/api/health" 2>/dev/null || true)"
            [ "$code" = 200 ] && break
            sleep 10
          done
          if [ "$code" = 200 ]; then
            echo 'Stack is healthy.'
            echo "healthy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Health check failed (last code: ${code:-none}); rolling back." >&2
            echo "healthy=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Record last-good tag
        if: steps.health.outputs.healthy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oci-deploy -o BatchMode=yes "$OCI_SSH_USER@$VM_APP_IP" \
            "RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          printf '%s' "$RELEASE_SHA" > /opt/quant/oci/.last-good-tag
          REMOTE
          {
            echo '## OCI deploy'
            echo "- Target: \`$TARGET\`"
            echo "- Release SHA: \`$RELEASE_SHA\`"
            echo "- Host: \`$VM_APP_IP\`"
            echo "- Images: \`$IMAGE_REFS\`"
            echo "- Migrations: \`$RUNS_MIGRATIONS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back to previous tag
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oci-deploy -o BatchMode=yes "$OCI_SSH_USER@$VM_APP_IP" \
            "SERVICES='$COMPOSE_SERVICES' bash -s" <<'REMOTE' || true
          set -euo pipefail
          cd /opt/quant/oci
          if [ -f .prev-tag ]; then
            # Same scoping as the deploy step: only this target's services (+ proxy).
            IMAGE_TAG="$(cat .prev-tag)" docker compose -f quant-stack.yml up -d --remove-orphans $SERVICES quant-proxy
            cp .prev-tag .last-good-tag
            echo "Rolled back to $(cat .prev-tag)"
          else
            echo 'No previous tag recorded; leaving the stack in place for inspection.' >&2
          fi
          REMOTE

      - name: Remove deploy SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/oci-deploy
