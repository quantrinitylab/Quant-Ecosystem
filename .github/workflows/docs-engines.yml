name: Docs engines

# The on-device document engines (engines/: Rust → WebAssembly, served by QuantMail Drive).
# Licence/advisory policy and notices on every change; a full wasm build to catch breakage
# before the QuantMail image builds them.
on:
  pull_request:
    paths:
      - 'engines/**'
      - '.github/workflows/docs-engines.yml'
  push:
    branches: [main]
    paths:
      - 'engines/**'

concurrency:
  group: docs-engines-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: '1.99.0'
  CARGO_DENY_VERSION: '0.18.6'
  CARGO_DENY_SHA256: a9c3db6db22288045ad8407bd0febbb13c6339b3d948d666ae8ef634fb3f3853
  WASM_BINDGEN_VERSION: '0.2.129'
  WASM_BINDGEN_SHA256: 82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e

jobs:
  policy:
    name: Docs engines — licences, advisories, notices
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: cargo-deny (licences, bans, sources, advisories)
        run: |
          set -euo pipefail
          pkg="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/deny.tgz" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${pkg}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP"
          for crate in quant-pdf quant-word quant-slides quant-sheets; do
            echo "::group::$crate"
            "$RUNNER_TEMP/$pkg/cargo-deny" --manifest-path "engines/$crate/Cargo.toml" check --config "$PWD/engines/deny.toml"
            echo "::endgroup::"
          done

      - name: Third-party notices are current
        run: node engines/scripts/notices.mjs --check

  build:
    name: Docs engines — wasm build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain + wasm-bindgen
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          pkg="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/wb.tgz" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${pkg}.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  $RUNNER_TEMP/wb.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/wb.tgz" -C "$RUNNER_TEMP"
          echo "WASM_BINDGEN=$RUNNER_TEMP/$pkg/wasm-bindgen" >> "$GITHUB_ENV"

      - name: Build the bundle
        run: bash engines/build.sh "$RUNNER_TEMP/engines-out"

      - name: Bundle sizes
        run: |
          cd "$RUNNER_TEMP/engines-out"
          for f in */*/*.wasm; do
            printf '%-48s %8s raw %8s gzip\n' "$f" "$(du -h "$f" | cut -f1)" "$(gzip -9 -c "$f" | wc -c | numfmt --to=iec)"
          done | tee -a "$GITHUB_STEP_SUMMARY"
