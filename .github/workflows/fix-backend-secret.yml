name: Fix backend secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-backend-secret.yml'

permissions:
  contents: read

jobs:
  fix:
    name: Patch missing secrets + restart backend
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-secretfix-${{ github.run_id }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Patch JWT_REFRESH_SECRET from SSM + restart
        run: |
          VAL=$(aws ssm get-parameter --name /quant/staging/jwt_refresh_secret --with-decryption --query Parameter.Value --output text --region us-east-1)
          echo "::add-mask::$VAL"
          kubectl patch secret quant-platform-production-secrets -n "$K8S_NAMESPACE" -p "{\"stringData\":{\"JWT_REFRESH_SECRET\":\"$VAL\"}}"
          kubectl rollout restart deployment/quant-quantmail-backend -n "$K8S_NAMESPACE"

      - name: Auto-fix any additional missing secrets (up to 5)
        run: |
          for i in 1 2 3 4 5; do
            sleep 45
            LOGS=$(kubectl logs deployment/quant-quantmail-backend -n "$K8S_NAMESPACE" --tail=30 2>&1 || true)
            echo "---- logs attempt $i ----"
            echo "$LOGS" | tail -12
            MISSING=$(echo "$LOGS" | grep -oE '[A-Z][A-Z0-9_]+ must be set' | head -1 | awk '{print $1}' || true)
            if [ -z "$MISSING" ]; then
              echo "No 'must be set' errors in recent logs."
              break
            fi
            echo "Missing secret detected: $MISSING - patching with random value"
            VAL=$(openssl rand -hex 32)
            echo "::add-mask::$VAL"
            kubectl patch secret quant-platform-production-secrets -n "$K8S_NAMESPACE" -p "{\"stringData\":{\"$MISSING\":\"$VAL\"}}"
            kubectl rollout restart deployment/quant-quantmail-backend -n "$K8S_NAMESPACE"
          done

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/quant-quantmail-backend -n "$K8S_NAMESPACE" --timeout=300s || echo "rollout not complete yet"

      - name: Publish result to status-report branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p infra/status
          {
            echo "# backend fix result (run ${{ github.run_id }})"
            echo "time: $(date -u +%FT%TZ)"
            echo ""
            echo "## deployments"
            kubectl get deploy -n "$K8S_NAMESPACE" || true
            echo ""
            echo "## pods"
            kubectl get pods -n "$K8S_NAMESPACE" -o wide || true
            echo ""
            echo "## backend logs (tail 60)"
            kubectl logs deployment/quant-quantmail-backend -n "$K8S_NAMESPACE" --tail=60 --all-containers 2>&1 || true
            echo ""
            echo "## secret keys now present"
            kubectl get secret quant-platform-production-secrets -n "$K8S_NAMESPACE" -o jsonpath='{.data}' | tr ',' '\n' | grep -oE '\"[A-Z0-9_]+\"' | sort -u || true
          } > infra/status/backend-fix-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f infra/status/backend-fix-result.txt
          git commit -m "chore(status): backend fix run ${{ github.run_id }} [skip ci]" || echo "nothing to commit"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin HEAD:refs/heads/status-report && echo "PUSH_OK" || echo "PUSH_FAILED"
