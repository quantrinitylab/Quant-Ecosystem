name: Dependency remediation lockfile generator

on:
  push:
    branches:
      - fix/dependency-audit-2026-08
    paths:
      - packages/data-plane/package.json
      - packages/social-graph/package.json
      - services/cdc-relay/package.json
      - .github/workflows/dependency-remediation-lockfile.yml

permissions:
  contents: write

concurrency:
  group: dependency-remediation-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Regenerate lockfile from manifests
        run: pnpm install --no-frozen-lockfile

      - name: Test dependency-audit parser
        run: pnpm test:dependency-audit

      - name: Enforce high and critical dependency audit
        run: pnpm audit:dependencies

      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current."
            exit 0
          fi

          unexpected="$(git status --porcelain | grep -vE '^ M pnpm-lock\.yaml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): regenerate lockfile for Prisma peers"
          git push
