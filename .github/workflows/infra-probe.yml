name: Infra probe

# v2: no 'environment:' (v1 likely rejected by deployment branch policy).
# Reads staging env config + variable VALUES + recent runs via gh api.
on:
  push:
    branches: [infra-probe]

permissions:
  contents: write
  actions: read

concurrency:
  group: infra-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          V_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          V_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          V_REGION: ${{ vars.AWS_REGION }}
          V_CLUSTER: ${{ vars.EKS_CLUSTER }}
          V_NS: ${{ vars.K8S_NAMESPACE }}
        run: |
          set +e
          {
            echo "=== infra-probe-v2 $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "repo-scope vars: account=[$V_ACCOUNT] role=[$V_ROLE] region=[$V_REGION] cluster=[$V_CLUSTER] ns=[$V_NS]"
            echo "--- staging environment config ---"
            gh api "repos/$GITHUB_REPOSITORY/environments/staging" 2>&1 | jq '{protection_rules, deployment_branch_policy}' 2>&1
            echo "--- staging deployment branch policies ---"
            gh api "repos/$GITHUB_REPOSITORY/environments/staging/deployment-branch-policies" 2>&1
            echo "--- staging environment variables ---"
            gh api "repos/$GITHUB_REPOSITORY/environments/staging/variables?per_page=30" 2>&1
            echo "--- repo variables ---"
            gh api "repos/$GITHUB_REPOSITORY/actions/variables?per_page=30" 2>&1
            echo "--- recent runs ---"
            gh run list --limit 14 --json name,status,conclusion,createdAt,event,headBranch 2>&1 | jq -r '.[] | "\(.createdAt) \(.name) [\(.event)/\(.headBranch)] \(.status)|\(.conclusion)"' 2>&1
            echo "=== done ==="
          } > /tmp/probe.log 2>&1
          cat /tmp/probe.log
          mkdir -p infra/status
          cp /tmp/probe.log infra/status/infra-probe-log.txt
          git config user.name "gha-bot"
          git config user.email "gha-bot@users.noreply.github.com"
          git add -f infra/status/infra-probe-log.txt
          git commit -m "infra probe log v2"
          git push -f origin HEAD:infra-probe-log
