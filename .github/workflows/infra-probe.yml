name: Infra probe

# Probes staging environment vars + OIDC assumability of vars.AWS_DEPLOY_ROLE_ARN.
# Lives on side branch 'infra-probe' so main HEAD stays frozen for its CI gate.
on:
  push:
    branches: [infra-probe]

permissions:
  contents: write
  id-token: write

concurrency:
  group: infra-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Try OIDC assume with vars role
        id: oidc
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: infra-probe

      - name: Report
        env:
          V_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          V_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          V_REGION: ${{ vars.AWS_REGION }}
          V_CLUSTER: ${{ vars.EKS_CLUSTER }}
          V_NS: ${{ vars.K8S_NAMESPACE }}
          OIDC_OUTCOME: ${{ steps.oidc.outcome }}
        run: |
          set +e
          {
            echo "=== infra-probe $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "vars: account=[$V_ACCOUNT] role=[$V_ROLE] region=[$V_REGION] cluster=[$V_CLUSTER] ns=[$V_NS]"
            echo "oidc_outcome=$OIDC_OUTCOME"
            echo "--- caller identity ---"
            aws sts get-caller-identity 2>&1
            echo "=== done ==="
          } > /tmp/probe.log 2>&1
          cat /tmp/probe.log
          mkdir -p infra/status
          cp /tmp/probe.log infra/status/infra-probe-log.txt
          git config user.name "gha-bot"
          git config user.email "gha-bot@users.noreply.github.com"
          git add -f infra/status/infra-probe-log.txt
          git commit -m "infra probe log"
          git push -f origin HEAD:infra-probe-log
