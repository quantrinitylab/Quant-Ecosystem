name: DB backup tooling test

# Proves infra/oci/backup/backup-db.sh end to end on a GitHub runner before it ever touches the live
# VM: throwaway pgvector database, S3 stand-in, throwaway age key. No secret, no production access.
# Runs on pull requests that touch the tooling, and by hand.

on:
  pull_request:
    paths:
      - 'infra/oci/backup/**'
      - 'infra/oci/ops/**'
      - '.github/workflows/db-backup.yml'
      - '.github/workflows/db-backup-test.yml'
      - '.github/workflows/ops-housekeeping.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Backup, restore test and encryption (local services)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install age
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version

      - name: Shell syntax check
        shell: bash
        run: |
          set -euo pipefail
          for f in infra/oci/backup/backup-db.sh infra/oci/backup/test-e2e.sh \
                   infra/oci/ops/run-remote-report.sh infra/oci/ops/test-run-remote-report.sh \
                   infra/oci/ops/housekeeping-vm-app.sh infra/oci/ops/test-housekeeping.sh \
                   infra/oci/ops/diagnose-vm-app.sh; do
            bash -n "$f"
            echo "ok: $f"
          done

      - name: End-to-end backup test
        shell: bash
        run: bash infra/oci/backup/test-e2e.sh

      - name: Remote-report wrapper test (fake ssh)
        shell: bash
        run: bash infra/oci/ops/test-run-remote-report.sh

      - name: Housekeeping test (fake docker)
        shell: bash
        run: bash infra/oci/ops/test-housekeeping.sh
