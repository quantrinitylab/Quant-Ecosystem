name: Dependency remediation Prisma consumer fix

on:
  push:
    branches:
      - fix/dependency-audit-2026-08
    paths:
      - .github/workflows/dependency-remediation-prisma-fix.yml

permissions:
  contents: write
  checks: write

concurrency:
  group: dependency-remediation-prisma-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Route Prisma consumers through the database package
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from pathlib import Path

          import_paths = [
              'packages/data-plane/src/audit-log.ts',
              'packages/data-plane/src/base-repository.ts',
              'packages/data-plane/src/optimistic-locking.ts',
              'packages/data-plane/src/outbox.ts',
              'packages/data-plane/src/replica-router.ts',
              'packages/data-plane/src/soft-delete.ts',
              'packages/social-graph/src/services/social-graph.service.ts',
              'services/cdc-relay/src/outbox-poller.ts',
          ]

          for raw_path in import_paths:
              path = Path(raw_path)
              text = path.read_text()
              old = "@prisma/client"
              if text.count(old) != 1:
                  raise SystemExit(f'{raw_path}: expected one direct Prisma import')
              path.write_text(text.replace(old, '@quant/database'))

          test_path = Path('services/cdc-relay/__tests__/outbox-poller.test.ts')
          test_text = test_path.read_text()
          old_mock = "vi.mock('@prisma/client'"
          if test_text.count(old_mock) != 1:
              raise SystemExit('cdc-relay test: expected one direct Prisma mock')
          test_path.write_text(test_text.replace(old_mock, "vi.mock('@quant/database'"))

          manifests = [
              Path('packages/data-plane/package.json'),
              Path('packages/social-graph/package.json'),
              Path('services/cdc-relay/package.json'),
          ]
          for path in manifests:
              data = json.loads(path.read_text())
              dependencies = data['dependencies']
              if dependencies.pop('@prisma/client', None) is None:
                  raise SystemExit(f'{path}: missing direct @prisma/client dependency')
              dependencies['@quant/database'] = 'workspace:*'
              dev_dependencies = data.get('devDependencies', {})
              if dev_dependencies.pop('prisma', None) is None:
                  raise SystemExit(f'{path}: missing temporary prisma peer dependency')
              path.write_text(json.dumps(data, indent=2) + '\n')

          references = {
              'packages/data-plane/tsconfig.json': '../database',
              'packages/social-graph/tsconfig.json': '../database',
              'services/cdc-relay/tsconfig.json': '../../packages/database',
          }
          for raw_path, reference in references.items():
              path = Path(raw_path)
              data = json.loads(path.read_text())
              existing = data.setdefault('references', [])
              if not any(item.get('path') == reference for item in existing):
                  existing.append({'path': reference})
              path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Install and generate the lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Test dependency-audit parser
        run: pnpm test:dependency-audit

      - name: Enforce high and critical dependency audit
        run: pnpm audit:dependencies

      - name: Validate candidate changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail

          publish_check() {
            local name="$1"
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name="$name" \
              -f head_sha="$HEAD_SHA" \
              -f status='completed' \
              -f conclusion='neutral' >/dev/null
          }

          validate() {
            local target="$1"
            local dir="$2"
            local task="$3"
            local status

            set +e
            pnpm --dir "$dir" run "$task" > candidate.log 2>&1
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              return 0
            fi

            mapfile -t coordinates < <(
              sed -nE 's#^(.+)\(([0-9]+),([0-9]+)\): error (TS[0-9]+):.*#\1|\2|\4#p' candidate.log \
                | sort -u \
                | head -n 20
            )

            if [ "${#coordinates[@]}" -gt 0 ]; then
              for coordinate in "${coordinates[@]}"; do
                IFS='|' read -r file line code <<< "$coordinate"
                base="$(basename "$file")"
                stem="${base%.*}"
                slug="$(printf '%s' "$stem" | tr -cs '[:alnum:]' '-')"
                publish_check "candidate-$target-$task-${slug}-L${line}-${code}"
              done
            else
              mapfile -t codes < <(grep -oE 'TS[0-9]+' candidate.log | sort -u | head -n 20)
              if [ "${#codes[@]}" -gt 0 ]; then
                for code in "${codes[@]}"; do
                  publish_check "candidate-$target-$task-$code"
                done
              else
                publish_check "candidate-$target-$task-non-ts-error"
              fi
            fi

            return "$status"
          }

          failed=0
          validate database packages/database build || failed=1

          for task in typecheck build test; do
            validate data-plane packages/data-plane "$task" || failed=1
            validate social-graph packages/social-graph "$task" || failed=1
            validate cdc-relay services/cdc-relay "$task" || failed=1
            validate moderation-worker services/moderation-worker "$task" || failed=1
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Verify generated change scope
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git status --porcelain | sed -E 's/^...//' | sort)"
          expected="$(cat <<'EOF' | sort
          packages/data-plane/package.json
          packages/data-plane/src/audit-log.ts
          packages/data-plane/src/base-repository.ts
          packages/data-plane/src/optimistic-locking.ts
          packages/data-plane/src/outbox.ts
          packages/data-plane/src/replica-router.ts
          packages/data-plane/src/soft-delete.ts
          packages/data-plane/tsconfig.json
          packages/social-graph/package.json
          packages/social-graph/src/services/social-graph.service.ts
          packages/social-graph/tsconfig.json
          pnpm-lock.yaml
          services/cdc-relay/__tests__/outbox-poller.test.ts
          services/cdc-relay/package.json
          services/cdc-relay/src/outbox-poller.ts
          services/cdc-relay/tsconfig.json
          EOF
          )"

          if [ "$actual" != "$expected" ]; then
            echo "Generated change scope did not match the allowlist."
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          fi

      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/data-plane \
            packages/social-graph \
            services/cdc-relay \
            pnpm-lock.yaml
          git commit -m "fix: centralize Prisma client consumption"
          git push
