name: Dependency remediation gate probes

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - packages/data-plane/**
      - packages/social-graph/**
      - services/cdc-relay/**
      - .github/workflows/dependency-remediation-gate-probes.yml

permissions:
  contents: read

concurrency:
  group: dependency-remediation-gate-probes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-probe:
    name: gate-probe-${{ matrix.probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - probe: memory-validate
            command: pnpm memory:validate
          - probe: memory-test
            command: pnpm test:memory
          - probe: wu4-plan
            command: pnpm m11d:wu4 -- --plan
          - probe: wu5-release
            command: pnpm m11d:wu5:release-gate
          - probe: wu5-policy
            command: pnpm test:wu5:policy
          - probe: quantai-memory
            command: pnpm --filter @quant/quantai exec vitest run backend/__tests__/memory-facade.service.test.ts
          - probe: heatmap-test
            command: pnpm test:dependency-heatmap
          - probe: heatmap-guard
            command: node scripts/dependency-heatmap.mjs --assert-new-packages-wired --base origin/main
          - probe: turbo-typecheck
            command: npx turbo typecheck --concurrency=2 --continue --filter='[origin/main]'
          - probe: turbo-lint
            command: npx turbo lint --concurrency=2 --continue --filter='[origin/main]'
          - probe: turbo-test
            command: npx turbo test --concurrency=2 --continue --filter='[origin/main]'
          - probe: turbo-build
            command: npx turbo build --concurrency=2 --continue --filter='[origin/main]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @quant/database exec prisma generate --schema=prisma/schema.prisma

      - name: Run isolated gate probe
        env:
          COMMAND: ${{ matrix.command }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: bash -lc "$COMMAND"
