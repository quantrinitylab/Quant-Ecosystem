name: Dependency lock refresh

on:
  push:
    branches:
      - fix/dependency-audit-2026-08
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/dependency-audit-2026-08

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Regenerate lockfile reproducibly
        run: pnpm install --no-frozen-lockfile

      - name: Test dependency-audit parser
        run: pnpm test:dependency-audit

      - name: Verify high and critical advisories are cleared
        run: pnpm audit:dependencies

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already matches package overrides.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(deps): regenerate pnpm lockfile'
          git push origin HEAD:fix/dependency-audit-2026-08
