name: Ops diagnose (read-only vm-app report)

# Read-only health and configuration report for the live Oracle VM (vm-app).
#
# WHY: the owner has no shell on the VM, and several decisions (the mail path,
# queue state, backups, free-tier sizing) depend on facts that are only visible
# there. This workflow SSHes in with the existing deploy key, streams
# infra/oci/ops/diagnose-vm-app.sh, and prints the result to the run log and
# the run summary.
#
# SAFETY
#   * Read-only. The script restarts nothing and writes nothing on the VM; its
#     database session is read-only at the server.
#   * Output is names, counts, dates and yes/no flags. This repository (and so
#     this log) is public, so the report is encrypted before it is printed:
#     scrub-output.mjs masks e-mail addresses, URL credentials and long
#     tokens, then encrypt-report.mjs seals it with the public key in
#     infra/oci/ops/report-public-key.pem. Only the holder of the private key
#     (kept outside the repository and outside GitHub) can read it, with
#     decrypt-report.mjs. If the public key is missing the step fails.
#   * Runs only from main (the same rule as deploy-oci.yml), so a branch cannot
#     swap in a different script and run it with the deploy key.
#   * No new secret. It reuses environment `oci-staging` (OCI_DEPLOY_SSH_KEY,
#     vars.VM_APP_IP, vars.OCI_SSH_USER). NOTE: that environment deploys the
#     LIVE VMs, despite its name.

on:
  workflow_dispatch:
    inputs:
      include_db_counts:
        description: 'Include read-only aggregate SQL counts (users, mail, delivery status). Counts only, never rows.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ops-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose vm-app (read-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: oci-staging
    permissions:
      contents: read
    env:
      VM_APP_IP: ${{ vars.VM_APP_IP }}
      OCI_SSH_USER: ${{ vars.OCI_SSH_USER || 'opc' }}
      WITH_DB: ${{ inputs.include_db_counts }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up SSH to vm-app
        shell: bash
        env:
          OCI_DEPLOY_SSH_KEY: ${{ secrets.OCI_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_APP_IP" || { echo 'vars.VM_APP_IP is empty' >&2; exit 1; }
          [[ "$VM_APP_IP" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'VM_APP_IP looks invalid' >&2; exit 1; }
          [[ "$OCI_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'OCI_SSH_USER looks invalid' >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Same key handling as deploy-oci.yml: normalises the final LF/CRLF and
          # validates the key without ever printing it.
          bash scripts/prepare-oci-deploy-key.sh "$HOME/.ssh/oci-deploy"
          ssh-keyscan -H "$VM_APP_IP" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Run read-only diagnostics on vm-app
        shell: bash
        run: |
          set -euo pipefail
          [ "$WITH_DB" = true ] || WITH_DB=false
          # Fail closed: without the public key there is nothing safe to print.
          test -s infra/oci/ops/report-public-key.pem || { echo 'report-public-key.pem is missing' >&2; exit 1; }
          compose_sha="$(sha256sum compose/quant-stack.yml | cut -d' ' -f1)"
          # tr strips any CR so a CRLF checkout cannot break the remote shell.
          # The report is scrubbed, written to a file, encrypted, and only the
          # encrypted block reaches the (public) log. ssh's own messages go to a
          # separate file and are shown, scrubbed, only when the run fails.
          set +e
          tr -d '\r' < infra/oci/ops/diagnose-vm-app.sh \
            | ssh -i ~/.ssh/oci-deploy -o BatchMode=yes -o LogLevel=ERROR -o ConnectTimeout=15 -o ServerAliveInterval=15 \
                "$OCI_SSH_USER@$VM_APP_IP" \
                "VM_APP_IP='$VM_APP_IP' REPO_COMPOSE_SHA256='$compose_sha' WITH_DB='$WITH_DB' bash -s" 2> ssh-stderr.txt \
            | node infra/oci/ops/scrub-output.mjs > diagnose.txt
          status=("${PIPESTATUS[@]}")
          set -e
          if [ "${status[1]}" -ne 0 ] || [ "${status[2]}" -ne 0 ]; then
            echo "ssh exit ${status[1]}, scrubber exit ${status[2]}" >&2
            node infra/oci/ops/scrub-output.mjs < ssh-stderr.txt >&2 || true
            exit 1
          fi
          node infra/oci/ops/encrypt-report.mjs infra/oci/ops/report-public-key.pem < diagnose.txt > diagnose.enc.txt
          {
            echo "report: $(wc -l < diagnose.txt) lines, $(wc -c < diagnose.txt) bytes"
            echo "encrypted block sha256: $(sha256sum < diagnose.enc.txt | cut -d' ' -f1)"
            echo "decrypt with infra/oci/ops/decrypt-report.mjs and the private ops key"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          cat diagnose.enc.txt
          rm -f diagnose.txt ssh-stderr.txt

      - name: Remove deploy SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/oci-deploy
