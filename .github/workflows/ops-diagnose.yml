name: Ops diagnose (read-only vm-app report)

# Read-only health and configuration report for the live Oracle VM (vm-app).
#
# WHY: the owner has no shell on the VM, and several decisions (the mail path,
# queue state, backups, free-tier sizing) depend on facts that are only visible
# there. This workflow SSHes in with the existing deploy key, streams
# infra/oci/ops/diagnose-vm-app.sh, and prints the result to the run log and
# the run summary.
#
# SAFETY
#   * Read-only. The script restarts nothing and writes nothing on the VM; its
#     database session is read-only at the server.
#   * Output is names, counts, dates and yes/no flags. This repository (and so
#     this log) is public: infra/oci/ops/scrub-output.mjs masks e-mail
#     addresses, credentials in URLs and long token-like strings before
#     anything is printed.
#   * Runs only from main (the same rule as deploy-oci.yml), so a branch cannot
#     swap in a different script and run it with the deploy key.
#   * No new secret. It reuses environment `oci-staging` (OCI_DEPLOY_SSH_KEY,
#     vars.VM_APP_IP, vars.OCI_SSH_USER). NOTE: that environment deploys the
#     LIVE VMs, despite its name.

on:
  workflow_dispatch:
    inputs:
      include_db_counts:
        description: 'Include read-only aggregate SQL counts (users, mail, delivery status). Counts only, never rows.'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ops-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose vm-app (read-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: oci-staging
    permissions:
      contents: read
    env:
      VM_APP_IP: ${{ vars.VM_APP_IP }}
      OCI_SSH_USER: ${{ vars.OCI_SSH_USER || 'opc' }}
      WITH_DB: ${{ inputs.include_db_counts }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up SSH to vm-app
        shell: bash
        env:
          OCI_DEPLOY_SSH_KEY: ${{ secrets.OCI_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_APP_IP" || { echo 'vars.VM_APP_IP is empty' >&2; exit 1; }
          [[ "$VM_APP_IP" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'VM_APP_IP looks invalid' >&2; exit 1; }
          [[ "$OCI_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'OCI_SSH_USER looks invalid' >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Same key handling as deploy-oci.yml: normalises the final LF/CRLF and
          # validates the key without ever printing it.
          bash scripts/prepare-oci-deploy-key.sh "$HOME/.ssh/oci-deploy"
          ssh-keyscan -H "$VM_APP_IP" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Run read-only diagnostics on vm-app
        shell: bash
        run: |
          set -euo pipefail
          [ "$WITH_DB" = true ] || WITH_DB=false
          compose_sha="$(sha256sum compose/quant-stack.yml | cut -d' ' -f1)"
          # tr strips any CR so a CRLF checkout cannot break the remote shell.
          # Everything the VM prints passes through the scrubber before it
          # reaches the log; if the scrubber fails the step fails.
          tr -d '\r' < infra/oci/ops/diagnose-vm-app.sh \
            | ssh -i ~/.ssh/oci-deploy -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 \
                "$OCI_SSH_USER@$VM_APP_IP" \
                "VM_APP_IP='$VM_APP_IP' REPO_COMPOSE_SHA256='$compose_sha' WITH_DB='$WITH_DB' bash -s" 2>&1 \
            | node infra/oci/ops/scrub-output.mjs \
            | tee diagnose.txt

      - name: Publish report to the run summary
        if: always()
        shell: bash
        run: |
          if [ -s diagnose.txt ]; then
            {
              echo '## vm-app diagnose (read-only)'
              echo
              echo '```text'
              cat diagnose.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove deploy SSH key
        if: always()
        shell: bash
        run: rm -f ~/.ssh/oci-deploy
