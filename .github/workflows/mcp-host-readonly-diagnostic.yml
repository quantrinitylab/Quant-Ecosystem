name: MCP host privileged read-only forensic

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/mcp-host-readonly-diagnostic.yml]

permissions:
  contents: read

jobs:
  forensic:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'ops/mcp-host-recovery-')
    runs-on: [self-hosted, Linux, X64, quant-deploy, notion-aws]
    timeout-minutes: 8
    steps:
      - name: Locate prior MCP deployment without reading secrets
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/mcp-host-forensic.txt"
          exec >"$out" 2>&1
          echo '=== HOST ==='; date -Is; hostname; id; df -h; docker version --format '{{.Server.Version}}'
          echo '=== DOCKER_STATE ==='; docker ps -a; docker images -a; docker volume ls; docker network ls
          echo '=== PRIVILEGED_PATH_NAMES ==='
          docker run --rm --pull=always -v /:/host:ro alpine:3.22 sh -c "find /host/opt /host/srv /host/root /host/home /host/tmp /host/etc/systemd/system -xdev -maxdepth 6 \( -iname '*mcp*' -o -iname '*notion*' -o -iname '*gateway*' -o -iname 'compose*.yml' -o -iname 'docker-compose*.yml' \) -printf '%y %p\n' 2>/dev/null | head -1000"
          echo '=== SERVICE_FILE_NAMES ==='
          docker run --rm -v /etc/systemd/system:/host:ro alpine:3.22 sh -c "find /host -maxdepth 3 -type f -printf '%p\n' 2>/dev/null | sort"
          echo '=== RUNNER_WORKSPACES ==='
          find /opt/actions-runner/_work -maxdepth 5 -type d 2>/dev/null | grep -Ei 'mcp|notion|gateway|Quant-Ecosystem' | head -500
          echo '=== SAFE_UNIT_METADATA ==='
          docker run --rm -v /etc/systemd/system:/host:ro alpine:3.22 sh -c "grep -RIlE 'mcp|notion|gateway|6274|/mcp' /host 2>/dev/null | head -100"
          exit 0
      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-host-forensic
          path: ${{ runner.temp }}/mcp-host-forensic.txt
          retention-days: 1
