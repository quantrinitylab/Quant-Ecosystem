name: MCP post-deploy lifecycle diagnostic

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/mcp-host-readonly-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'ops/mcp-host-recovery-')
    runs-on: [self-hosted, Linux, X64, quant-deploy, notion-aws]
    timeout-minutes: 5
    steps:
      - name: Capture safe lifecycle state
        shell: bash
        run: |
          set -eu
          deploy=/opt/quant/aws-notion-gateway
          out="$RUNNER_TEMP/mcp-post-deploy-lifecycle.txt"
          {
            echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if test -s "$deploy/.env"; then echo 'TEMP_ENV=present'; else echo 'TEMP_ENV=absent'; fi
            if test -r "$deploy/deadline-epoch"; then
              deadline="$(cat "$deploy/deadline-epoch")"
              case "$deadline" in *[!0-9]*|'') echo 'DEADLINE=invalid';; *) echo "DEADLINE_EPOCH=$deadline"; echo "SECONDS_REMAINING=$((deadline-$(date +%s)))";; esac
            else echo 'DEADLINE=absent'; fi
            echo '=== CONTAINERS ==='
            docker ps -a --filter 'name=aws-notion-gateway-' --format 'NAME={{.Names}} STATUS={{.Status}} IMAGE={{.Image}}'
            echo '=== SAFE_INSPECT ==='
            for name in aws-notion-gateway-mcp aws-notion-gateway-caddy aws-notion-gateway-watchdog; do
              if docker inspect "$name" >/dev/null 2>&1; then
                docker inspect --format 'NAME={{.Name}} STATE={{.State.Status}} EXIT={{.State.ExitCode}} ERROR={{json .State.Error}} STARTED={{.State.StartedAt}} FINISHED={{.State.FinishedAt}} RESTARTS={{.RestartCount}} POLICY={{.HostConfig.RestartPolicy.Name}}' "$name"
              else echo "NAME=/$name STATE=absent"; fi
            done
            echo '=== WATCHDOG_LOG ==='
            docker logs --tail=30 aws-notion-gateway-watchdog 2>&1 || true
            echo '=== HOST_SYSTEMD_PROBE ==='
            docker run --rm --privileged -v /:/host:ro alpine:3.22 chroot /host /usr/bin/systemctl is-system-running 2>&1 || true
            docker run --rm --privileged -v /:/host:ro alpine:3.22 chroot /host /usr/bin/systemctl show docker.service --property=ActiveState,SubState,FragmentPath 2>&1 || true
            echo '=== LISTENERS ==='
            docker run --rm --network host alpine:3.22 sh -c "wget -qSO- --timeout=3 --header='Host: mcp.quantrinity.in' http://127.0.0.1:8000/mcp 2>&1 | head -n 8" || true
          } | tee "$out"
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-post-deploy-lifecycle
          path: ${{ runner.temp }}/mcp-post-deploy-lifecycle.txt
          retention-days: 1
