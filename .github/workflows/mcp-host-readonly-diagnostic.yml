name: MCP temporary bounded recovery

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/mcp-host-readonly-diagnostic.yml]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'ops/mcp-host-recovery-')
    runs-on: [self-hosted, Linux, X64, quant-deploy, notion-aws]
    timeout-minutes: 40
    env:
      TEMP_AWS_ACCESS_KEY_ID: ${{ secrets.KIRO_TEMP_MCP_AWS_ACCESS_KEY_ID }}
      TEMP_AWS_SECRET_ACCESS_KEY: ${{ secrets.KIRO_TEMP_MCP_AWS_SECRET_ACCESS_KEY }}
      TEMP_AWS_SESSION_TOKEN: ${{ secrets.KIRO_TEMP_MCP_AWS_SESSION_TOKEN }}
    steps:
      - name: Deploy pinned MCP with bounded temporary credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          deploy=/opt/quant/aws-notion-gateway
          source_sha=ebcafaed027f56a2fc3faaa9ee6e95476b62adae
          image=aws-notion-gateway-mcp:1.5.1-ebcafaed
          for name in TEMP_AWS_ACCESS_KEY_ID TEMP_AWS_SECRET_ACCESS_KEY TEMP_AWS_SESSION_TOKEN; do
            test -n "${!name:-}" || { echo "required temporary credential is absent"; exit 1; }
          done
          sudo -n true
          cleanup_failure() {
            set +e
            sudo systemctl disable --now quant-mcp-expiry.timer >/dev/null 2>&1
            docker update --restart=no aws-notion-gateway-watchdog aws-notion-gateway-caddy aws-notion-gateway-mcp >/dev/null 2>&1
            docker stop aws-notion-gateway-watchdog aws-notion-gateway-caddy aws-notion-gateway-mcp >/dev/null 2>&1
            sudo rm -f "$deploy/.env"
          }
          trap cleanup_failure ERR
          account="$(AWS_ACCESS_KEY_ID="$TEMP_AWS_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$TEMP_AWS_SECRET_ACCESS_KEY" AWS_SESSION_TOKEN="$TEMP_AWS_SESSION_TOKEN" AWS_EC2_METADATA_DISABLED=true aws sts get-caller-identity --query Account --output text)"
          test "$account" = 266176113726
          src="$(mktemp -d)"
          trap 'rm -rf "$src"' EXIT
          git -C "$src" init -q
          git -C "$src" remote add origin https://github.com/awslabs/mcp.git
          git -C "$src" fetch -q --depth=1 origin "$source_sha"
          git -C "$src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$source_sha"
          docker build --pull -t "$image" "$src/src/aws-api-mcp-server"
          sudo install -d -m 700 "$deploy"
          sudo rm -rf "$deploy/source"
          sudo cp -a "$src/src/aws-api-mcp-server" "$deploy/source"
          sudo chown -R root:root "$deploy/source"
          sudo chmod -R go-w "$deploy/source"
          printf 'AWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\nAWS_SESSION_TOKEN=%s\n' \
            "$TEMP_AWS_ACCESS_KEY_ID" "$TEMP_AWS_SECRET_ACCESS_KEY" "$TEMP_AWS_SESSION_TOKEN" | sudo tee "$deploy/.env" >/dev/null
          sudo chmod 600 "$deploy/.env"
          deadline_epoch="$(date -u -d '+100 minutes' +%s)"
          deadline_calendar="$(date -u -d "@$deadline_epoch" '+%Y-%m-%d %H:%M:%S UTC')"
          printf '%s\n' "$deadline_epoch" | sudo tee "$deploy/deadline-epoch" >/dev/null
          sudo chmod 644 "$deploy/deadline-epoch"
          sudo tee "$deploy/Caddyfile" >/dev/null <<'CADDY'
          {
            admin off
          }
          mcp.quantrinity.in {
            reverse_proxy aws-notion-gateway-mcp:8000 {
              header_up Host mcp.quantrinity.in
            }
          }
          CADDY
          sudo tee "$deploy/compose.yaml" >/dev/null <<'COMPOSE'
          name: aws-notion-gateway
          services:
            mcp:
              image: aws-notion-gateway-mcp:1.5.1-ebcafaed
              container_name: aws-notion-gateway-mcp
              restart: unless-stopped
              env_file: [.env]
              environment:
                AWS_REGION: us-east-1
                AWS_DEFAULT_REGION: us-east-1
                AWS_EC2_METADATA_DISABLED: "true"
                AWS_API_MCP_TRANSPORT: streamable-http
                AWS_API_MCP_HOST: 0.0.0.0
                AWS_API_MCP_PORT: "8000"
                AWS_API_MCP_ALLOWED_HOSTS: mcp.quantrinity.in
                AWS_API_MCP_ALLOWED_ORIGINS: "*"
                AWS_API_MCP_STATELESS_HTTP: "false"
                AWS_API_MCP_ALLOW_UNRESTRICTED_LOCAL_FILE_ACCESS: no-access
                AWS_API_MCP_WORKING_DIR: /work
                AWS_API_MCP_TELEMETRY: "false"
                READ_OPERATIONS_ONLY: "false"
                REQUIRE_MUTATION_CONSENT: "false"
                EXPERIMENTAL_AGENT_SCRIPTS: "false"
                AUTH_TYPE: no-auth
              ports: ["127.0.0.1:8000:8000"]
              read_only: true
              tmpfs:
                - /tmp:rw,noexec,nosuid,size=64m
                - /app/.aws:rw,noexec,nosuid,size=32m
                - /work:rw,noexec,nosuid,size=32m
              cap_drop: [ALL]
              security_opt: [no-new-privileges:true]
              pids_limit: 256
              mem_limit: 1g
            caddy:
              image: caddy:2.10.2-alpine
              container_name: aws-notion-gateway-caddy
              restart: unless-stopped
              depends_on:
                mcp:
                  condition: service_healthy
              ports: ["80:80", "443:443"]
              volumes:
                - ./Caddyfile:/etc/caddy/Caddyfile:ro
                - caddy_data:/data
                - caddy_config:/config
              cap_drop: [ALL]
              cap_add: [NET_BIND_SERVICE]
              security_opt: [no-new-privileges:true]
              mem_limit: 256m
            watchdog:
              image: docker:27.5.1-cli
              container_name: aws-notion-gateway-watchdog
              restart: unless-stopped
              depends_on: [caddy]
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock
                - .:/deployment
              command: >-
                sh -c 'deadline=$$(cat /deployment/deadline-epoch); now=$$(date +%s);
                wait=$$((deadline-now)); if [ $$wait -gt 0 ]; then sleep $$wait; fi;
                docker update --restart=no aws-notion-gateway-caddy aws-notion-gateway-mcp "$${HOSTNAME}" >/dev/null 2>&1 || true;
                docker stop aws-notion-gateway-caddy aws-notion-gateway-mcp >/dev/null 2>&1 || true;
                rm -f /deployment/.env'
          volumes:
            caddy_data:
              name: aws-notion-gateway_caddy_data
            caddy_config:
              name: aws-notion-gateway_caddy_config
          COMPOSE
          sudo tee /usr/local/sbin/quant-mcp-expire >/dev/null <<'EXPIRE'
          #!/bin/sh
          set +e
          docker update --restart=no aws-notion-gateway-watchdog aws-notion-gateway-caddy aws-notion-gateway-mcp >/dev/null 2>&1
          docker stop aws-notion-gateway-watchdog aws-notion-gateway-caddy aws-notion-gateway-mcp >/dev/null 2>&1
          rm -f /opt/quant/aws-notion-gateway/.env
          EXPIRE
          sudo chmod 700 /usr/local/sbin/quant-mcp-expire
          sudo tee /etc/systemd/system/quant-mcp-expiry.service >/dev/null <<'SERVICE'
          [Unit]
          Description=Expire temporary Quant AWS MCP access
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/quant-mcp-expire
          SERVICE
          sudo tee /etc/systemd/system/quant-mcp-expiry.timer >/dev/null <<TIMER
          [Unit]
          Description=Absolute expiry for temporary Quant AWS MCP access
          [Timer]
          OnCalendar=$deadline_calendar
          Persistent=true
          AccuracySec=10s
          Unit=quant-mcp-expiry.service
          [Install]
          WantedBy=timers.target
          TIMER
          sudo systemctl daemon-reload
          sudo systemctl enable quant-mcp-expiry.timer
          sudo systemctl restart quant-mcp-expiry.timer
          sudo systemctl is-active --quiet quant-mcp-expiry.timer
          docker compose -f "$deploy/compose.yaml" --project-directory "$deploy" up -d --force-recreate
          for attempt in $(seq 1 60); do
            state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' aws-notion-gateway-mcp 2>/dev/null || true)"
            test "$state" = healthy && break
            test "$state" != exited && test "$state" != dead
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' aws-notion-gateway-mcp)" = healthy
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8000/mcp \
            -H 'Host: mcp.quantrinity.in' -H 'Accept: application/json, text/event-stream' \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"kiro-local-smoke","version":"1.0"}}}' >/dev/null
          export MCP_TEST_ENDPOINT=https://mcp.quantrinity.in/mcp
          export MCP_TEST_ACCOUNT=266176113726
          python3 - <<'PY'
          import json, os, time, urllib.request, uuid

          endpoint = os.environ['MCP_TEST_ENDPOINT']
          account = os.environ['MCP_TEST_ACCOUNT']
          session = None
          protocol = '2025-06-18'

          def decode(raw):
              text = raw.decode('utf-8')
              events = [line[5:].strip() for line in text.splitlines() if line.startswith('data:')]
              return json.loads(events[-1] if events else text) if text.strip() else {}

          def post(payload, retries=1):
              global session, protocol
              data = json.dumps(payload, separators=(',', ':')).encode()
              headers = {'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream'}
              if session:
                  headers['Mcp-Session-Id'] = session
                  headers['MCP-Protocol-Version'] = protocol
              error = None
              for _ in range(retries):
                  try:
                      req = urllib.request.Request(endpoint, data=data, headers=headers, method='POST')
                      with urllib.request.urlopen(req, timeout=30) as response:
                          session = response.headers.get('Mcp-Session-Id', session)
                          return decode(response.read())
                  except Exception as exc:
                      error = exc
                      time.sleep(3)
              raise error

          init = post({'jsonrpc':'2.0','id':1,'method':'initialize','params':{
              'protocolVersion': protocol, 'capabilities': {},
              'clientInfo': {'name':'kiro-external-proof','version':'1.0'}}}, retries=40)
          assert 'result' in init and session, init
          protocol = init['result'].get('protocolVersion', protocol)
          post({'jsonrpc':'2.0','method':'notifications/initialized'})
          tools = post({'jsonrpc':'2.0','id':2,'method':'tools/list','params':{}})
          names = {tool['name'] for tool in tools['result']['tools']}
          assert {'call_aws', 'suggest_aws_commands'} <= names, names

          next_id = 3
          def call(command):
              global next_id
              response = post({'jsonrpc':'2.0','id':next_id,'method':'tools/call','params':{
                  'name':'call_aws','arguments':{'cli_command':command}}})
              next_id += 1
              assert 'result' in response and not response['result'].get('isError', False), response
              result = response['result']
              text = '\n'.join(item.get('text', '') for item in result.get('content', []))
              if result.get('structuredContent'):
                  text += '\n' + json.dumps(result['structuredContent'], sort_keys=True)
              return text

          identity = call('aws sts get-caller-identity')
          assert account in identity, identity
          parameter = '/quant/mcp-recovery/kiro-' + uuid.uuid4().hex
          marker = 'temporary-reversible-test'
          created = False
          try:
              put = call(f'aws ssm put-parameter --region us-east-1 --name {parameter} --type String --value {marker} --tags Key=Purpose,Value=kiro-mcp-recovery --overwrite')
              assert 'Version' in put and 'error": null' in put, put
              created = True
              got = call(f'aws ssm get-parameter --region us-east-1 --name {parameter}')
              assert marker in got and 'error": null' in got, got
              deleted = call(f'aws ssm delete-parameter --region us-east-1 --name {parameter}')
              assert 'error": null' in deleted, deleted
              created = False
              absent = call(f'aws ssm get-parameter --region us-east-1 --name {parameter}')
              assert 'ParameterNotFound' in absent, absent
          finally:
              if created:
                  try: call(f'aws ssm delete-parameter --region us-east-1 --name {parameter}')
                  except Exception: pass
          print('MCP_EXTERNAL_INITIALIZE=passed')
          print('MCP_TOOLS_LIST=passed')
          print('MCP_AWS_READ=passed')
          print('MCP_REVERSIBLE_WRITE_READ_DELETE=passed')
          PY
          test "$(docker inspect --format '{{.State.Status}}' aws-notion-gateway-caddy)" = running
          test "$(docker inspect --format '{{.State.Status}}' aws-notion-gateway-watchdog)" = running
          evidence="$RUNNER_TEMP/mcp-temporary-recovery-evidence.txt"
          {
            echo "SOURCE_SHA=$source_sha"
            echo "PACKAGE_VERSION=1.5.1"
            echo "AWS_ACCOUNT=$account"
            echo "PUBLIC_ENDPOINT=https://mcp.quantrinity.in/mcp"
            echo "AUTH_MODE=temporary-no-auth"
            echo "READ_OPERATIONS_ONLY=false"
            echo "LOCAL_INITIALIZE=passed"
            echo "EXTERNAL_INITIALIZE=passed"
            echo "TOOLS_LIST=passed"
            echo "AWS_READ=passed"
            echo "REVERSIBLE_SSM_WRITE_READ_DELETE=passed"
            echo "AUTO_EXPIRY_UTC=$deadline_calendar"
            docker ps --filter 'name=aws-notion-gateway-' --format 'CONTAINER={{.Names}} STATUS={{.Status}} IMAGE={{.Image}}'
          } | tee "$evidence"
          trap - ERR
      - name: Upload sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-temporary-recovery-evidence
          path: ${{ runner.temp }}/mcp-temporary-recovery-evidence.txt
          if-no-files-found: warn
          retention-days: 1
