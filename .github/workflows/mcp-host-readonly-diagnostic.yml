name: MCP prior auth-mode forensic

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/mcp-host-readonly-diagnostic.yml]

permissions:
  contents: read

jobs:
  forensic:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'ops/mcp-host-recovery-')
    runs-on: [self-hosted, Linux, X64, quant-deploy, notion-aws]
    timeout-minutes: 5
    steps:
      - name: Detect prior auth mode without outputting history
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/mcp-auth-mode.txt"
          for term in 'AUTH_TYPE=no-auth' 'AUTH_TYPE=oauth' 'basic_auth' 'basicauth' 'Authorization' 'Bearer' 'header_up' 'forward_auth' 'oauth' 'Caddyfile' 'aws-notion-gateway'; do
            key="$(printf '%s' "$term" | tr '[:lower:]-=' '[:upper:]__' | tr -cd 'A-Z0-9_')"
            if docker run --rm -v /:/host:ro alpine:3.22 sh -c "grep -qiF '$term' /host/root/.bash_history /host/home/*/.bash_history 2>/dev/null"; then echo "$key=present"; else echo "$key=absent"; fi
          done >"$out"
          exit 0
      - name: Upload auth-mode evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-auth-mode
          path: ${{ runner.temp }}/mcp-auth-mode.txt
          retention-days: 1
