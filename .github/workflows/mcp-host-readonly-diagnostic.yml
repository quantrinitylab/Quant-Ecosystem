name: Quant staging read-only workload inventory

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/mcp-host-readonly-diagnostic.yml]

permissions:
  contents: read

jobs:
  inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'ops/mcp-host-recovery-')
    runs-on: [self-hosted, Linux, X64, quant-deploy, notion-aws]
    timeout-minutes: 5
    steps:
      - name: Capture cluster workload placement without secrets
        shell: bash
        run: |
          set +e
          exec >"$RUNNER_TEMP/quant-staging-inventory.txt" 2>&1
          echo '=== IDENTITY ==='; aws sts get-caller-identity
          aws eks update-kubeconfig --region us-east-1 --name quant-staging-eks --kubeconfig "$RUNNER_TEMP/kubeconfig"
          echo '=== NODES ==='; kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" get nodes -o wide
          echo '=== NODE_USAGE ==='; kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" top nodes || true
          echo '=== WORKLOADS ==='; kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" get deployments,statefulsets,daemonsets -A -o wide
          echo '=== POD_PLACEMENT ==='; kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" get pods -A -o wide
          echo '=== SERVICES_AND_INGRESS ==='; kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" get services,ingresses -A -o wide
          echo '=== POD_USAGE ==='; kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" top pods -A || true
          exit 0
      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quant-staging-inventory
          path: ${{ runner.temp }}/quant-staging-inventory.txt
          retention-days: 1
