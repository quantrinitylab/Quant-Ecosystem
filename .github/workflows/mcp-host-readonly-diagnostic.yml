name: MCP host read-only diagnostic

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/mcp-host-readonly-diagnostic.yml]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'ops/mcp-host-recovery-')
    runs-on: [self-hosted, Linux, X64, quant-deploy, notion-aws]
    timeout-minutes: 5
    steps:
      - name: Capture MCP host runtime state without secrets
        shell: bash
        run: |
          set +e
          exec >"$RUNNER_TEMP/mcp-host-diagnostic.txt" 2>&1
          echo '=== HOST ==='; date -Is; hostname; id; uptime; df -h /; free -h
          echo '=== FAILED_UNITS ==='; systemctl --failed --no-pager || true
          echo '=== CANDIDATE_UNITS ==='
          systemctl list-unit-files --no-pager --no-legend | grep -Ei 'mcp|notion|nginx|caddy|node|docker|pm2' || true
          systemctl list-units --type=service --state=running --no-pager --no-legend | grep -Ei 'mcp|notion|nginx|caddy|node|docker|pm2' || true
          echo '=== LISTENERS ==='; ss -lnt || true
          echo '=== PROCESSES ==='; ps -eo user,pid,ppid,comm | grep -Ei 'mcp|notion|inspector|nginx|caddy|node|docker|pm2' || true
          echo '=== DOCKER_ALL ==='; docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' || true
          echo '=== DOCKER_SAFE_INSPECT ==='
          for id in $(docker ps -aq 2>/dev/null); do docker inspect --format 'NAME={{.Name}} IMAGE={{.Config.Image}} STATUS={{.State.Status}} EXIT={{.State.ExitCode}} STARTED={{.State.StartedAt}} FINISHED={{.State.FinishedAt}} RESTART={{.HostConfig.RestartPolicy.Name}} PORTS={{json .HostConfig.PortBindings}}' "$id"; done
          echo '=== CANDIDATE_CONTAINER_LOGS ==='
          for id in $(docker ps -aq 2>/dev/null); do name="$(docker inspect --format '{{.Name}}' "$id" | tr '[:upper:]' '[:lower:]')"; case "$name" in *mcp*|*notion*|*gateway*) echo "--- $name ---"; docker logs --tail 100 "$id" 2>&1;; esac; done
          echo '=== COMPOSE ==='; docker compose ls || true
          echo '=== CANDIDATE_FILES ==='
          find /etc/systemd/system /opt /srv "$HOME" -maxdepth 3 -type f 2>/dev/null | grep -Ei 'mcp|notion|gateway|compose' || true
          exit 0
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-host-diagnostic
          path: ${{ runner.temp }}/mcp-host-diagnostic.txt
          retention-days: 1
