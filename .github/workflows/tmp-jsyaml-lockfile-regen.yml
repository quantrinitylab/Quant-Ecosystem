# TEMPORARY: regenerates pnpm-lock.yaml after the js-yaml override bump
# (GHSA-5p4m-2wfm-xmqj, published 2026-08-06). Verifies the dependency audit
# is clean BEFORE committing (fail-safe: a dirty lockfile never lands).
# Delete this file after the lockfile commit lands — same pattern as the
# earlier temporary generator/diagnostics workflows on this branch.
name: TEMP js-yaml lockfile regen

on:
  push:
    branches: [fix/dependency-audit-2026-08]

permissions:
  contents: write

concurrency:
  group: tmp-jsyaml-regen
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Regenerate lockfile with updated js-yaml overrides
        run: pnpm install --lockfile-only

      - name: Verify dependency audit is clean at moderate threshold
        run: node scripts/dependency-audit.mjs --level moderate

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "::error::pnpm install --lockfile-only produced no lockfile changes"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "security(deps): resolve js-yaml to 4.3.1 via scoped override (GHSA-5p4m-2wfm-xmqj) [runner-generated lockfile]"
          git push origin HEAD:fix/dependency-audit-2026-08
