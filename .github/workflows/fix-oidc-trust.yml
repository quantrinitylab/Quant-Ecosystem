name: Fix OIDC trust

# Surgical fix: bootstrap-aws.yml wrote the trust policy with org 'quantrinitylabsgo'
# (typo) so GitHub OIDC deploys fail with 'Not authorized to perform
# sts:AssumeRoleWithWebIdentity'. This updates ONLY the role trust policy.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-oidc-trust.yml'

permissions:
  contents: write

concurrency:
  group: fix-oidc-trust
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (bootstrap static keys)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          aws-access-key-id: ${{ secrets.BOOTSTRAP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BOOTSTRAP_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update quant-gha-deploy trust policy and report
        run: |
          set +e
          cat > /tmp/trust.json <<'JSONEOF'
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": {
                "Federated": "arn:aws:iam::266176113726:oidc-provider/token.actions.githubusercontent.com"
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
                },
                "StringLike": {
                  "token.actions.githubusercontent.com:sub": [
                    "repo:quantrinitylab/Quant-Ecosystem:environment:staging",
                    "repo:quantrinitylab/Quant-Ecosystem:environment:production",
                    "repo:quantrinitylab/Quant-Ecosystem:ref:refs/heads/main"
                  ]
                }
              }
            }]
          }
JSONEOF
          {
            echo "=== fix-oidc-trust $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "--- caller identity ---"
            aws sts get-caller-identity 2>&1
            echo "--- update trust ---"
            aws iam update-assume-role-policy --role-name quant-gha-deploy --policy-document file:///tmp/trust.json 2>&1 && echo "TRUST_UPDATED_OK"
            echo "--- verify (current trust doc) ---"
            aws iam get-role --role-name quant-gha-deploy --query Role.AssumeRolePolicyDocument --output json 2>&1
            echo "--- oidc providers ---"
            aws iam list-open-id-connect-providers --output json 2>&1
            echo "=== done ==="
          } > /tmp/fix.log 2>&1
          cat /tmp/fix.log
          mkdir -p infra/status
          cp /tmp/fix.log infra/status/oidc-fix-log.txt
          git config user.name "gha-bot"
          git config user.email "gha-bot@users.noreply.github.com"
          git add -f infra/status/oidc-fix-log.txt
          git commit -m "oidc fix log"
          git push -f origin HEAD:oidc-fix-log
