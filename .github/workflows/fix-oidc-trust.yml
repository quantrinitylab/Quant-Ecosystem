name: Fix OIDC trust

# v4: run inside 'staging' environment so environment-scoped secrets resolve.
# Tries BOOTSTRAP_AWS_* first, then AWS_* as fallback static creds.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-oidc-trust.yml'

permissions:
  contents: write

concurrency:
  group: fix-oidc-trust
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update quant-gha-deploy trust policy and report
        env:
          BK: ${{ secrets.BOOTSTRAP_AWS_ACCESS_KEY_ID }}
          BS: ${{ secrets.BOOTSTRAP_AWS_SECRET_ACCESS_KEY }}
          AK: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AS: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set +e
          cat > /tmp/trust.json <<'JSONEOF'
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": {
                "Federated": "arn:aws:iam::266176113726:oidc-provider/token.actions.githubusercontent.com"
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
                },
                "StringLike": {
                  "token.actions.githubusercontent.com:sub": [
                    "repo:quantrinitylab/Quant-Ecosystem:environment:staging",
                    "repo:quantrinitylab/Quant-Ecosystem:environment:production",
                    "repo:quantrinitylab/Quant-Ecosystem:ref:refs/heads/main"
                  ]
                }
              }
            }]
          }
          JSONEOF
          {
            echo "=== fix-oidc-trust-v4 $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "bootstrap_key_len=${#BK} bootstrap_secret_len=${#BS} aws_key_len=${#AK} aws_secret_len=${#AS}"
            if [ -n "$BK" ] && [ -n "$BS" ]; then
              export AWS_ACCESS_KEY_ID="$BK" AWS_SECRET_ACCESS_KEY="$BS"
              echo "using=BOOTSTRAP_AWS_*"
            elif [ -n "$AK" ] && [ -n "$AS" ]; then
              export AWS_ACCESS_KEY_ID="$AK" AWS_SECRET_ACCESS_KEY="$AS"
              echo "using=AWS_*"
            else
              echo "using=NONE (no static creds available)"
            fi
            echo "--- caller identity ---"
            aws sts get-caller-identity 2>&1
            echo "--- update trust ---"
            aws iam update-assume-role-policy --role-name quant-gha-deploy --policy-document file:///tmp/trust.json 2>&1 && echo "TRUST_UPDATED_OK"
            echo "--- verify (current trust doc) ---"
            aws iam get-role --role-name quant-gha-deploy --query Role.AssumeRolePolicyDocument --output json 2>&1
            echo "=== done ==="
          } > /tmp/fix.log 2>&1
          cat /tmp/fix.log
          mkdir -p infra/status
          cp /tmp/fix.log infra/status/oidc-fix-log.txt
          git config user.name "gha-bot"
          git config user.email "gha-bot@users.noreply.github.com"
          git add -f infra/status/oidc-fix-log.txt
          git commit -m "oidc fix log v4"
          git push -f origin HEAD:oidc-fix-log
