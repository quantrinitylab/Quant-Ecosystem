name: fix-api-ingress

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-api-ingress.yml"

permissions:
  id-token: write
  contents: write

jobs:
  fix-api:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::121701583740:role/quant-gha-deploy
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name quant-staging-eks --region us-east-1

      - name: Verify register end-to-end (always publishes)
        run: |
          set +e
          {
            echo "=== fix-api v6 verify $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "--- frontend env ---"
            kubectl -n quant-staging get deploy quant-quantmail -o jsonpath='{.spec.template.spec.containers[0].env}'
            echo ""
            printf '%s' '{"email":"probe3@quantmail.in","username":"probe3","displayName":"Probe Three","password":"Probe_Test_12345A","acceptTerms":true}' > /tmp/reg.json
            printf '%s' '{"email":"probe3@quantmail.in","password":"Probe_Test_12345A"}' > /tmp/login.json
            echo "home=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 https://quantmail.quantrinity.in/)"
            REGCODE=$(curl -sS -o /tmp/r1 -w '%{http_code}' --max-time 30 -X POST -H 'Content-Type: application/json' -H 'Origin: https://quantmail.quantrinity.in' -d @/tmp/reg.json https://quantmail.quantrinity.in/auth/register)
            echo "auth_register_code=$REGCODE"
            echo "auth_register_body=$(head -c 600 /tmp/r1)"
            LOGINCODE=$(curl -sS -o /tmp/r2 -w '%{http_code}' --max-time 30 -X POST -H 'Content-Type: application/json' -H 'Origin: https://quantmail.quantrinity.in' -d @/tmp/login.json https://quantmail.quantrinity.in/auth/login)
            echo "auth_login_code=$LOGINCODE"
            echo "auth_login_body=$(head -c 600 /tmp/r2)"
            echo "api_healthz=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 https://quantmail.quantrinity.in/api/healthz)"
            echo "--- backend logs tail ---"
            kubectl -n quant-staging logs deploy/quant-quantmail-backend --tail=12 2>&1 | tail -12
            echo "=== done ==="
          } > /tmp/out.txt 2>&1
          cat /tmp/out.txt
          mkdir -p infra/status
          cp /tmp/out.txt infra/status/api-fix5-result.txt
          git config user.name "gha-bot"
          git config user.email "gha-bot@users.noreply.github.com"
          git add -f infra/status/api-fix5-result.txt
          git commit -m "api fix v6 result"
          git push -f origin HEAD:status-report
