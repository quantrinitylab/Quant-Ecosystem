name: fix-api-ingress

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-api-ingress.yml"

permissions:
  id-token: write
  contents: write

jobs:
  fix-api:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::121701583740:role/quant-gha-deploy
          aws-region: us-east-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name quant-staging-eks --region us-east-1

      - name: Fix and verify (always publishes)
        run: |
          set +e
          {
            echo "=== fix-api-ingress v2 $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "--- ingresses before ---"
            kubectl -n quant-staging get ingress
            echo "--- quant-staging-main rules ---"
            kubectl -n quant-staging get ingress quant-staging-main -o jsonpath='{.spec.rules}'
            echo ""
            echo "--- apply staging-api-ingress ---"
            kubectl apply -f infra/k8s/staging-api-ingress.yaml
            echo "apply_rc=$?"
            sleep 12
            echo "--- ingresses after ---"
            kubectl -n quant-staging get ingress
            echo "--- curl /api/healthz quantmail ---"
            curl -sS -o /tmp/h1 -w "code=%{http_code}\n" --max-time 25 https://quantmail.quantrinity.in/api/healthz
            head -c 300 /tmp/h1; echo ""
            echo "--- curl /api/healthz staging ---"
            curl -sS -o /tmp/h2 -w "code=%{http_code}\n" --max-time 25 https://staging.quantrinity.in/api/healthz
            head -c 300 /tmp/h2; echo ""
            echo "--- POST /api/auth/register dummy ---"
            curl -sS -o /tmp/r1 -w "code=%{http_code}\n" --max-time 25 -X POST -H 'Content-Type: application/json' -d '{"email":"probe@quantmail.in","password":"Probe_Test_12345"}' https://quantmail.quantrinity.in/api/auth/register
            head -c 400 /tmp/r1; echo ""
            echo "--- GET /api/ ---"
            curl -sS -o /tmp/a1 -w "code=%{http_code}\n" --max-time 25 https://quantmail.quantrinity.in/api/
            head -c 200 /tmp/a1; echo ""
            echo "=== done ==="
          } > /tmp/out.txt 2>&1
          cat /tmp/out.txt
          mkdir -p infra/status
          cp /tmp/out.txt infra/status/api-ingress-result.txt
          git config user.name "gha-bot"
          git config user.email "gha-bot@users.noreply.github.com"
          git add -f infra/status/api-ingress-result.txt
          git commit -m "api ingress fix result v2"
          git push -f origin HEAD:status-report
