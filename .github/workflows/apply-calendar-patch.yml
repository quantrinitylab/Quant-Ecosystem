name: Apply Calendar Patch

on:
  push:
    branches: [main]
    paths:
      - 'infra/patches/calendar-edit.py'
      - '.github/workflows/apply-calendar-patch.yml'

permissions:
  contents: write

concurrency:
  group: apply-calendar-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Apply patch, push, and publish log
        run: |
          set +e
          log=/tmp/patchlog.txt
          echo "=== calendar-patch run $(date -u +%Y-%m-%dT%H:%M:%SZ) trigger_sha=$GITHUB_SHA ===" > "$log"
          python3 infra/patches/calendar-edit.py apps/quantmail/src/app/calendar/page.tsx >> "$log" 2>&1
          echo "patch_rc=$?" >> "$log"
          wc -c apps/quantmail/src/app/calendar/page.tsx >> "$log"
          git config user.name "quant-bot"
          git config user.email "bot@quantrinity.in"
          if git diff --quiet -- apps/quantmail/src/app/calendar/page.tsx; then
            echo "result=NO_CHANGES" >> "$log"
          else
            git add apps/quantmail/src/app/calendar/page.tsx
            git commit -m "fix(calendar): edit events via useUpdateEvent, remove fake meet-link generator, prefill ?attendee= from contacts" >> "$log" 2>&1
            git push -f origin HEAD:calendar-patched >> "$log" 2>&1
            echo "branch_push_rc=$?" >> "$log"
            ok=0
            for i in 1 2 3; do
              git push origin HEAD:main >> "$log" 2>&1 && { ok=1; break; }
              echo "main push attempt $i failed" >> "$log"
              git pull --rebase origin main >> "$log" 2>&1
            done
            echo "main_push_ok=$ok" >> "$log"
          fi
          cat "$log"
          mkdir -p infra/status
          cp "$log" infra/status/calendar-patch-log.txt
          git add -f infra/status/calendar-patch-log.txt
          git commit -m "calendar patch log" > /dev/null 2>&1
          git push -f origin HEAD:patch-log
