name: Apply shortcut truthfulness patch

on:
  push:
    branches:
      - design/quantmail-settings-shortcut-truthfulness

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: design/quantmail-settings-shortcut-truthfulness
      - name: Apply exact source correction
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('apps/quantmail/src/app/settings/page.tsx')
          source = path.read_text()
          replacement = """const SHORTCUTS = [
            ['Ctrl/Cmd + K', 'Open command palette (global)'],
            ['Ctrl/Cmd + Enter', 'Send email (compose only)'],
            ['Ctrl/Cmd + S', 'Save draft (compose only)'],
          ] as const;"""
          updated, count = re.subn(
              r"const SHORTCUTS = \[\n.*?\n\] as const;",
              replacement,
              source,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f'Expected one shortcut block, replaced {count}')
          path.write_text(updated)
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/apply-shortcut-truthfulness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/quantmail/src/app/settings/page.tsx .github/workflows/apply-shortcut-truthfulness.yml
          git commit -m "fix(quantmail): make settings shortcuts honest"
          git push origin HEAD:design/quantmail-settings-shortcut-truthfulness
