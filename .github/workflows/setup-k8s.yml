name: Setup K8s staging (one-time)

# Run this ONCE after a fresh EKS cluster to install ingress, create namespace,
# configmap, secrets, deploy all services, build Docker images, and go live.
# Requires: EKS cluster ACTIVE, node group ACTIVE, RDS available.
on:
  workflow_dispatch:
    inputs:
      db_password:
        description: 'RDS master password (quant user)'
        required: true
        type: string
      jwt_secret:
        description: 'JWT signing secret (min 64 chars)'
        required: true
        type: string
      skip_build:
        description: 'Skip Docker build (if images already in ECR)'
        required: false
        type: boolean
        default: false

concurrency:
  group: k8s-setup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    name: Full K8s staging setup
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
      REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
      RDS_ENDPOINT: quant-staging-postgres.cgj0y8m2azc2.us-east-1.rds.amazonaws.com
      RDS_DB: quant_staging
      RDS_USER: quant
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-k8s-setup-${{ github.run_id }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
          kubectl version --client
          kubectl get nodes

      # ---------------------------------------------------------------
      # 1. Install nginx-ingress (creates AWS NLB → gives us ELB hostname)
      # ---------------------------------------------------------------
      - name: Install nginx-ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/aws/deploy.yaml
          echo "Waiting for nginx-ingress controller to be ready..."
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=300s

      # ---------------------------------------------------------------
      # 2. Install cert-manager
      # ---------------------------------------------------------------
      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.3/cert-manager.yaml
          kubectl wait --namespace cert-manager \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/instance=cert-manager \
            --timeout=180s

      # ---------------------------------------------------------------
      # 3. Create namespace
      # ---------------------------------------------------------------
      - name: Create staging namespace
        run: |
          kubectl create namespace "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          echo "Namespace: $K8S_NAMESPACE ready"

      # ---------------------------------------------------------------
      # 4. Create ConfigMap
      # ---------------------------------------------------------------
      - name: Create ConfigMap
        run: |
          DB_URL="postgresql://${RDS_USER}:${{ inputs.db_password }}@${RDS_ENDPOINT}:5432/${RDS_DB}"
          kubectl create configmap quant-platform-production-config \
            --from-literal=DATABASE_URL="${DB_URL}" \
            --from-literal=DIRECT_URL="${DB_URL}" \
            --from-literal=NODE_ENV=production \
            --from-literal=NEXT_PUBLIC_APP_URL=https://quantmail.quantrinity.in \
            --from-literal=NEXT_PUBLIC_API_URL=https://quantmail.quantrinity.in/api \
            --from-literal=NEXT_PUBLIC_WS_URL=wss://quantmail.quantrinity.in \
            --from-literal=AI_PROVIDER=custom \
            --from-literal=AI_BASE_URL=https://quantmail-ai.quantrinity.workers.dev/v1 \
            --from-literal=AI_MODEL=@cf/meta/llama-3.1-8b-instruct \
            --from-literal=REDIS_URL=redis://redis:6379 \
            --from-literal=MEILISEARCH_HOST=http://meilisearch:7700 \
            --from-literal=QDRANT_URL=http://qdrant:6333 \
            --from-literal=PORT=3000 \
            -n "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          echo "ConfigMap created"

      # ---------------------------------------------------------------
      # 5. Create Secrets
      #
      #    NO CREDENTIAL LITERALS IN THIS FILE. Both of these used to be
      #    hardcoded here — an `AI_API_KEY` beginning `qk_c7f2…` and a
      #    `MEILISEARCH_API_KEY` of `ChangeMe_…` — which meant the real staging
      #    key was readable by anyone who could read the repo, and stayed
      #    readable in git history after any rotation. `bootstrap-aws.yml` was
      #    already moved to `secrets.AI_API_KEY`; this sibling workflow was
      #    missed and kept writing the literal.
      #
      #    These fail closed rather than falling back. A cluster-bootstrap
      #    workflow that quietly provisions a known-exposed key is worse than one
      #    that stops and says which secret to set, and the failure is loud at
      #    setup time instead of silent for months.
      # ---------------------------------------------------------------
      - name: Create K8s Secrets
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
        run: |
          missing=()
          [ -n "${AI_API_KEY:-}" ] || missing+=(AI_API_KEY)
          [ -n "${MEILISEARCH_API_KEY:-}" ] || missing+=(MEILISEARCH_API_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            for name in "${missing[@]}"; do
              echo "  gh secret set $name --repo \"$GITHUB_REPOSITORY\""
            done
            echo "Both were hardcoded in this workflow until now; the previous AI_API_KEY value is"
            echo "in git history and must be treated as compromised — rotate it, do not re-use it."
            exit 1
          fi
          kubectl create secret generic quant-platform-production-secrets \
            --from-literal=JWT_SECRET="${{ inputs.jwt_secret }}" \
            --from-literal=AI_API_KEY="$AI_API_KEY" \
            --from-literal=MEILISEARCH_API_KEY="$MEILISEARCH_API_KEY" \
            -n "$K8S_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          echo "Secrets created"

      # ---------------------------------------------------------------
      # 6. Apply infrastructure K8s manifests (Redis, Meilisearch, Qdrant)
      #    Replace old account ID and namespace with staging values
      # ---------------------------------------------------------------
      - name: Apply Redis
        run: |
          sed 's/quant-production/quant-staging/g; s/266176113726/${{ vars.AWS_ACCOUNT_ID }}/g' \
            infra/k8s/redis-deployment.yaml | kubectl apply -f -
          sed 's/quant-production/quant-staging/g' infra/k8s/redis-pvc.yaml | kubectl apply -f -
          sed 's/quant-production/quant-staging/g' infra/k8s/redis-service.yaml | kubectl apply -f -

      - name: Apply Meilisearch
        run: |
          sed 's/quant-production/quant-staging/g; s/266176113726/${{ vars.AWS_ACCOUNT_ID }}/g' \
            infra/k8s/meilisearch-deployment.yaml | kubectl apply -f -
          sed 's/quant-production/quant-staging/g' infra/k8s/meilisearch-pvc.yaml | kubectl apply -f -
          sed 's/quant-production/quant-staging/g' infra/k8s/meilisearch-service.yaml | kubectl apply -f -

      - name: Apply Qdrant
        run: |
          sed 's/quant-production/quant-staging/g; s/266176113726/${{ vars.AWS_ACCOUNT_ID }}/g' \
            infra/k8s/qdrant-deployment.yaml | kubectl apply -f -
          sed 's/quant-production/quant-staging/g' infra/k8s/qdrant-pvc.yaml | kubectl apply -f -
          sed 's/quant-production/quant-staging/g' infra/k8s/qdrant-service.yaml | kubectl apply -f -

      # ---------------------------------------------------------------
      # 7. Create placeholder app Deployments (will be updated with real images)
      #
      #    THIS FILE AND `bootstrap-aws.yml` DECLARE THE SAME TWO DEPLOYMENT
      #    NAMES WITH INCOMPATIBLE SELECTORS. Only one of them can ever have
      #    created the live objects, and it is this one.
      #
      #      * Here:              `app.kubernetes.io/name: quantmail-backend`
      #        bootstrap-aws.yml: `app: quant-quantmail-backend`
      #      * `spec.selector` is IMMUTABLE on an apps/v1 Deployment, so whichever
      #        workflow applied first owns the object and the other's apply fails
      #        with `spec.selector: Invalid value: ...: field is immutable`. They
      #        do not merge; one of them has simply been erroring.
      #      * `quant-quantmail-backend` in `quant-staging` was observed with
      #        `readinessProbe: null` and `livenessProbe: null`. That is this
      #        file's spec, not bootstrap-aws's — which means bootstrap-aws's
      #        probes have never landed on the live deployment and never will.
      #
      #    So the probes are declared HERE as well, below, on both placeholders.
      #    An unprobed Deployment is not a placeholder detail once `kubectl set
      #    image` has put a real image in it: it is the running app, and nothing
      #    pulls a wedged replica out of the Service. Nothing waits on the
      #    placeholder itself — the only `kubectl rollout status` in this file
      #    runs in section 10, after the real image is set — so a probe the
      #    `nginx:alpine` stand-in cannot pass costs nothing here.
      #
      #    BOTH STEPS BELOW ARE ALSO CREATE-IF-ABSENT, AND THAT IS LOAD-BEARING.
      #    Re-running this workflow against a cluster that is already serving
      #    would otherwise:
      #
      #      * reset `image` to `nginx:alpine` — a full outage, not a no-op;
      #      * repoint `envFrom` at `quant-platform-production-config`, while the
      #        running staging pods are fed by `quant-staging-config`;
      #      * repoint each Service's selector. This is the sharp one. A Service
      #        selector IS mutable, so applying the Service in the same heredoc
      #        over one created by `kubectl expose` in bootstrap-aws (selector
      #        `app: quant-quantmail-backend`) silently repoints it at a label no
      #        running pod carries, and the Service loses every endpoint.
      #
      #    That last point is why the guard covers the whole heredoc and not just
      #    the Deployment. Applying "only the Service, it is harmless" is the
      #    worst available outcome.
      #
      #    Guarding on existence keeps this workflow idempotent in the only sense
      #    that matters: running it twice must not be worse than running it once.
      # ---------------------------------------------------------------
      - name: Create QuantMail frontend Deployment
        run: |
          if kubectl get deployment quant-quantmail -n "$K8S_NAMESPACE" >/dev/null 2>&1; then
            echo "quant-quantmail already exists — leaving it and its Service alone."
            echo "Re-applying this placeholder would reset the image to nginx:alpine and"
            echo "repoint the Service selector off the running pods. See the note above."
            exit 0
          fi
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: quant-quantmail
            namespace: $K8S_NAMESPACE
            labels:
              app.kubernetes.io/name: quantmail
          spec:
            replicas: 2
            selector:
              matchLabels:
                app.kubernetes.io/name: quantmail
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: quantmail
              spec:
                containers:
                  - name: quant-quantmail
                    image: nginx:alpine
                    ports:
                      - containerPort: 3000
                        name: http
                    # Same numbers as the frontend probes in bootstrap-aws.yml, so
                    # neither file is a downgrade of the other. A GET of / on the
                    # Next.js server has no database behind it, so the tight 5s x 3
                    # readiness window that would be reckless on the backend is
                    # correct here: there is no shared dependency whose blip could
                    # fail every replica at once.
                    #
                    # NO BACKTICKS IN THIS HEREDOC. It opens as <<EOF, unquoted, so
                    # that K8S_NAMESPACE expands — which means a backtick would run
                    # its contents as a command on the runner and splice the output
                    # into the manifest, silently, without failing the step.
                    readinessProbe:
                      httpGet:
                        path: /
                        port: 3000
                      initialDelaySeconds: 10
                      periodSeconds: 5
                    livenessProbe:
                      httpGet:
                        path: /
                        port: 3000
                      initialDelaySeconds: 20
                      periodSeconds: 10
                    envFrom:
                      - configMapRef:
                          name: quant-platform-production-config
                      - secretRef:
                          name: quant-platform-production-secrets
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        memory: 1Gi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: quant-quantmail
            namespace: $K8S_NAMESPACE
          spec:
            selector:
              app.kubernetes.io/name: quantmail
            ports:
              - port: 3000
                targetPort: 3000
                name: http
          EOF

      - name: Create QuantMail backend Deployment
        run: |
          if kubectl get deployment quant-quantmail-backend -n "$K8S_NAMESPACE" >/dev/null 2>&1; then
            echo "quant-quantmail-backend already exists — leaving it and its Service alone."
            echo "Re-applying this placeholder would reset the image to nginx:alpine and"
            echo "repoint the Service selector off the running pods. See the note above."
            exit 0
          fi
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: quant-quantmail-backend
            namespace: $K8S_NAMESPACE
            labels:
              app.kubernetes.io/name: quantmail-backend
          spec:
            replicas: 2
            selector:
              matchLabels:
                app.kubernetes.io/name: quantmail-backend
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: quantmail-backend
              spec:
                containers:
                  - name: quantmail-backend
                    image: nginx:alpine
                    ports:
                      - containerPort: 3011
                        name: http
                    # AN OPEN SOCKET IS NOT READINESS, so this is an httpGet of
                    # /readyz and not tcpSocket on 3011. /readyz runs SELECT 1
                    # through Prisma and returns 503 when Postgres is unreachable;
                    # a TCP accept passes the instant Fastify binds, which is before
                    # Prisma has ever connected, and puts a pod that answers every
                    # /api/ request with a 502 into the Service at 1/1 Ready.
                    #
                    # 10s x 6 = a 60s window. An honest check also fails for reasons
                    # that are none of this pod's fault — an RDS failover, a
                    # security-group reload, a pool blip — and at 5s x 3 every
                    # replica reaches failureThreshold inside the same 15s, so one
                    # shared hiccup drains the whole Service at once. Widen the
                    # window; do not make the check dumber.
                    #
                    # No backticks here; see the note in the frontend step.
                    readinessProbe:
                      httpGet:
                        path: /readyz
                        port: 3011
                      initialDelaySeconds: 10
                      periodSeconds: 10
                      failureThreshold: 6
                    # Liveness stays deliberately dumber than readiness: /livez
                    # reports only that the process is alive, so a brief Postgres
                    # outage drains this pod without also restarting it.
                    livenessProbe:
                      httpGet:
                        path: /livez
                        port: 3011
                      initialDelaySeconds: 20
                      periodSeconds: 10
                    envFrom:
                      - configMapRef:
                          name: quant-platform-production-config
                      - secretRef:
                          name: quant-platform-production-secrets
                    env:
                      - name: PORT
                        value: '3011'
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        memory: 768Mi
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: quant-quantmail-backend
            namespace: $K8S_NAMESPACE
          spec:
            selector:
              app.kubernetes.io/name: quantmail-backend
            ports:
              - port: 3011
                targetPort: 3011
                name: http
          EOF

      # ---------------------------------------------------------------
      # 8. Apply Ingress (quantmail + api)
      # ---------------------------------------------------------------
      - name: Apply ClusterIssuer (Let's Encrypt)
        run: |
          sed 's/quant-production/quant-staging/g' \
            infra/k8s/letsencrypt-clusterissuer.yaml | kubectl apply -f -

      - name: Apply Ingress rules
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: quant-staging-main
            namespace: $K8S_NAMESPACE
            annotations:
              nginx.ingress.kubernetes.io/ssl-redirect: 'true'
              nginx.ingress.kubernetes.io/proxy-body-size: '50m'
              cert-manager.io/cluster-issuer: letsencrypt-prod
          spec:
            ingressClassName: nginx
            tls:
              - hosts:
                  - quantmail.quantrinity.in
                  - staging.quantrinity.in
                secretName: quant-staging-tls
            rules:
              - host: quantmail.quantrinity.in
                http:
                  paths:
                    - path: /api(/|\$)(.*)
                      pathType: ImplementationSpecific
                      backend:
                        service:
                          name: quant-quantmail-backend
                          port:
                            number: 3011
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: quant-quantmail
                          port:
                            number: 3000
              - host: staging.quantrinity.in
                http:
                  paths:
                    - path: /api(/|\$)(.*)
                      pathType: ImplementationSpecific
                      backend:
                        service:
                          name: quant-quantmail-backend
                          port:
                            number: 3011
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: quant-quantmail
                          port:
                            number: 3000
          EOF

      # ---------------------------------------------------------------
      # 9. Build + push Docker images (skip if images already in ECR)
      # ---------------------------------------------------------------
      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"

      - name: Build + push QuantMail frontend
        if: ${{ inputs.skip_build != true }}
        run: |
          SHA=$(git rev-parse HEAD)
          IMAGE="$REGISTRY/quant-quantmail:$SHA"
          docker build --pull -f apps/quantmail/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "QUANTMAIL_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Build + push QuantMail backend
        if: ${{ inputs.skip_build != true }}
        run: |
          SHA=$(git rev-parse HEAD)
          IMAGE="$REGISTRY/quant-quantmail-backend:$SHA"
          docker build --pull -f apps/quantmail/Dockerfile.backend -t "$IMAGE" .
          docker push "$IMAGE"
          echo "QUANTMAIL_BACKEND_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------
      # 10. Update deployments with real images
      # ---------------------------------------------------------------
      - name: Deploy QuantMail frontend image
        if: ${{ inputs.skip_build != true }}
        run: |
          kubectl set image deployment/quant-quantmail \
            quant-quantmail="$QUANTMAIL_IMAGE" \
            -n "$K8S_NAMESPACE"
          kubectl rollout status deployment/quant-quantmail -n "$K8S_NAMESPACE" --timeout=600s

      - name: Deploy QuantMail backend image
        if: ${{ inputs.skip_build != true }}
        run: |
          kubectl set image deployment/quant-quantmail-backend \
            quantmail-backend="$QUANTMAIL_BACKEND_IMAGE" \
            -n "$K8S_NAMESPACE"
          kubectl rollout status deployment/quant-quantmail-backend -n "$K8S_NAMESPACE" --timeout=600s

      # ---------------------------------------------------------------
      # 11. Run Prisma migrations
      # ---------------------------------------------------------------
      - name: Run Prisma migrations
        if: ${{ inputs.skip_build != true }}
        run: |
          DB_URL="postgresql://${RDS_USER}:${{ inputs.db_password }}@${RDS_ENDPOINT}:5432/${RDS_DB}"
          npm install -g pnpm
          pnpm install --frozen-lockfile
          DATABASE_URL="$DB_URL" pnpm --filter @quant/database exec prisma migrate deploy --schema=prisma/schema.prisma
          echo "Migrations done"

      # ---------------------------------------------------------------
      # 12. Get ELB hostname (for Cloudflare DNS)
      # ---------------------------------------------------------------
      - name: Get ELB hostname
        run: |
          echo "Waiting for ELB to be assigned..."
          for i in $(seq 1 30); do
            ELB=$(kubectl get svc ingress-nginx-controller -n ingress-nginx \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$ELB" ]; then
              echo "ELB_HOSTNAME=$ELB" >> "$GITHUB_ENV"
              break
            fi
            echo "Attempt $i/30 — waiting 10s..."
            sleep 10
          done

      - name: Output summary
        run: |
          echo "## ✅ K8s Staging Setup Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resource | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cluster | $EKS_CLUSTER |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Namespace | $K8S_NAMESPACE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RDS Endpoint | $RDS_ENDPOINT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ECR Registry | $REGISTRY |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **ELB Hostname** | **$ELB_HOSTNAME** |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Next step" >> "$GITHUB_STEP_SUMMARY"
          echo "Update all Cloudflare CNAME records to point to: \`$ELB_HOSTNAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ELB: $ELB_HOSTNAME"

      - name: Docker logout
        if: always()
        run: docker logout "$REGISTRY" || true
