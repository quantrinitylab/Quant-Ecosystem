name: Staging status snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-status.yml'

permissions:
  contents: read

jobs:
  status:
    name: Dump staging status
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-status-${{ github.run_id }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Collect status
        run: |
          mkdir -p infra/status
          {
            echo "# staging status (run ${{ github.run_id }})"
            echo "time: $(date -u +%FT%TZ)"
            echo ""
            echo "## deployments"
            kubectl get deploy -n "$K8S_NAMESPACE" -o wide || true
            echo ""
            echo "## pods"
            kubectl get pods -n "$K8S_NAMESPACE" -o wide || true
            echo ""
            echo "## backend logs (tail 60)"
            kubectl logs deployment/quant-quantmail-backend -n "$K8S_NAMESPACE" --tail=60 --all-containers 2>&1 || true
            echo ""
            echo "## ingress-nginx svc"
            kubectl get svc ingress-nginx-controller -n ingress-nginx -o wide || true
            echo ""
            echo "## ingress-nginx svc events (tail 15)"
            kubectl describe svc ingress-nginx-controller -n ingress-nginx | tail -15 || true
            echo ""
            echo "## namespace events (tail 25)"
            kubectl get events -n "$K8S_NAMESPACE" --sort-by=.lastTimestamp | tail -25 || true
          } > infra/status/staging-status.txt
          echo "--- file preview ---"
          cat infra/status/staging-status.txt

      - name: Publish to status-report branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f infra/status/staging-status.txt
          git commit -m "chore(status): staging status run ${{ github.run_id }} [skip ci]" || echo "nothing to commit"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin HEAD:refs/heads/status-report && echo "PUSH_OK" || echo "PUSH_FAILED"
