name: Terraform Production Safety

on:
  pull_request:
    paths:
      - "infra/terraform/environments/production/**"
      - "infra/terraform/environments/production-v2/**"
      - ".github/workflows/terraform-production-safety.yml"
  push:
    branches:
      - main
    paths:
      - "infra/terraform/environments/production/**"
      - "infra/terraform/environments/production-v2/**"
      - ".github/workflows/terraform-production-safety.yml"

permissions:
  contents: read

jobs:
  validate-production-root:
    name: validate-production-root
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e4423992e429da3f2e6d # v4.1.7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@633666f66e00661c1b89a2de1a9e38406186fda8 # v3.1.2
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: |
          terraform fmt -check infra/terraform/environments/production/safety.tf
          terraform fmt -check -recursive infra/terraform/environments/production-v2

      - name: Validate legacy production safety guard in isolation
        run: |
          fixture="$(mktemp -d)"
          cp infra/terraform/environments/production/safety.tf "$fixture/safety.tf"
          terraform -chdir="$fixture" init -backend=false -input=false
          terraform -chdir="$fixture" validate

      - name: Assert legacy production root remains blocked
        shell: bash
        run: |
          guard="infra/terraform/environments/production/safety.tf"
          values="infra/terraform/environments/production/terraform.tfvars"

          grep -F 'default     = "266176113726"' "$guard"
          grep -F 'default     = "quantrinity.in"' "$guard"
          grep -F 'default     = "cloudflare"' "$guard"
          grep -F 'condition     = var.expected_aws_account_id == "266176113726"' "$guard"
          grep -F 'condition     = var.application_domain == "quantrinity.in"' "$guard"
          grep -F 'condition     = var.public_dns_provider == "cloudflare"' "$guard"
          grep -F 'condition     = !var.enable_multi_region' "$guard"
          grep -F 'condition     = var.production_root_redesigned' "$guard"

          grep -F 'expected_aws_account_id      = "266176113726"' "$values"
          grep -F 'application_domain           = "quantrinity.in"' "$values"
          grep -F 'public_dns_provider           = "cloudflare"' "$values"
          grep -F 'enable_multi_region           = false' "$values"
          grep -F 'production_root_redesigned    = false' "$values"

      - name: Validate complete production-v2 root
        run: |
          terraform -chdir=infra/terraform/environments/production-v2 init -backend=false -input=false
          terraform -chdir=infra/terraform/environments/production-v2 validate

      - name: Assert production-v2 safety boundaries
        shell: bash
        run: |
          root="infra/terraform/environments/production-v2"
          main="$root/main.tf"
          variables="$root/variables.tf"

          grep -F 'default     = "266176113726"' "$variables"
          grep -F 'default     = "us-east-1"' "$variables"
          grep -F 'default     = "quantrinity.in"' "$variables"
          grep -F 'default     = "cloudflare"' "$variables"
          grep -F 'variable "eks_kubernetes_version"' "$variables"
          grep -F 'enable_nat_gateway_per_az      = false' "$main"
          grep -F 'endpoint_public_access     = false' "$main"

          approval_block="$(grep -A 5 'variable "bootstrap_root_approved"' "$variables")"
          grep -F 'default     = false' <<<"$approval_block"

          if grep -R -n --include='*.tf' -E 'aws\.secondary|vpc_secondary|cross_region|aws_route53|eu-west-1|quant\.app' "$root"; then
            echo "Unsafe legacy multi-region, Route 53, or domain configuration found in production-v2" >&2
            exit 1
          fi

          if grep -R -n --include='*.tf' -E 'https://\*\.' "$root"; then
            echo "Wildcard browser origin found in production-v2" >&2
            exit 1
          fi

          if grep -R -n --include='*.tf' -E 'backend[[:space:]]+"s3"' "$root"; then
            echo "Unreviewed remote-state backend found in production-v2" >&2
            exit 1
          fi

          if grep -R -n --include='*.tf' -E 'default[[:space:]]*=[[:space:]]*"1\.29"' "$root"; then
            echo "Legacy EKS 1.29 default found in production-v2" >&2
            exit 1
          fi
