name: Terraform production safety

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-production-safety.yml'
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-production-safety.yml'

permissions:
  contents: read

concurrency:
  group: terraform-production-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-production-root:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      # Keep this new guard formatted without turning unrelated legacy
      # formatting debt into a false negative for the safety boundary.
      - name: Check safety-guard formatting
        run: terraform fmt -check infra/terraform/environments/production/safety.tf

      - name: Initialize without remote state
        run: terraform -chdir=infra/terraform/environments/production init -backend=false

      - name: Validate production root
        run: terraform -chdir=infra/terraform/environments/production validate

      - name: Assert fail-closed production invariants
        shell: bash
        run: |
          set -euo pipefail
          root='infra/terraform/environments/production'
          grep -F 'default     = "266176113726"' "$root/safety.tf"
          grep -F 'default     = "quantrinity.in"' "$root/safety.tf"
          grep -F 'default     = "cloudflare"' "$root/safety.tf"
          grep -F 'default     = false' "$root/safety.tf"
          grep -F 'condition     = var.production_root_redesigned' "$root/safety.tf"
          if grep -R --line-number --fixed-strings 'production_root_redesigned = true' "$root"; then
            echo '::error::Production root must remain fail-closed until issue #129 redesign is complete.'
            exit 1
          fi
