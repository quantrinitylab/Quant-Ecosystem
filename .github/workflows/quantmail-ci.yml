name: QuantMail CI

on:
  push:
    branches: [feat/quantmail-*]
    paths:
      - 'apps/quantmail/**'
      - 'packages/shared-ui/**'
      - 'packages/brand/**'
      - 'packages/common/**'
  pull_request:
    paths:
      - 'apps/quantmail/**'
      - 'packages/shared-ui/**'
      - 'packages/brand/**'
      - 'packages/common/**'

concurrency:
  group: quantmail-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck-and-build:
    name: QuantMail typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @quant/database exec prisma generate --schema=prisma/schema.prisma

      - name: Build dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx turbo build --filter=@quant/quantmail...^...

      - name: Typecheck QuantMail
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx turbo typecheck --filter=@quant/quantmail

      - name: Build QuantMail
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx turbo build --filter=@quant/quantmail

      - name: Build success
        run: echo "✅ QuantMail builds successfully"
