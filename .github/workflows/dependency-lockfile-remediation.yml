name: Dependency lockfile remediation

on:
  push:
    branches: [security/dependency-audit-gate]
    paths:
      - package.json
      - .github/workflows/dependency-lockfile-remediation.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-audit-gate
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Regenerate lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit deterministic lockfile update
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo '::error file=pnpm-lock.yaml::Expected global brace-expansion override to update the lockfile'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'fix: refresh lockfile with patched brace-expansion'
          git push origin HEAD:security/dependency-audit-gate
