name: Fix vacation responder input types

on:
  push:
    branches:
      - design/quantmail-settings-live-vacation-responder
    paths:
      - .agent/fix-vacation-types.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: design/quantmail-settings-live-vacation-responder
      - name: Apply type fix and remove staging files
        shell: bash
        run: |
          python .agent/fix-vacation-types.py
          rm .agent/fix-vacation-types.py .github/workflows/fix-vacation-types.yml
          rmdir .agent
          git config user.name "quantrinitylab"
          git config user.email "roshanisingh70049234@gmail.com"
          git add -A
          git commit -m "fix(quantmail): use supported vacation input types"
          git push
