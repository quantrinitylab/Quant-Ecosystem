name: update-cloudflare-dns

on:
  workflow_dispatch:
    inputs:
      ip_address:
        description: 'New origin IPv4 address'
        required: true
        default: '13.219.229.113'

jobs:
  update-dns:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Update DNS in Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEW_IP: ${{ inputs.ip_address }}
        run: |
          set -euo pipefail
          echo ">> Searching for zone quantmail.in..."
          ZONE_RESP=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=quantmail.in" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json")
          echo "Zone search response: $(echo "$ZONE_RESP" | jq -c '{success, errors, result_count}')"
          
          ZONE_ID=$(echo "$ZONE_RESP" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "Zone quantmail.in not found with this token. Checking available zones..."
            curl -s -X GET "https://api.cloudflare.com/client/v4/zones" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" | jq -c '.result[]? | {id, name}' || true
            exit 1
          fi

          echo "Found Zone ID: $ZONE_ID"
          echo ">> Fetching existing DNS records..."
          RECORDS=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=A" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json")
          echo "$RECORDS" | jq -c '.result[]? | {id, name, content, proxied}' || true

          ROOT_ID=$(echo "$RECORDS" | jq -r '.result[]? | select(.name=="quantmail.in") | .id' | head -1)
          if [ -n "$ROOT_ID" ]; then
            echo "Updating A record for quantmail.in (Record ID: $ROOT_ID) to $NEW_IP..."
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$ROOT_ID" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"content\":\"$NEW_IP\",\"proxied\":true}" | jq -c '{success, errors}'
          else
            echo "Creating A record for quantmail.in -> $NEW_IP..."
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"quantmail.in\",\"content\":\"$NEW_IP\",\"proxied\":true,\"ttl\":1}" | jq -c '{success, errors}'
          fi

          WWW_ID=$(echo "$RECORDS" | jq -r '.result[]? | select(.name=="www.quantmail.in") | .id' | head -1)
          if [ -n "$WWW_ID" ]; then
            echo "Updating A record for www.quantmail.in (Record ID: $WWW_ID) to $NEW_IP..."
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$WWW_ID" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"content\":\"$NEW_IP\",\"proxied\":true}" | jq -c '{success, errors}'
          else
            echo "Creating A record for www.quantmail.in -> $NEW_IP..."
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"www.quantmail.in\",\"content\":\"$NEW_IP\",\"proxied\":true,\"ttl\":1}" | jq -c '{success, errors}'
          fi
          echo ">> Cloudflare DNS update completed successfully!"
