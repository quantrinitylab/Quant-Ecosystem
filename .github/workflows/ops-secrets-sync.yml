name: Ops secrets sync (GitHub environment to the VM)

# Copies a short, fixed list of settings from the GitHub environment `oci-staging` into /etc/quant/secrets.env on
# vm-app, so the owner never has to type a key on a server and no key ever has to travel through a chat or a ticket.
#
# WHY IT EXISTS: R2 (S3-compatible) credentials, bucket names and the backup destinations have to reach the VM. The
# deploy workflow deliberately never sees the VM's secrets, and that stays true: this is the ONE reviewed path for
# adding or rotating the names listed below, and nothing else can travel through it.
#
# HOW: the values are read from the job environment (only the names written out in `env:` below can ever be present),
# validated, streamed over SSH into a 0600 file, and applied by infra/oci/secrets/sync-secrets.sh, which
#   * accepts only allowlisted names whose values match a strict format (it refuses anything else),
#   * never prints a value, only the name, what changed and the value length,
#   * backs up the old file (0600, newest five kept) and swaps the new one in with an atomic rename,
#   * keeps the file's mode, owner and group, and every other line exactly as it was,
#   * never deletes anything.
# The report is sealed for the ops key like the other ops workflows, so even names and lengths stay out of the public log.
#
# HOW TO USE: add or change the secret/variable in GitHub (Settings > Environments > oci-staging), then run this
# workflow. Choose restart=backends to make the running backends read the new values; they are recreated one command
# at a time with the image tag that is already running, so no version changes.
#
# SAFETY
#   * Runs only from main, so a branch cannot swap in a different script and run it with the deploy key.
#   * No new secret type: reuses OCI_DEPLOY_SSH_KEY, vars.VM_APP_IP and vars.OCI_SSH_USER of `oci-staging`.
#   * Adding a name needs a reviewed change in BOTH this file and sync-secrets.sh, and a test in test-sync-secrets.sh.

on:
  workflow_dispatch:
    inputs:
      restart:
        description: 'Recreate containers so they read the new values (none = only write the file)'
        required: false
        default: 'none'
        type: choice
        options: ['none', 'backends', 'all']

permissions:
  contents: read

concurrency:
  group: ops-secrets-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Apply allowlisted settings on vm-app
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: oci-staging
    permissions:
      contents: read
    env:
      VM_APP_IP: ${{ vars.VM_APP_IP }}
      OCI_SSH_USER: ${{ vars.OCI_SSH_USER || 'opc' }}
      RESTART: ${{ inputs.restart || 'none' }}
      # ---- the complete list of settings this workflow can send (keep in step with sync-secrets.sh) ----
      # Drive and shared object storage on Cloudflare R2
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
      DRIVE_R2_BUCKET: ${{ vars.DRIVE_R2_BUCKET }}
      ATTACHMENTS_BUCKET: ${{ vars.ATTACHMENTS_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # Database backups: primary and second destination (separate credentials from the app on purpose)
      BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
      BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
      BACKUP_S3_FORCE_PATH_STYLE: ${{ vars.BACKUP_S3_FORCE_PATH_STYLE }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      BACKUP2_S3_ENDPOINT: ${{ vars.BACKUP2_S3_ENDPOINT }}
      BACKUP2_S3_BUCKET: ${{ vars.BACKUP2_S3_BUCKET }}
      BACKUP2_S3_REGION: ${{ vars.BACKUP2_S3_REGION }}
      BACKUP2_S3_FORCE_PATH_STYLE: ${{ vars.BACKUP2_S3_FORCE_PATH_STYLE }}
      BACKUP2_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP2_S3_ACCESS_KEY_ID }}
      BACKUP2_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP2_S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up SSH to vm-app
        shell: bash
        env:
          OCI_DEPLOY_SSH_KEY: ${{ secrets.OCI_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VM_APP_IP" || { echo 'vars.VM_APP_IP is empty' >&2; exit 1; }
          [[ "$VM_APP_IP" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'VM_APP_IP looks invalid' >&2; exit 1; }
          [[ "$OCI_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo 'OCI_SSH_USER looks invalid' >&2; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          bash scripts/prepare-oci-deploy-key.sh "$HOME/.ssh/oci-deploy"
          ssh-keyscan -H "$VM_APP_IP" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Collect the settings that are present
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          pairs="$RUNNER_TEMP/qsync-pairs.txt"
          : >"$pairs"
          sent=()
          for name in CLOUDFLARE_R2_ACCOUNT_ID DRIVE_R2_BUCKET ATTACHMENTS_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY \
                      BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET BACKUP_S3_REGION BACKUP_S3_FORCE_PATH_STYLE BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY \
                      BACKUP2_S3_ENDPOINT BACKUP2_S3_BUCKET BACKUP2_S3_REGION BACKUP2_S3_FORCE_PATH_STYLE BACKUP2_S3_ACCESS_KEY_ID BACKUP2_S3_SECRET_ACCESS_KEY; do
            val="${!name-}"
            if [ -n "$val" ]; then
              # one line per pair; anything with a newline or a space is refused before it leaves the runner
              [[ "$val" != *$'\n'* && "$val" != *' '* ]] || { echo "the value of $name contains whitespace, refusing" >&2; exit 1; }
              printf '%s=%s\n' "$name" "$val" >>"$pairs"
              sent+=("$name")
            fi
          done
          [ "${#sent[@]}" -gt 0 ] || { echo 'no allowlisted setting is configured in the environment, nothing to do' >&2; exit 1; }
          echo "settings present (names only): ${sent[*]}"

      - name: Send to vm-app and apply
        shell: bash
        run: |
          set -euo pipefail
          pairs="$RUNNER_TEMP/qsync-pairs.txt"
          # The pairs travel on stdin into a 0600 file in the SSH user's home; the VM-side script deletes it.
          ssh -i "$HOME/.ssh/oci-deploy" -o BatchMode=yes -o LogLevel=ERROR -o ConnectTimeout=15 \
            "$OCI_SSH_USER@$VM_APP_IP" 'umask 077; cat >"$HOME/.qsync-in"' <"$pairs"
          bash infra/oci/ops/run-remote-report.sh infra/oci/secrets/sync-secrets.sh \
            "QSYNC_INPUT=/home/$OCI_SSH_USER/.qsync-in" "QSYNC_RESTART=$RESTART"

      - name: Clean up the runner
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/qsync-pairs.txt" "$HOME/.ssh/oci-deploy"
