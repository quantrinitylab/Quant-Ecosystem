name: Minimatch brace compatibility remediation

on:
  push:
    branches:
      - security/dependency-audit-gate
    paths:
      - package.json
      - patches/minimatch@3.1.5.patch
      - patches/minimatch@8.0.7.patch
      - .github/workflows/minimatch-brace-compat-remediation.yml

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Install and regenerate lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Verify QuantMail lint compatibility
        shell: bash
        run: |
          set +e
          pnpm --filter @quant/quantmail lint > /tmp/quantmail-lint.log 2>&1
          status=$?
          set -e
          cat /tmp/quantmail-lint.log
          if [ "$status" -ne 0 ]; then
            {
              echo '### QuantMail lint failure'
              echo '```text'
              tail -n 120 /tmp/quantmail-lint.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            encoded="$(tail -n 40 /tmp/quantmail-lint.log | sed 's/%/%25/g; s/\r/%0D/g' | awk 'BEGIN { ORS="%0A" } { print }')"
            echo "::error title=QuantMail lint failure::$encoded"
            exit "$status"
          fi

      - name: Verify dependency audit fixtures
        run: pnpm test:dependency-audit

      - name: Verify live high and critical audit
        run: pnpm audit:dependencies

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: regenerate lockfile for minimatch patches'
          git push
